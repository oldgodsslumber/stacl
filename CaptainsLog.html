function shipTalentKey(n) { return String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
const SHIP_TALENT_BY_KEY = {};
SHIP_TALENTS.concat(SHIP_TALENTS_EXTRA).forEach(t => SHIP_TALENT_BY_KEY[shipTalentKey(t.name)] = t);
function findShipTalent(name) {
  const k = shipTalentKey(name);
  if (SHIP_TALENT_BY_KEY[k]) return SHIP_TALENT_BY_KEY[k];
  const alias = SHIP_TALENT_ALIASES[k];
  return alias ? SHIP_TALENT_BY_KEY[shipTalentKey(alias)] || null : null;
}
// A talent object ready to store on S.ship.talents. Catalog entries carry
// their description and icon; unknown names come through as custom talents.
function shipTalentObj(name) {
  const c = findShipTalent(name);
  return c ? {name:c.name, desc:c.desc, icon:c.icon} : {name:String(name).trim(), desc:'', icon:''};
}

// game-icons.net has no API of its own — these are Iconify URLs filtered to
// that set, drawn as masks so they take the current text colour.
function talIconURL(slug) { return 'https://api.iconify.design/game-icons/' + encodeURIComponent(slug) + '.svg'; }
// size 0/null leaves the dimensions to CSS (the map cells size icons at 1em so
// they follow the grid's responsive font-size breakpoints).
function talIconHTML(slug, size, style) {
  const u = talIconURL(slug || 'round-star');
  const dims = size===0||size===null ? '' : `width:${size||14}px;height:${size||14}px;`;
  return `<span class="tal-icon" style="${dims}${style||''}-webkit-mask-image:url('${u}');mask-image:url('${u}')"></span>`;
}
// Any icon value from saves: a game-icons slug renders as a themed mask;
// anything else (legacy emoji / free text) renders as escaped text, so old
// maps keep working untouched.
function giIsSlug(v) { return /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(String(v||'').trim()); }
function giIconHTML(v, size) {
  if (!v) return '';
  return giIsSlug(v) ? talIconHTML(String(v).trim(), size===undefined?null:size) : escH(v);
}

// <select> options for the full catalog; talents already on the ship are disabled.
function shipTalentOptions(selectedKeys) {
  const opt = t => `<option value="${escH(t.name)}"${selectedKeys.includes(shipTalentKey(t.name))?' disabled':''}>${escH(t.name)}${t.req?' ('+escH(t.req)+')':''}</option>`;
  return `<option value="">— add from talent list —</option>`
    + `<optgroup label="Standard Talents">${SHIP_TALENTS.map(opt).join('')}</optgroup>`
    + `<optgroup label="Class-Specific Technology">${SHIP_TALENTS_EXTRA.map(opt).join('')}</optgroup>`;
}

// Whole-word match against SHIP_THUMBS — a plain substring test gave the
// Crossfield class the Ross thumbnail ('crossfield'.includes('ross')).
function matchShipThumb(className) {
  const cls = String(className||'').toLowerCase();
  const key = Object.keys(SHIP_THUMBS).find(k => new RegExp('(^|[^a-z])' + k + '([^a-z]|$)').test(cls));
  return key ? SHIP_THUMBS[key] : '';
}

let ACTIVE_SLOT = 0;
let S = defaultState();
window._mapZoom = null;

let _quotaWarned = false;
function saveSlot() {
  try {
    localStorage.setItem(`stcl_slot_${ACTIVE_SLOT}`, JSON.stringify(S));
    localStorage.setItem('stcl_active_slot', ACTIVE_SLOT);
    _quotaWarned = false;
  } catch(e) {
    // Every mutating action saves before it repaints, so an unhandled throw
    // here leaves the UI frozen mid-action with no explanation.
    if (!_quotaWarned) {
      _quotaWarned = true;
      setTimeout(()=>alert('Could not save: this browser\u2019s storage for the app is full.\n\n'
        + 'Your work is still on screen but will be lost if you reload. Use SAVE FILE to keep it, '
        + 'then trim long log entries or clear an unused mission slot.'), 0);
    }
  }
  updateSlotLabels();
  hudBroadcast();
}

function loadSlot(n) {
  ACTIVE_SLOT = n;
  const raw = localStorage.getItem(`stcl_slot_${n}`);
  if (raw) {
    try {
      const saved = JSON.parse(raw);
      S = defaultState();
      if (saved.char) S.char = Object.assign(defaultChar(), saved.char);
      if (saved.ship) S.ship = Object.assign(defaultShip(), saved.ship);
      if (saved.sectors) S.sectors = saved.sectors;
      if (saved.activeSector !== undefined) S.activeSector = saved.activeSector;
      if (saved.npcs) S.npcs = saved.npcs;
      if (saved.combatEnemies) S.combatEnemies = saved.combatEnemies;
      if (saved.combatOpp) S.combatOpp = saved.combatOpp;
      if (saved.extTasks) S.extTasks = saved.extTasks;
      if (saved.playerStress) S.playerStress = saved.playerStress;
      if (saved.log) S.log = saved.log;
    } catch(e) { S = defaultState(); }
    // Outside the parse guard on purpose: a migration hiccup must never be
    // the reason a good save gets replaced by a blank one.
    try { migrateState(); } catch(e) {}
  } else {
    S = defaultState();
  }
  // These hold live references into the slot we just replaced. A stale zoom would
  // let edits made in the old mission's sub-zone land in the new mission's cells.
  window._mapZoom = null;
  window._selectedMapCell = null;
  // An open modal's Save handler acts on whatever S is current when it
  // fires, so leaving one open across a slot change writes the edit into
  // the wrong mission. Drop it, along with the other per-mission UI state.
  closeModal();
  window._confirmFn = null;
  window._promptFn = null;
  window._focusDrafts = {};
  window._shipClassPreview = null;
  window._storyResults = {};      // last mission's oracle rolls
  window._hudOracleQueue = [];    // and its HUD ticker feed
  window._lastOracleResult = null;
  window._lastRollResult = null;
  window._lastShipRollResult = null;
  window._lastOppRollResult = null;
  _lastRollData = null;
  _hudVis.npcSpot = -1;   // roster indices do not survive a slot change
  window._csShipMode = 'era';
  localStorage.setItem('stcl_active_slot', n);
  updateSlotLabels();
  // Nothing else pushes to the HUD on a slot change, so the overlay used to
  // keep showing the previous mission until some later edit called saveSlot.
  hudBroadcast();
}

// A 25-cell grid the renderers can trust. Older/hand-edited saves have
// turned up with 3 cells, and every map renderer indexes 0..24 blind.
function normalizeCells(list, count, make) {
  const out = Array.isArray(list) ? list.slice(0, count) : [];
  while (out.length < count) out.push(make(out.length));
  for (let i = 0; i < count; i++) {
    if (!out[i] || typeof out[i] !== 'object') out[i] = make(i);
  }
  return out;
}

function normalizeSector(sec, idx) {
  const s2 = (sec && typeof sec === 'object') ? sec : {};
  s2.name = typeof s2.name === 'string' && s2.name ? s2.name : `Sector ${String(idx+1).padStart(3,'0')}`;
  s2.cells = normalizeCells(s2.cells, 25, () => ({type:'unknown', isVoid:false, name:'', icon:'', notes:'', feature:'', subZone:null}));
  s2.cells.forEach(c => {
    if (c.subZone && typeof c.subZone === 'object') {
      c.subZone.cells = normalizeCells(c.subZone.cells, 25, () => ({name:'', icon:'', isVoid:false, notes:'', feature:'', type:'unknown'}));
      if (!(c.subZone.currentCell >= 0 && c.subZone.currentCell < 25)) c.subZone.currentCell = 12;
    } else if (c.subZone) { c.subZone = null; }
  });
  if (!(s2.currentCell >= 0 && s2.currentCell < 25)) s2.currentCell = 12;
  return s2;
}

// Normalises vocabularies and geometry that changed shape between versions.
function migrateState() {
  const fixAttitude = o => {
    if (!o || typeof o !== 'object') return;
    const a = NPC_ATTITUDE_ALIASES[o.attitude];
    if (a) o.attitude = a;
  };
  if (Array.isArray(S.npcs)) S.npcs.forEach(fixAttitude);
  if (Array.isArray(S.combatEnemies)) S.combatEnemies.forEach(fixAttitude);
  if (S.char) {
    const r = RANK_ALIASES[S.char.rank];
    if (r) S.char.rank = r;
    // A character still in creation under the old wizard (point-buy, made-up
    // species bonuses) restarts the lifepath; finished characters are untouched.
    const c = S.char;
    if (!c.creationComplete && (!c._lp || c._lp.v !== 2)) {
      ATTRIBUTES.forEach(a => c[a.key] = 7);
      DISCIPLINES.forEach(d => c[d.key] = 1);
      const old = Array.isArray(c.values) ? c.values : [];
      c.values = [old[1] || '', old[3] || '', old[4] || '', old[5] || ''];   // env, education, career, final
      c.valuesUsed = [false,false,false,false]; c.valuesChallenged = [false,false,false,false]; c.valuesDetGranted = [false,false,false,false];
      c.focuses = []; c._lp = lpDefault();
      c._selectedSpecies = ''; c._selectedEnv = ''; c._selectedUpbringing = ''; c._selectedTrack = '';
      c.careerLength = ''; c.careerEvent = ''; c.careerEvent2 = '';
      c.creationStep = 0;
    }
  }
  // Geometry: never leave the map tab with a grid it cannot render, and
  // never leave activeSector pointing at nothing (that hid the sector
  // switcher, so the user had no control to recover with).
  if (!Array.isArray(S.sectors) || !S.sectors.length) S.sectors = [defaultSector()];
  S.sectors = S.sectors.map(normalizeSector);
  if (!(S.activeSector >= 0 && S.activeSector < S.sectors.length)) S.activeSector = 0;
  if (S.ship && (!Array.isArray(S.ship.interiorCells) || S.ship.interiorCells.length !== 50)) {
    S.ship.interiorCells = normalizeCells(S.ship.interiorCells, 50,
      i => ({name:'', icon:'', notes:'', isVoid: SHIP_INTERIOR_HULL[i]}));
  }
  // Ship talents saved before the catalog existed have no description or
  // icon (class selection used to store bare names). Backfill by name match,
  // normalizing variant spellings; hand-entered text is never overwritten.
  if (S.ship) {
    if (!Array.isArray(S.ship.talents)) S.ship.talents = [];
    S.ship.talents = S.ship.talents
      .map(t => typeof t === 'string' ? {name:t, desc:'', icon:''} : t)
      .filter(t => t && t.name);
    S.ship.talents.forEach(t => {
      const c = findShipTalent(t.name);
      if (c) {
        t.name = c.name;
        if (!t.desc) t.desc = c.desc;
        if (!t.icon) t.icon = c.icon;
      }
    });
  }
  if (!Array.isArray(S.playerStress) || S.playerStress.length !== 3) S.playerStress = [false,false,false];
  if (!Array.isArray(S.log)) S.log = [];
  if (!Array.isArray(S.npcs)) S.npcs = [];
  if (!Array.isArray(S.combatEnemies)) S.combatEnemies = [];
  // Saves written before these were persisted simply have no field.
  if (!Array.isArray(S.combatOpp)) S.combatOpp = [];
  if (!Array.isArray(S.extTasks)) S.extTasks = [];
  S.combatOpp.forEach(o => {
    if (!(o.circles >= 1)) o.circles = 3;
    if (!Array.isArray(o.stress)) o.stress = Array(o.circles).fill(false);
  });
  S.extTasks.forEach(t => {
    if (!(t.circles >= 1)) t.circles = 5;
    if (!Array.isArray(t.progress)) t.progress = Array(t.circles).fill(false);
  });
}

function updateSlotLabels() {
  for(let i=0;i<3;i++){
    const btn = document.getElementById(`slot${i}`);
    const raw = localStorage.getItem(`stcl_slot_${i}`);
    let label = `MISSION ${i+1}`;
    if(raw){try{const d=JSON.parse(raw);const n=(d.char?.name||'').trim();if(n){const parts=n.split(/\s+/);label=parts[parts.length-1].toUpperCase();}}catch(e){}}
    btn.textContent = label;
    btn.className = `slot-btn${i===ACTIVE_SLOT?' active':''}`;
  }
}

// The File System Access pickers are blocked in cross-origin frames — e.g.
// when itch.io runs the app embedded in its page — so there (or if a picker
// fails for any reason other than the player cancelling) save and load fall
// back to a plain download and a plain file input.
function _pickersAllowed() {
  try { return window.self === window.top && !!window.showSaveFilePicker; } catch(e) { return false; }
}
function _downloadSave(json) {
  const url = URL.createObjectURL(new Blob([json], {type: 'application/json'}));
  const a = document.createElement('a');
  a.href = url; a.download = 'captains-log.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function _chooseSaveFile() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => _applyImport(ev.target.result);
    reader.readAsText(file);
  };
  inp.click();
}

async function exportToFile() {
  const data = { version: 1, active: ACTIVE_SLOT, slots: {} };
  for (let i = 0; i < 3; i++) {
    const raw = localStorage.getItem(`stcl_slot_${i}`);
    if (raw) try { data.slots[i] = JSON.parse(raw); } catch(e) {}
  }
  const json = JSON.stringify(data, null, 2);
  if (!_pickersAllowed()) { _downloadSave(json); return; }
  try {
    const fh = await window.showSaveFilePicker({
      suggestedName: 'captains-log.json',
      types: [{ description: "Captain's Log Save", accept: { 'application/json': ['.json'] } }]
    });
    const writable = await fh.createWritable();
    await writable.write(json);
    await writable.close();
  } catch(e) { if (e.name !== 'AbortError') _downloadSave(json); }
}

function importFromFile() {
  if (!_pickersAllowed() || !window.showOpenFilePicker) { _chooseSaveFile(); return; }
  window.showOpenFilePicker({
    types: [{ description: "Captain's Log Save", accept: { 'application/json': ['.json'] } }]
  }).then(async ([fh]) => {
    const file = await fh.getFile();
    _applyImport(await file.text());
  }).catch(e => { if (e.name !== 'AbortError') _chooseSaveFile(); });
}

function _applyImport(text) {
  try {
    const data = JSON.parse(text);
    if (!data.slots) throw new Error('Invalid save file.');
    showConfirm('Load save file? This will overwrite all current mission slots.', ()=>{
      for (let i = 0; i < 3; i++) {
        if (data.slots[i]) localStorage.setItem(`stcl_slot_${i}`, JSON.stringify(data.slots[i]));
        else localStorage.removeItem(`stcl_slot_${i}`);
      }
      // An out-of-range index writes every later save to a slot no button
      // can reach, and the app keeps landing there on reload.
      const act = Number(data.active);
      loadSlot(Number.isInteger(act) && act >= 0 && act <= 2 ? act : 0);
      renderCurrentTab();
    }, 'LOAD FILE', false);
  } catch(e) { openModal(`<p style="font-size:13px;color:var(--danger);margin-bottom:16px">Failed to load file: ${escH(e.message)}</p><button class="btn" onclick="closeModal()" style="width:100%">OK</button>`); }
}

function selectSlot(n) {
  if(n===ACTIVE_SLOT)return;
  loadSlot(n); renderCurrentTab();
}

function renderCharacter() {

  if (_officerSubTab === 'ship') return tabs + renderShipTab();
  return tabs + renderSheet();
}

function renderSheet() {
  const c = S.char;
  // Attribute grid
  let attrHTML = '<div class="attr-grid">';
  ATTRIBUTES.forEach(a => {
    attrHTML += `<div class="attr-box">
      <div class="attr-abbr">${a.abbr}</div>
      <div class="attr-val" id="attr-${a.key}">${c[a.key]}</div>

        <button class="res-btn" data-symbol="-" onclick="adjAttr('${a.key}',-1)"></button>
        <button class="res-btn" data-symbol="+" onclick="adjAttr('${a.key}',1)"></button>
      </div>
      <div class="attr-full">${a.full}</div>
    </div>`;
  });
  attrHTML += '</div>';

  // Discipline dots
  let discHTML = '<div class="disc-grid">';
  DISCIPLINES.forEach(d => {
    const rank = c[d.key] || 1;
    let dots = '<div class="disc-dots">';
    for(let i=1;i<=5;i++) dots += `<div class="dot${i<=rank?' filled':''}" onclick="setDisc('${d.key}',${i})" ondblclick="setDisc('${d.key}',1)" title="${d.full} ${i}"></div>`;
    dots += '</div>';
    discHTML += `<div class="disc-row">
      <span style="font-size:9px;color:var(--muted);min-width:28px">${d.abbr}</span>
      <span class="disc-name">${d.full}</span>
      ${dots}
      <span style="font-size:11px;color:var(--accent);min-width:16px">${rank}</span>
    </div>`;
  });
  discHTML += '</div>';

  // Determination
  let detHTML = '';
  for(let i=0;i<3;i++) detHTML += `<span class="det-dot${i<c.determination?' filled':''}" onclick="toggleDet(${i})"></span>`;

  // Values
  let valHTML = '';
  c.values.forEach((v,i) => {
    const used = c.valuesUsed[i];
    const challenged = c.valuesChallenged[i];
    valHTML += `<div class="value-row">
      <input class="value-input" value="${escH(v)}" placeholder="Value ${i+1}…" onchange="setValueText(${i},this.value)">
      <button class="value-toggle${used?' used':''}" onclick="toggleValueUsed(${i})">${used?'USED':'Use'}</button>
      <button class="value-toggle${challenged?' challenged':''}" onclick="toggleValueChallenged(${i})">${challenged?'CHALLENGED':'Challenge'}</button>
    </div>`;
  });

  // Focuses
  let focHTML = '';
  if(c.focuses.length) {
    focHTML = c.focuses.map((f,i)=>`<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--border);font-size:12px">
      <span style="flex:1">${escH(f)}</span>
      <button class="btn btn-xs btn-danger" onclick="removeFocus(${i})">✕</button>
    </div>`).join('');
  }

  // Traits
  let traitHTML = '';
  if(c.traits.length) {
    traitHTML = c.traits.map((t,i)=>`<div style="display:inline-flex;align-items:center;gap:4px;margin:2px;padding:2px 8px;border:1px solid var(--border);border-radius:10px;font-size:10px">
      ${escH(t)}<button onclick="removeTrait(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px">✕</button>
    </div>`).join('');
  }

  // Gear
  let gearHTML = '';
  if(c.gear.length) {
    gearHTML = '<ul class="gear-list">' + c.gear.map((g,i)=>`<li class="gear-item"><span class="gear-name">${escH(g.name)}</span><span style="color:var(--muted);font-size:10px">${escH(g.qty||'')}</span><button class="btn btn-xs btn-danger" onclick="removeGear(${i})">✕</button></li>`).join('') + '</ul>';
  }

  // Mission progress
  let progHTML = '<div style="display:flex;gap:3px;flex-wrap:wrap">';
  for(let i=0;i<15;i++) progHTML += `<div style="width:22px;height:22px;border-radius:3px;border:1px solid var(--border);background:${i<c.missionProgress?'var(--accent)':'var(--surface2)'};cursor:pointer;transition:all 0.2s" onclick="setMissionProgress(${i+1})" title="Step ${i+1}"></div>`;
  progHTML += '</div>';

  return `
  <div class="card">
    <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">

function renderCreation() {
  const step = S.char.creationStep || 0;
  const info = CREATION_STEPS[step];
  let prog = '<div class="wizard-progress">';
  CREATION_STEPS.forEach((_,i) => prog += `<div class="wizard-step${i<step?' done':i===step?' active':''}"></div>`);
  prog += '</div>';

  let body = '';
  switch(step) {
    case 0: body = renderLP0(); break;
    case 1: body = renderLP1(); break;
    case 2: body = renderLP2(); break;
    case 3: body = renderLP3(); break;
    case 4: body = renderLP4(); break;
    case 5: body = renderLP5(); break;
    case 6: body = renderCS7(); break;
    case 7: body = renderCS8(); break;
  }

  return `<div class="card">
    <div style="font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Step ${step+1} of ${CREATION_STEPS.length}</div>
    <div class="header-title glow">${info.title}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px;margin-bottom:12px">${info.sub}</div>
    ${prog}
    ${body}
    <div class="wizard-nav">
      ${step>0?'<button class="btn" onclick="creationBack()">← Back</button>':''}
      <button class="btn btn-accent" style="margin-left:auto" onclick="creationNext()">${step<CREATION_STEPS.length-1?'Next →':'Finish!'}</button>
    </div>
  </div>`;
}

function renderCS7() {
  const c = S.char;
  // Sync ship name from assignment if ship name not yet set
  if (!S.ship.name && c.assignment) {
    S.ship.name = c.assignment.replace(/\s+NCC-\S+$/i,'').trim();
    const _rm = c.assignment.match(/NCC-\S+$/i);
    if (_rm) S.ship.registry = _rm[0];
    saveSlot();
  }
  const species = c.species || '';
  const rankOpts = RANKS.map(r=>`<option${c.rank===r?' selected':''}>${r}</option>`).join('');
  let dirRows = DIRECTIVE_TABLE.map(d=>{
    const sel = c.directive === d.desc;
    return `<tr onclick="setCreationDirective('${escQ(d.desc)}')" class="${sel?'selected':''}">
      <td>${d.d}</td><td><strong${sel?' style="color:var(--accent)"':''}>${d.name}</strong><br><span style="color:var(--muted)">${d.desc}</span></td>
    </tr>`;
  }).join('');
  return `
  <div class="field"><label>Full Name</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input style="flex:1" value="${escH(c.name)}" placeholder="e.g. James T. Kirk…" onchange="saveCharField('name',this.value)">
      <button class="btn btn-sm btn-accent" onclick="rollRandomName()" title="Random name for ${escH(species||'selected species')}">🎲 Random</button>
    </div>
  </div>
  <div class="field"><label>Rank</label><select onchange="saveCharField('rank',this.value)"><option value="">— Select Rank —</option>${rankOpts}</select></div>
  <div class="field"><label>Assignment / Ship</label><input value="${escH(S.ship.name?(S.ship.name+(S.ship.registry?' '+S.ship.registry:'')):c.assignment)}" placeholder="e.g. USS Enterprise NCC-1701" onchange="saveCharField('assignment',this.value);saveShipField('name',this.value.replace(/\\s+NCC-\\S+$/i,'').trim());var _r=this.value.match(/NCC-\\S+$/i);if(_r)saveShipField('registry',_r[0]);"></div>
  <div class="field"><label>Role / Department Head</label><input value="${escH(c.role)}" placeholder="e.g. Chief Science Officer" onchange="saveCharField('role',this.value)"></div>
  <div class="field"><label>Homeworld</label><input value="${escH(c.homeworld)}" placeholder="e.g. Vulcan, Earth, Andoria…" onchange="saveCharField('homeworld',this.value)"></div>
  <button class="btn btn-accent btn-sm" style="margin-bottom:8px" onclick="rollDirective()">Roll Directive (d20)</button>

    <textarea onchange="saveCharField('directive',this.value)" placeholder="Current mission objective…">${escH(c.directive)}</textarea>

      <thead><tr><th>d20</th><th>Directive</th></tr></thead>
      <tbody>${dirRows}</tbody>
    </table>
  </div>`;
}

function renderCS8() {
  const c = S.char;
  const sh = S.ship;
  const mode = window._csShipMode || 'era';
  const charEra = c._selectedEra || c.era || '';

  // Match ship classes to character's era via direct lookup
  const shipEraKey = charEra ? ERA_TO_SHIP_ERA[charEra] : null;
  const eraShips = shipEraKey ? SHIP_CLASSES.filter(sc => sc.era === shipEraKey) : [];
  const displayShips = mode === 'all' ? SHIP_CLASSES : (eraShips.length ? eraShips : (charEra ? [] : SHIP_CLASSES));
  const eraLabel = charEra ? charEra.replace(/\s*\(.*?\)\s*/g,'').trim() : 'Era Ships';

  const classRows = displayShips.length ? displayShips.map(sc => {
    const isSel = sh.className === sc.name && sh.era === sc.era;
    const isPrev = window._shipClassPreview === sc.name;
    const rowBg = isPrev ? 'background:rgba(255,153,51,0.22)' : (isSel ? 'background:var(--accent-glow)' : '');
    return `<tr onclick="previewShipClass('${escQ(sc.name)}')" style="cursor:pointer;${rowBg}">
      <td style="color:${(isSel||isPrev)?'var(--accent)':'var(--text)'};font-weight:bold;padding:5px 8px">${escH(sc.name)}${isSel?' ✓':''}${isPrev?' ▼':''}</td>
      <td style="color:var(--muted);font-size:10px;padding:5px 8px">${escH(sc.era)}</td>
      <td style="text-align:center;padding:5px 8px">${sc.scale}</td>
      <td style="font-size:10px;padding:5px 8px;color:var(--muted)">${sc.comms}/${sc.computers}/${sc.engines}/${sc.sensors}/${sc.structure}/${sc.weapons}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" style="padding:12px 8px;color:var(--muted);font-size:11px;font-style:italic">${charEra ? 'No ships in library for this era — try All Classes.' : 'Select an era in an earlier step to filter ships.'}</td></tr>`;

  const selectedBadge = sh.className ? `<div style="background:var(--surface2);border:1px solid var(--accent);border-radius:4px;padding:8px 12px;margin-bottom:10px">
    <div style="color:var(--accent);font-size:12px;font-weight:bold">${escH(sh.className)}</div>
    <div style="font-size:10px;color:var(--muted)">${sh.era?escH(sh.era)+' · ':''}Scale ${sh.scale}</div>
  </div>` : `<div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-style:italic">No vessel selected yet — tap a class below, then <strong>Select This Vessel</strong>. You can also skip this and fill it in later.</div>`;

  const classTable = `<div style="overflow-x:auto;max-height:260px;overflow-y:auto">
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="text-align:left;padding:4px 8px;color:var(--muted);font-size:10px;letter-spacing:1px">CLASS</th>
        <th style="text-align:left;padding:4px 8px;color:var(--muted);font-size:10px;letter-spacing:1px">ERA</th>
        <th style="text-align:center;padding:4px 8px;color:var(--muted);font-size:10px">SCL</th>
        <th style="text-align:left;padding:4px 8px;color:var(--muted);font-size:10px;letter-spacing:1px">COM/CPU/ENG/SEN/STR/WPN</th>
      </tr></thead>
      <tbody>${classRows}</tbody>
    </table>
  </div>
  ${buildShipPreviewPanel()}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
    <div class="field" style="flex:2;margin:0"><label>Ship Name</label>
      <div style="display:flex;gap:4px">
        <input style="flex:1" value="${escH(sh.name)}" placeholder="e.g. USS Vigilance" onchange="saveShipField('name',this.value);saveCharField('assignment',this.value+(S.ship.registry?' '+S.ship.registry:''));">
        <button class="btn btn-xs btn-accent" onclick="rollRandomShipName()" title="Random ship name">🎲</button>
      </div>
    </div>
    <div class="field" style="flex:1;margin:0"><label>Registry</label>
      <input value="${escH(sh.registry)}" placeholder="NCC-74656" onchange="saveShipField('registry',this.value);saveCharField('assignment',S.ship.name+(this.value?' '+this.value:''));">
    </div>
  </div>
  <p style="font-size:10px;color:var(--muted);margin-top:4px">Tap a class to preview it, then press <strong>Select This Vessel</strong>. All stats can be adjusted later on the Ship tab.</p>`;

  const customForm = `<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Enter your ship's basics. Full stats and systems can be set on the Ship tab.</div>
  <div class="field"><label>Ship Name</label>
    <div style="display:flex;gap:4px">
      <input style="flex:1" value="${escH(sh.name)}" placeholder="e.g. USS Enterprise" onchange="saveShipField('name',this.value)">
      <button class="btn btn-xs btn-accent" onclick="rollRandomShipName()" title="Random ship name">🎲</button>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">

  <div class="field" style="margin-top:8px"><label>Mission Profile / Trait</label>

    <button class="btn btn-sm${mode==='all'?' btn-accent':''}" onclick="window._csShipMode='all';renderCurrentTab()">All Classes</button>

  </div>
  ${mode === 'custom' ? customForm : classTable}
  ${buildCreationTalentPicker()}`;
}

// Talent selection for the wizard's ship step: one talent per point of Scale,
// suggested talents for the chosen class offered as toggles, plus the full
// catalog. Shown once a class is chosen (or in custom mode, where Scale is set
// by hand).
function buildCreationTalentPicker() {
  const sh = S.ship;
  if (!sh.className && (window._csShipMode||'era') !== 'custom') return '';
  const scale = sh.scale || 3;
  const talents = sh.talents || [];
  const selKeys = talents.map(t => shipTalentKey(t.name));
  // Suggestions that are already on the ship drop out of the suggested row —
  // a taken talent lives only in the selected chips above, never twice.
  const suggNames = [...new Set((SHIP_SUGGESTED_TALENTS[sh.className]||[]).map(n => { const c = findShipTalent(n); return c ? c.name : n; }))]
    .filter(n => !selKeys.includes(shipTalentKey(n)));
  const chips = talents.map((t,i) =>
    `<span class="tal-chip sel" title="${escH(t.desc||'')}">${talIconHTML(t.icon,14)}${escH(t.name)}<b style="cursor:pointer;margin-left:3px" onclick="removeShipTalent(${i})">✕</b></span>`).join(' ');
  const suggChips = suggNames.map(n => {
    const c = findShipTalent(n);
    return `<span class="tal-chip" title="${escH(c?c.desc:'')}" onclick="creationToggleShipTalent('${escQ(n)}')">${talIconHTML(c&&c.icon,14)}${escH(n)}</span>`;
  }).join(' ');
  const over = talents.length > scale;
  return `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
      <span style="font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-weight:700">Ship Talents</span>
      <span style="font-size:11px;color:${over?'#f66':'var(--muted)'}">${talents.length} of ${scale} chosen (one per point of Scale)</span>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${chips || '<span style="font-size:11px;color:var(--muted);font-style:italic">No talents chosen yet.</span>'}</div>
    ${suggNames.length ? `<div style="font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:8px 0 4px">Suggested for the ${escH(sh.className)} class — tap to add</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${suggChips}</div>` : ''}
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
      <select id="cs-talent-select" style="flex:1;min-width:160px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:3px;font-size:12px">${shipTalentOptions(selKeys)}</select>
      <button class="btn btn-sm btn-accent" onclick="creationAddShipTalent()">ADD</button>
    </div>
    <p style="font-size:10px;color:var(--muted);margin-top:6px">Hover a talent for its description. Talents work like Focuses for ship tasks; you can also change them later on the Ship tab.</p>
  </div>`;
}

function setMapSubTab(t) { _mapSubTab=t; renderCurrentTab(); }

function shipIconHtml(size, style) {
  const extraStyle = style || 'filter:drop-shadow(0 0 4px rgba(255,153,51,0.9))';
  // 1. Use thumb from ship data if available
  if (S.ship && S.ship.thumb) {
    return `<img src="${S.ship.thumb}" style="width:${size}px;height:${size}px;object-fit:contain;${extraStyle}" alt="ship">`;
  }
  // 2. Fall back to name-matched SHIP_THUMBS (whole-word match)
  const src = matchShipThumb(S.ship && S.ship.className);
  if (!src) return '🚀';
  return `<img src="${src}" style="width:${size}px;height:${size}px;object-fit:contain;${extraStyle}" alt="ship">`;
}

function eraBadgeSrc() {
  const era = (S.char && (S.char._selectedEra || S.char.era)) || '';
  const match = ERA_BADGES.find(e => e.keys.some(k => era.includes(k)));
  return match ? match.src : null;
}

function areaIconHtml(sz, size, style) {
  const humanScale = sz && ['ship','planet','station','other'].includes(sz.type);
  if (humanScale) {
    const src = eraBadgeSrc() || 'uniforms/era-2409.png';
    const s = style || 'filter:drop-shadow(0 0 4px rgba(153,204,255,0.9))';
    return `<img src="${src}" style="width:${size}px;height:${size}px;object-fit:contain;${s}" alt="crew">`;
  }
  return shipIconHtml(size, style);
}

function renderSectorMap() {
  const sector = S.sectors[S.activeSector];
  if (!sector) return '<div class="card"><p>No sector data.</p></div>';

  // ── SUB-ZONE VIEW ──────────────────────────────────────────────────────────
  if (window._mapZoom) {
    const sz = window._mapZoom.subZone;
    const szCellIdx = window._mapZoom.cellIdx;

    // Sub-zone grid
    let szGridHTML = '<div id="map-grid">';
    for(let i=0;i<25;i++){
      const cell = sz.cells[i] || (sz.cells[i] = {name:'', icon:'', isVoid:false, notes:'', feature:'', type:'unknown'});
      const isCurrent = sz.currentCell === i;
      const isAdj = isAdjacentCell(sz.currentCell, i) && !cell.isVoid;
      let cls = 'map-cell';
      if(cell.isVoid) cls += ' void';
      else if(isCurrent) cls += ' current';
      else if(isAdj) cls += ' adjacent';
      else if(cell.type === 'explored') cls += ' explored';
      else cls += ' unexplored';
      const icon = cell.icon ? giIconHTML(cell.icon) : (isCurrent ? areaIconHtml(sz, 30) : '·');
      szGridHTML += `<div class="${cls}" onclick="clickSubZoneCell(${i})" title="${escH(cell.name)||'Area '+(i+1)}">
        <span style="font-size:9px;color:var(--muted);position:absolute;top:2px;left:4px">${i+1}</span>
        <span class="cell-icon">${icon}</span>
        ${cell.name?`<span class="cell-name">${escH(cell.name)}</span>`:''}
      </div>`;
    }
    szGridHTML += '</div>';

    // Sub-zone cell detail
    const szSelIdx = window._selectedMapCell ?? sz.currentCell;
    const szSelCell = sz.cells[szSelIdx];
    let szDetailHTML = '';
    if(szSelCell && !szSelCell.isVoid){
      const isCur = szSelIdx === sz.currentCell;
      const isAdjSel = isAdjacentCell(sz.currentCell, szSelIdx);
      szDetailHTML = `<div class="card">
        <div class="card-title">AREA ${szSelIdx+1}: ${escH(szSelCell.name)||'Unknown'}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          ${!isCur && isAdjSel ? `<button class="btn btn-sm btn-accent" onclick="warpToSubZone(${szSelIdx})">${areaIconHtml(sz,14,'filter:drop-shadow(0 0 3px rgba(255,153,51,0.8))')} Travel Here</button>` : ''}
          <button class="btn btn-sm" onclick="toggleSubZoneVoid(${szSelIdx})">${szSelCell.isVoid?'Clear Void':'Mark Void'}</button>
        </div>
        <div class="field"><label>Area Name</label>
          <input value="${escH(szSelCell.name)}" placeholder="e.g. Engineering Bay, Cargo Hold, Plaza…" onchange="setSubZoneCellProp(${szSelIdx},'name',this.value)">
        </div>
        <div class="field"><label>Icon</label>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="btn btn-sm" style="flex:none;line-height:0;padding:5px 7px" title="Pick an icon (game-icons.net)" onclick="openTalIconPicker('subzone:${szSelIdx}')">${giIconHTML(szSelCell.icon,18)||talIconHTML('',18)}</button>
            <input style="flex:1;min-width:0" value="${escH(szSelCell.icon)}" placeholder="or type an emoji" onchange="setSubZoneCellProp(${szSelIdx},'icon',this.value);renderCurrentTab()">
            ${szSelCell.icon?`<button class="btn btn-xs btn-danger" style="flex:none" title="Clear icon" onclick="setSubZoneCellProp(${szSelIdx},'icon','');renderCurrentTab()">✕</button>`:''}
          </div>
        </div>
        <div class="field"><label>Feature</label>
          <input value="${escH(szSelCell.feature)}" placeholder="e.g. Ruins, Outpost, Natural Landmark…" onchange="setSubZoneCellProp(${szSelIdx},'feature',this.value)">
        </div>
        <div class="field"><label>Notes</label>
          <textarea rows="2" onchange="setSubZoneCellProp(${szSelIdx},'notes',this.value)">${escH(szSelCell.notes)}</textarea>
        </div>
      </div>`;
    }

    return `
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="exitSubZone()">← Back to ${escH(sector.name)}</button>
        <div class="card-title" style="margin:0">ZONE MAP${sz.type?' <span style="font-size:9px;color:var(--muted);text-transform:capitalize;font-weight:normal">('+sz.type+')</span>':''}</div>
      </div>
      <div style="font-size:14px;color:var(--accent);font-weight:bold;margin-bottom:8px">
        <input value="${escH(sz.name)}" style="background:transparent;border:none;border-bottom:1px solid var(--accent);color:var(--accent);font-weight:bold;font-size:14px;width:100%" onchange="setSubZoneName(this.value)" placeholder="Zone name…">
      </div>
      <p style="font-size:10px;color:var(--muted);margin-bottom:8px">Zone map for <strong>${escH(sector.cells[szCellIdx].name||'Zone '+(szCellIdx+1))}</strong>. Click adjacent area to travel. Click any cell to edit.</p>
      ${szGridHTML}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--muted)">
        <span style="color:var(--accent)">▣ Current</span>
        <span style="color:var(--info)">▣ Adjacent (can travel)</span>
        <span>■ Explored</span>
        <span style="opacity:0.5">■ Unexplored</span>
        <span style="opacity:0.3">■ Void</span>
      </div>
    </div>
    ${szDetailHTML}`;
  }

  // ── NORMAL SECTOR VIEW ────────────────────────────────────────────────────
  const m = sector;

  // Sector switcher
  let sectorSwitcher = '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">';
  S.sectors.forEach((sec,i)=>{
    sectorSwitcher += `<button class="btn btn-sm${i===S.activeSector?' btn-accent':''}" onclick="switchSector(${i})">${escH(sec.name)}</button>`;
  });
  sectorSwitcher += `<button class="btn btn-sm" onclick="newSector()">+ New Sector</button>`;
  sectorSwitcher += '</div>';

  // Grid
  let gridHTML = '<div id="map-grid">';
  for(let i=0;i<25;i++){
    const cell = m.cells[i] || (m.cells[i] = {type:'unknown', isVoid:false, name:'', icon:'', notes:'', feature:'', subZone:null});
    const isCurrent = m.currentCell === i;
    const isAdj = isAdjacentCell(m.currentCell, i) && !cell.isVoid;
    let cls = 'map-cell';
    if(cell.isVoid) cls += ' void';
    else if(isCurrent) cls += ' current';
    else if(isAdj) cls += ' adjacent';
    else if(cell.type === 'explored') cls += ' explored';
    else cls += ' unexplored';
    const icon = cell.icon ? giIconHTML(cell.icon) : (isCurrent ? shipIconHtml(30) : '·');
    gridHTML += `<div class="${cls}" onclick="clickMapCell(${i})" title="${escH(cell.name)||'Zone '+(i+1)}">
      <span style="font-size:9px;color:var(--muted);position:absolute;top:2px;left:4px">${i+1}</span>
      <span class="cell-icon">${icon}</span>
      ${cell.name?`<span class="cell-name">${escH(cell.name)}</span>`:''}
    </div>`;
  }
  gridHTML += '</div>';

  // Cell detail
  const selIdx = window._selectedMapCell ?? m.currentCell;
  const selCell = m.cells[selIdx];
  let detailHTML = '';
  if(selCell && !selCell.isVoid){
    const isCur = selIdx === m.currentCell;
    const isAdjSel = isAdjacentCell(m.currentCell, selIdx);
    detailHTML = `<div class="card" style="flex:1;min-width:0">
      <div class="card-title">ZONE ${selIdx+1}: ${escH(selCell.name)||'Unknown'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        ${!isCur && isAdjSel ? `<button class="btn btn-sm btn-accent" onclick="warpTo(${selIdx})">${shipIconHtml(14,'filter:drop-shadow(0 0 3px rgba(255,153,51,0.8))')} Warp Here</button>` : ''}
        <button class="btn btn-sm" onclick="toggleVoid(${selIdx})">${selCell.isVoid?'Clear Void':'Mark Void'}</button>
        <button class="btn btn-sm" onclick="enterSubZone(${selIdx})">🔍 Enter Zone${selCell.subZone?' ('+selCell.subZone.type+')':''}</button>
      </div>
      <div class="field"><label>Zone Name</label>
        <input value="${escH(selCell.name)}" placeholder="e.g. Veridian III, Deep Space 9…" onchange="setCellProp(${selIdx},'name',this.value)">
      </div>
      <div class="field"><label>Icon</label>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-sm" style="flex:none;line-height:0;padding:5px 7px" title="Pick an icon (game-icons.net)" onclick="openTalIconPicker('cell:${selIdx}')">${giIconHTML(selCell.icon,18)||talIconHTML('',18)}</button>
          <input style="flex:1;min-width:0" value="${escH(selCell.icon)}" placeholder="or type an emoji" onchange="setCellProp(${selIdx},'icon',this.value);renderCurrentTab()">
          ${selCell.icon?`<button class="btn btn-xs btn-danger" style="flex:none" title="Clear icon" onclick="setCellProp(${selIdx},'icon','');renderCurrentTab()">✕</button>`:''}
        </div>
      </div>
      <div class="field"><label>Feature</label>
        <input value="${escH(selCell.feature)}" placeholder="e.g. Class-M Planet, Starbase…" onchange="setCellProp(${selIdx},'feature',this.value)">
      </div>
      <div class="field"><label>Notes</label>
        <textarea rows="2" onchange="setCellProp(${selIdx},'notes',this.value)">${escH(selCell.notes)}</textarea>
      </div>
    </div>`;
  }

  // Ship quick info
  const ship = S.ship;
  const shipInfo = ship.name ? `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:11px;margin-bottom:10px;display:flex;gap:10px;align-items:center">
    <span class="map-ship-card-icon" style="font-size:20px;line-height:1;display:flex;align-items:center">${shipIconHtml(50,'filter:drop-shadow(0 0 5px rgba(255,153,51,0.9))')}</span>
    <div>
      <div style="color:var(--accent);font-weight:bold">${escH(ship.name)}</div>
      <div style="color:var(--muted)">${escH(ship.className)} · Scale ${ship.scale} · ${escH(ship.era)}</div>
    </div>
    <button class="btn btn-xs" style="margin-left:auto" onclick="showTab('character');setOfficerSubTab('ship')">Ship Details →</button>
  </div>` : `<div style="color:var(--muted);font-size:11px;margin-bottom:8px">No ship configured. <button class="btn btn-xs" onclick="showTab('character');setOfficerSubTab('ship')">Configure Ship →</button></div>`;

  return `
  <div class="card-row" style="align-items:flex-start">
  <div class="card" style="flex:1;min-width:0">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <div class="card-title" style="margin:0">SECTOR MAP</div>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="renameSector()">Rename Sector</button>
        ${S.sectors.length>1?`<button class="btn btn-sm btn-danger" onclick="deleteSector()">Delete Sector</button>`:''}
      </div>
    </div>
    <div style="font-size:14px;color:var(--accent);font-weight:bold;margin-bottom:8px">${escH(m.name)}</div>
    ${sectorSwitcher}
    ${shipInfo}
    <p style="font-size:10px;color:var(--muted);margin-bottom:8px">5×5 sector grid. 🚀 = current position. Click adjacent zone to warp. Click any cell to edit.</p>
    ${gridHTML}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--muted)">
      <span style="color:var(--accent)">▣ Current</span>
      <span style="color:var(--info)">▣ Adjacent (can warp)</span>
      <span>■ Explored</span>
      <span style="opacity:0.5">■ Unexplored</span>
      <span style="opacity:0.3">■ Void</span>
    </div>
  </div>
  ${detailHTML}
  </div>`;
}

function renderShipTab() {
  const sh = S.ship;

  // ── Ship Class Library picker ──────────────────────────────────────────────
  const eras = [...new Set(SHIP_CLASSES.map(c=>c.era))];
  const eraFilter = window._shipEraFilter || 'all';
  const filtered = eraFilter==='all' ? SHIP_CLASSES : SHIP_CLASSES.filter(c=>c.era===eraFilter);
  const eraFilterBtns = `<button class="btn btn-xs${eraFilter==='all'?' btn-accent':''}" onclick="window._shipEraFilter='all';renderCurrentTab()">All</button>`
    + eras.map(e=>`<button class="btn btn-xs${eraFilter===e?' btn-accent':''}" onclick="window._shipEraFilter='${escQ(e)}';renderCurrentTab()">${e}</button>`).join('');

  const classRows = filtered.map(c => {
    const isSel = sh.className===c.name && sh.era===c.era;
    const isPrev = window._shipClassPreview === c.name;
    const rowBg = isPrev ? 'background:rgba(255,153,51,0.22)' : (isSel ? 'background:var(--accent-glow)' : '');
    return `<tr onclick="previewShipClass('${escQ(c.name)}')" style="cursor:pointer;${rowBg}">
      <td style="color:${(isSel||isPrev)?'var(--accent)':'var(--text)'};font-weight:bold;padding:5px 8px">${escH(c.name)}${isSel?' ✓':''}${isPrev?' ▼':''}</td>
      <td style="color:var(--muted);font-size:10px;padding:5px 8px">${escH(c.era)}</td>
      <td style="text-align:center;padding:5px 8px">${c.scale}</td>
      <td style="font-size:10px;padding:5px 8px;color:var(--text)">${c.comms}/${c.computers}/${c.engines}/${c.sensors}/${c.structure}/${c.weapons}</td>
    </tr>`;
  }).join('');

  const classPickerHTML = `
  <div class="card">
    <div class="collapsible-header" onclick="toggleCollapsible('ship-class-body')">
      <span class="card-title" style="margin:0">SHIP CLASS LIBRARY</span>
      <span class="collapse-icon">▼</span>
    </div>
    <div class="collapsible-body${window._openCollapsibles&&window._openCollapsibles['ship-class-body']?' open':''}" id="ship-class-body">
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">${eraFilterBtns}</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:4px 8px;color:var(--muted);font-size:10px;letter-spacing:1px">CLASS</th>
            <th style="text-align:left;padding:4px 8px;color:var(--muted);font-size:10px;letter-spacing:1px">ERA</th>
            <th style="text-align:center;padding:4px 8px;color:var(--muted);font-size:10px">SCL</th>
            <th style="text-align:left;padding:4px 8px;color:var(--muted);font-size:10px;letter-spacing:1px">COM/CPU/ENG/SEN/STR/WPN</th>
          </tr></thead>
          <tbody>${classRows}</tbody>
        </table>
      </div>
      ${buildShipPreviewPanel()}
      <p style="font-size:10px;color:var(--muted);margin-top:6px">Tap a class to preview it. Ship name and registry are preserved when you select; stats and talents reset to the new class.</p>
    </div>
  </div>`;

  // Systems
  let sysHTML = '<div class="attr-grid">';
  SYS_KEYS.forEach((k,idx)=>{
    sysHTML += `<div class="attr-box">
      <div class="attr-abbr" style="font-size:8px">${SYS_FULL[idx].slice(0,4).toUpperCase()}</div>
      <div class="attr-val">${sh[k]||7}</div>
      <div style="display:flex;gap:4px;justify-content:center;margin-top:2px">
        <button class="res-btn" data-symbol="-" onclick="adjShipSys('${k}',-1)"></button>
        <button class="res-btn" data-symbol="+" onclick="adjShipSys('${k}',1)"></button>
      </div>
      <div class="attr-full" style="font-size:7px">${SYS_FULL[idx]}</div>
    </div>`;
  });
  sysHTML += '</div>';

  // Departments
  let deptHTML = '<div class="disc-grid">';
  DISCIPLINES.forEach(d=>{
    const rank = sh[d.key]||1;
    let dots = '<div class="disc-dots">';
    for(let i=1;i<=5;i++) dots += `<div class="dot${i<=rank?' filled':''}" onclick="setShipDept('${d.key}',${i})" ondblclick="setShipDept('${d.key}',1)"></div>`;
    dots += '</div>';
    deptHTML += `<div class="disc-row">
      <span style="font-size:9px;color:var(--muted);min-width:28px">${d.abbr}</span>
      <span class="disc-name">${d.full}</span>
      ${dots}
      <span style="font-size:11px;color:var(--accent);min-width:16px">${rank}</span>
    </div>`;
  });
  deptHTML += '</div>';

  // Ship talents — icon (click to change), name, description, remove.
  let talHTML = '';
  if(sh.talents&&sh.talents.length) talHTML = sh.talents.map((t,i)=>`<div class="perk-item" style="display:flex;align-items:flex-start;gap:8px">
    <button class="btn btn-xs" style="padding:4px 6px;flex:none;line-height:0" title="Change icon (game-icons.net)" onclick="openTalIconPicker(${i})">${talIconHTML(t.icon,32)}</button>
    <div style="flex:1;min-width:0"><span class="perk-name">${escH(t.name)}</span>${t.desc?`<div style="font-size:10px;color:var(--muted);line-height:1.5;margin-top:2px">${escH(t.desc)}</div>`:''}</div>
    <button class="btn btn-xs btn-danger" style="flex:none" onclick="removeShipTalent(${i})">✕</button>
  </div>`).join('');
  const talCount = (sh.talents||[]).length, talMax = sh.scale||3;
  // Class suggestions not yet taken, offered as one-tap add chips.
  const shTalKeys = (sh.talents||[]).map(t=>shipTalentKey(t.name));
  const shSuggNames = [...new Set((SHIP_SUGGESTED_TALENTS[sh.className]||[]).map(n=>{const c=findShipTalent(n);return c?c.name:n;}))]
    .filter(n=>!shTalKeys.includes(shipTalentKey(n)));
  const shSuggHTML = shSuggNames.length ? `<div style="font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:8px 0 4px">Suggested for the ${escH(sh.className)} class — tap to add</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${shSuggNames.map(n=>{const c=findShipTalent(n);return `<span class="tal-chip" title="${escH(c?c.desc:'')}" onclick="addShipTalentByName('${escQ(n)}')">${talIconHTML(c&&c.icon,14)}${escH(n)}</span>`;}).join('')}</div>` : '';

  const scaleOpts = [1,2,3,4,5,6,7].map(s=>`<option${sh.scale===s?' selected':''}>${s}</option>`).join('');

  // ── Interior map grid ─────────────────────────────────────────────────────
  if (!sh.interiorCells || sh.interiorCells.length !== 50) {
    sh.interiorCells = Array.from({length:50}, (_,i) => ({
      name:'', icon:'', notes:'', isVoid: SHIP_INTERIOR_HULL[i]
    }));
  }
  let interiorCellsHTML = '';
  sh.interiorCells.forEach((_, i) => { interiorCellsHTML += interiorCellHTML(i); });

  const interiorMapHTML = `
  <div class="card">
    <div class="card-title">SHIP INTERIOR MAP</div>
    <p style="font-size:10px;color:var(--muted);margin-bottom:8px">Top-down deck layout. Click a room to label it. Click void (dashed) cells to add them to the hull.</p>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:320px;margin:0 auto">
      ${interiorCellsHTML}
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;font-size:10px;color:var(--muted);flex-wrap:wrap">
      <span>■ <span style="color:var(--text)">Active room</span></span>
      <span style="border:1px dashed #1a2a3a;padding:0 4px">Void (outside hull)</span>
      <button class="btn btn-xs btn-danger" onclick="resetInteriorMap()" style="margin-left:auto">Reset Layout</button>
    </div>
  </div>`;

  const vesselProfileCard = `<div class="card">
    <div class="card-title">VESSEL PROFILE</div>
    ${sh.thumb ? `<div style="text-align:center;margin-bottom:10px"><img src="${escH(sh.thumb)}" style="max-width:100%;max-height:150px;object-fit:contain;filter:drop-shadow(0 0 8px var(--accent))"></div>` : ''}
    ${sh.trait ? `<p style="font-size:11px;color:var(--text);line-height:1.6">${escH(sh.trait)}</p>` : '<p style="font-size:11px;color:var(--muted)">Select a ship class to see its profile.</p>'}
    ${sh.className ? `<div style="font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:1px">${escH(sh.className)}${sh.era?' · '+escH(sh.era):''}${sh.scale?' · Scale '+sh.scale:''}</div>` : ''}
  </div>`;

  return classPickerHTML + `
  <div class="card-row">
    <div class="card" style="flex:1;min-width:0">
      <div class="card-title">SHIP INFORMATION</div>
      <div class="section-row">
        <div class="field" style="flex:2;margin:0"><label>Ship Name</label>
          <input value="${escH(sh.name)}" placeholder="e.g. USS Enterprise" onchange="saveShipField('name',this.value)">
        </div>
        <div class="field" style="flex:1;margin:0"><label>Registry</label>
          <input value="${escH(sh.registry)}" placeholder="NCC-1701" onchange="saveShipField('registry',this.value)">
        </div>
      </div>
      <div class="section-row">
        <div class="field" style="flex:2;margin:0"><label>Class</label>
          <input value="${escH(sh.className)}" placeholder="e.g. Constitution, Galaxy, Intrepid" onchange="saveShipField('className',this.value)">
        </div>
        <div class="field" style="flex:1;margin:0"><label>Scale (1–7)</label>
          <select onchange="saveShipField('scale',parseInt(this.value))">${scaleOpts}</select>
        </div>
      </div>
      <div class="field"><label>Mission Profile / Trait</label>
        <input value="${escH(sh.trait)}" placeholder="e.g. Exploration Vessel, Warship, Diplomatic Transport" onchange="saveShipField('trait',this.value)">
      </div>
    </div>
    <div class="vessel-profile-desktop" style="flex:1;min-width:0">${vesselProfileCard}</div>
  </div>

  <div class="card-row">
    <div class="card" style="flex:1;min-width:0">
      <div class="card-title">SYSTEMS</div>
      ${sysHTML}
    </div>
    <div class="card" style="flex:1;min-width:0">
      <div class="card-title">DEPARTMENTS</div>
      ${deptHTML}
    </div>
  </div>

  <div class="card-row">
  ${interiorMapHTML}
  <div style="flex:1;min-width:0">
  <div class="card">
    <div style="display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--accent-dim)">
      <span class="card-title" style="margin:0">SHIP TALENTS</span>
      <span style="font-size:11px;color:${talCount>talMax?'#f66':'var(--muted)'};margin-left:10px">${talCount} / ${talMax} (Scale)</span>
    </div>
    <div id="ship-talent-body" style="padding-top:8px">
      ${talHTML||'<p style="color:var(--muted);font-size:11px">No talents. A ship may take one talent per point of Scale — tap a suggestion or pick from the list below.</p>'}
      ${shSuggHTML}
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <select id="ship-talent-cat" style="flex:1;min-width:160px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:3px;font-size:12px">${shipTalentOptions((sh.talents||[]).map(t=>shipTalentKey(t.name)))}</select>
        <button class="btn btn-sm btn-accent" onclick="addShipTalentFromCatalog()">ADD</button>

function rollOpposition() {
  const tn=parseInt(document.getElementById('opp-tn')?.value||10);
  const diff=1;
  const numDice=parseInt(document.getElementById('opp-dice')?.value||2);
  const focusCheck=document.getElementById('opp-focus-check')?.checked||false;
  const focusThreshold=Math.floor(tn/2);

  const rolls=[];
  for(let i=0;i<numDice;i++) rolls.push(Math.floor(Math.random()*20)+1);

  let totalSucc=0, complications=0;
  const diceHTML=rolls.map(r=>{
    let succ=0, cls='fail';
    if(r===20){ complications++; cls='complication'; if(r<=tn) succ=1; }
    else if(r===1){ succ=2; cls='critical'; }
    else if(focusCheck && r<=focusThreshold){ succ=2; cls='success'; }
    else if(r<=tn){ succ=1; cls='success'; }
    totalSucc+=succ;
    return `<div class="die-result ${cls}" title="${succ>0?succ+' success':''}">${r}</div>`;
  }).join('');

  const netSucc=totalSucc-diff;
  const success=netSucc>=0;
  const excess=success?netSucc:0;
  if(excess>0){ S.char.threat=Math.min(99,S.char.threat+excess); }

  let resultColor=success?'var(--danger)':'var(--success)';
  let resultText=success
    ?`OPPOSITION SUCCEEDS (${totalSucc} success${totalSucc!==1?'es':''}${excess>0?`, +${excess} Threat`:''})`
    :`OPPOSITION FAILS (${totalSucc} success${totalSucc!==1?'es':''})`;
  if(complications>0) resultText+=` — ${complications} COMPLICATION${complications>1?'S':''}!`;

  const html=`<div class="dice-result-row">${diceHTML}</div>
    <div style="font-size:14px;font-weight:bold;color:${resultColor};margin:8px 0">${resultText}</div>
    <div style="font-size:10px;color:var(--muted)">TN: ${tn} | ${numDice} dice${focusCheck?` | Focus/Talent (≤${focusThreshold})`:''}</div>`;

  window._lastOppRollResult=html;
  const resultEl=document.getElementById('opp-roll-result');
  if(resultEl) resultEl.innerHTML=html;
  const tEl=document.getElementById('dice-threat-val');
  if(tEl) tEl.textContent=S.char.threat;
  _lastRollData = { rolls, tn, successes: totalSucc, complications, diff, label: 'Opposition', success };
  saveSlot();
}

function rollShipTask() {
  const sEl=document.getElementById('ship-roll-sys');
  const dEl=document.getElementById('ship-roll-dept');
  const diff=1;
  const extra=parseInt(document.getElementById('ship-extra-dice')?.value||0);
  const talentCheck=document.getElementById('ship-talent-check')?.checked||false;
  const [sKey,sv]=sEl.value.split('|');
  const [dKey,dv]=dEl.value.split('|');
  const sysVal=parseInt(sv);
  const deptVal=parseInt(dv);
  const tn=sysVal+deptVal;

  if(extra>0){
    const spent=Math.min(extra,S.char.momentum);
    S.char.momentum=Math.max(0,S.char.momentum-spent);
    S.char.threat+=extra-spent;
  }

  const numDice=2+extra;
  const rolls=[];
  for(let i=0;i<numDice;i++) rolls.push(Math.floor(Math.random()*20)+1);

  let totalSucc=0, complications=0;
  const diceHTML=rolls.map(r=>{
    let succ=0, cls='fail';
    if(r===20){ complications++; cls='complication'; if(r<=tn) succ=1; }
    else if(r===1){ succ=2; cls='critical'; }
    else if(talentCheck && r<=deptVal){ succ=2; cls='success'; }
    else if(r<=tn){ succ=1; cls='success'; }
    totalSucc+=succ;
    return `<div class="die-result ${cls}" title="${succ>0?succ+' success':''}">${r}</div>`;
  }).join('');

  const netSucc=totalSucc-diff;
  const success=netSucc>=0;
  const momentum=success?netSucc:0;
  if(momentum>0){ S.char.momentum=Math.min(6,S.char.momentum+momentum); }

  let resultColor=success?'var(--success)':'var(--danger)';
  let resultText=success?`SUCCESS (${totalSucc} success${totalSucc!==1?'es':''}, +${momentum} Momentum)`:`FAILURE (${totalSucc} success${totalSucc!==1?'es':''})`;
  if(complications>0) resultText+=` — ${complications} COMPLICATION${complications>1?'S':''}!`;

  const sysLabel=SYS_FULL[SYS_KEYS.indexOf(sKey)]||sKey;
  const deptLabel=DISCIPLINES.find(d=>d.key===dKey)?.full||dKey;
  const html=`<div class="dice-result-row">${diceHTML}</div>
    <div style="font-size:14px;font-weight:bold;color:${resultColor};margin:8px 0">${resultText}</div>
    <div style="font-size:10px;color:var(--muted)">TN: ${tn} (${sysLabel} ${sysVal} + ${deptLabel} ${dv}) | ${numDice} dice${talentCheck?' | Talent active':''}</div>`;

  window._lastShipRollResult=html;
  const resultEl=document.getElementById('ship-roll-result');
  if(resultEl) resultEl.innerHTML=html;
  const mEl=document.getElementById('dice-momentum-val');
  if(mEl) mEl.textContent=S.char.momentum;
  const tEl=document.getElementById('dice-threat-val');
  if(tEl) tEl.textContent=S.char.threat;
  _lastRollData = { rolls, tn, successes: totalSucc, complications, diff, label: 'Ship Task', success };
  saveSlot();
}

function renderLogTab() {
  if(window._logNewestFirst===undefined) window._logNewestFirst=true;
  const nf = window._logNewestFirst;
  const reorder = !!window._logReorderMode;
  const entries = S.log;
  let entriesHTML = '';

  if(!entries.length) {
    entriesHTML = '<p style="color:var(--muted);font-size:11px">No log entries yet.</p>';
  } else {
    const ordered = (nf && !reorder) ? [...entries].map((n,i)=>({n,i})).reverse() : entries.map((n,i)=>({n,i}));
    ordered.forEach(({n:entry, i})=>{
      const dragAttrs = reorder ? ` draggable="true" ondragstart="logDragStart(event,${i})" ondragover="logDragOver(event)" ondragleave="logDragLeave(event)" ondrop="logDrop(event,${i})"` : '';

      if(entry.type==='episode') {
        entriesHTML += `<div class="log-episode-break"${dragAttrs}>
          ${reorder ? `<span class="log-grip">⠿</span>` : ''}
          <div class="log-episode-label">${escH(entry.title||'Episode')}</div>
          ${!reorder ? `<button class="btn btn-xs" onclick="editEpisodeBreak(${i})" style="flex-shrink:0">✎</button>
          <button class="btn btn-xs btn-danger" onclick="deleteLogEntry(${i})" style="flex-shrink:0">✕</button>` : ''}
        </div>`;
        return;
      }

      const typeInfo = LOG_TYPES.find(t=>t.key===entry.type)||LOG_TYPES[0];
      const emoji = entry.emoji||typeInfo.emoji;
      const label = typeInfo.label;
      const isMajor = entry.type==='log';
      const isAlert = entry.type==='alert';
      const isSupp = entry.type==='supplemental';

      let cls = 'log-entry-base';
      if(isMajor) cls='log-entry-major';
      else if(isAlert) cls='log-entry-alert';
      else if(isSupp) cls='log-entry-supplemental';

      entriesHTML += `<div class="${cls}"${dragAttrs}${reorder?' style="cursor:grab"':''}>
        <div style="display:flex;align-items:flex-start;gap:8px">
          ${reorder ? `<span class="log-grip" style="margin-top:2px">⠿</span>` : ''}
          <span style="font-size:${isMajor?'22':'18'}px">${escH(emoji)}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:${isMajor?'14':'12'}px;font-weight:bold;color:${isMajor?'var(--accent)':isAlert?'var(--danger)':isSupp?'var(--info)':'var(--text)'}">${escH(entry.title||label)}</div>
            <div style="font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:1px">${label} · ${escH(entry.date||'')}</div>
          </div>
          ${!reorder ? `<button class="btn btn-xs" onclick="editLogEntry(${i})" style="margin-right:2px">✎</button>
          <button class="btn btn-xs btn-danger" onclick="deleteLogEntry(${i})">✕</button>` : ''}
        </div>
        ${entry.body?`<div style="font-size:${isMajor?'12':'11'}px;color:var(--text);line-height:1.6;margin-top:6px;white-space:pre-wrap">${escH(entry.body)}</div>`:''}
      </div>`;
    });
  }

  return `
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px">
      <div class="card-title" style="margin:0">CAPTAIN'S LOG</div>
      <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
        ${!reorder ? `<button onclick="addEpisodeBreak()" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--accent);font-family:var(--font);font-size:11px;letter-spacing:1px">▶ EPISODE START</button>` : ''}
        ${!reorder ? `<button class="export-log-btn" onclick="exportLog()" style="background:var(--surface2);border:1px solid var(--accent);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--accent);font-family:var(--font);font-size:11px;letter-spacing:1px;font-weight:700">↗ EXPORT</button>
        <button class="export-log-btn" onclick="exportLog('blank')" title="Open the export in Blank Logbook mode — handwriting pages, one mission per page" style="background:var(--surface2);border:1px solid var(--accent);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--accent);font-family:var(--font);font-size:11px;letter-spacing:1px;font-weight:700">🖨 LOGBOOK</button>` : ''}
        ${!reorder ? `<button onclick="window._logNewestFirst=!window._logNewestFirst;renderCurrentTab()" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--muted);font-family:var(--font);font-size:11px">
          ${nf?'↓ Newest':'↑ Oldest'}
        </button>` : ''}
        <button onclick="window._logReorderMode=!window._logReorderMode;renderCurrentTab()" style="background:${reorder?'var(--accent)':'var(--surface2)'};border:1px solid ${reorder?'var(--accent)':'var(--border)'};border-radius:4px;padding:4px 10px;cursor:pointer;color:${reorder?'#000':'var(--muted)'};font-family:var(--font);font-size:11px">
          ${reorder ? '✓ DONE' : '⠿ REORDER'}
        </button>
      </div>
    </div>
    <div id="log-list">${entriesHTML}</div>
  </div>
  ${!reorder ? `<button class="fab" onclick="showAddLogEntry()" title="New log entry"></button>` : ''}`;
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(e) {
  if(!e || e.target===document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.add('hidden');
    // Drop the fields too: every saver reads the DOM when it fires, and a
    // dismissed modal's inputs must not be readable afterwards.
    document.getElementById('modal-body').innerHTML = '';
  }
}
function dismissModal() { closeModal(); }

function showConfirm(msg, fn, confirmLabel, dangerStyle) {
  window._confirmFn = fn;
  const btnClass = dangerStyle !== false ? 'btn-danger' : 'btn-accent';
  const label = confirmLabel || 'CONFIRM';
  openModal(`<p style="font-size:13px;line-height:1.5;margin-bottom:16px">${msg}</p>
  <div style="display:flex;gap:8px">
    <button class="btn ${btnClass}" onclick="_doConfirm()" style="flex:1">${label}</button>
    <button class="btn" onclick="closeModal()" style="flex:1">CANCEL</button>
  </div>`);
}
function _doConfirm() { const fn=window._confirmFn; window._confirmFn=null; closeModal(); if(fn) fn(); }

function showPrompt(msg, defaultVal, fn) {
  window._promptFn = fn;
  openModal(`<p style="font-size:13px;margin-bottom:10px">${msg}</p>
  <input id="prompt-input" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:3px;font-size:13px;margin-bottom:12px;box-sizing:border-box" value="${escH(defaultVal||'')}">
  <div style="display:flex;gap:8px">
    <button class="btn btn-accent" onclick="_doPrompt()" style="flex:1">OK</button>
    <button class="btn" onclick="closeModal()" style="flex:1">CANCEL</button>
  </div>`);
  setTimeout(()=>{const i=document.getElementById('prompt-input');if(i){i.focus();i.select();}},50);
}
function _doPrompt() { const v=document.getElementById('prompt-input')?.value; const fn=window._promptFn; window._promptFn=null; closeModal(); if(fn && v!==undefined && v!==null) fn(v); }

function openSlotModal() {
  openModal(`<h2>SAVE SLOTS</h2>
  <p style="font-size:11px;color:var(--muted);margin-bottom:12px">Switch or clear mission save slots.</p>
  ${[0,1,2].map(i=>{
    const raw=localStorage.getItem(`stcl_slot_${i}`);
    let label=`Mission ${i+1} — Empty`;
    if(raw){try{const d=JSON.parse(raw);if(d.char?.name)label=`Mission ${i+1} — ${escH(d.char.name)}`;}catch(e){}}
    return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;padding:8px;background:var(--surface2);border-radius:4px">
      <span style="flex:1;font-size:12px">${label}</span>
      <button class="btn btn-sm btn-accent" onclick="selectSlot(${i});dismissModal()">${i===ACTIVE_SLOT?'Active':'Load'}</button>
      ${raw?`<button class="btn btn-sm btn-danger" onclick="clearSlot(${i})">Clear</button>`:''}
    </div>`;
  }).join('')}
  <button class="btn" style="margin-top:8px" onclick="dismissModal()">Close</button>`);
}
function clearSlot(i) {
  showConfirm(`Clear Mission ${i+1}? This cannot be undone.`, ()=>{
    localStorage.removeItem(`stcl_slot_${i}`);
    if(i===ACTIVE_SLOT){
      // Deliberately no saveSlot() here - it would write the slot straight back.
      S = defaultState();
      window._mapZoom = null;
      window._selectedMapCell = null;
      renderCurrentTab();
    }
    updateSlotLabels(); openSlotModal();
  });
}

function logDragStart(e, i) {
  window._logDragSrc = i;
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '0.4';
}
function logDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('log-drag-over');
}
function logDragLeave(e) {
  e.currentTarget.classList.remove('log-drag-over');
}
function logDrop(e, t) {
  e.preventDefault();
  e.currentTarget.classList.remove('log-drag-over');
  const s = window._logDragSrc;
  if (s == null || s === t) { window._logDragSrc = null; return; }
  const item = S.log.splice(s, 1)[0];
  S.log.splice(s < t ? t - 1 : t, 0, item);
  window._logDragSrc = null;
  saveSlot(); renderCurrentTab();
}

function parseEpisodes(log) {
  const groups = [];
  let cur = {label:'Campaign Log', entries:[]};
  log.forEach(e => {
    if (e.type === 'episode') { groups.push(cur); cur = {label:e.title||'Episode', entries:[]}; }
    else { cur.entries.push(e); }
  });
  groups.push(cur);
  return groups.filter(g => g.label==='Campaign Log' ? g.entries.length>0 : true);
}

// Map data serialized the same way for both exports (doc view + logbook).
function collectExportMaps() {
  const allSectors = (S.sectors || []).map((s, i) => {
    const cells = (s.cells || []).slice(0,25);
    while (cells.length < 25) cells.push({});
    // `named` records whether the user actually titled this sector; the old
    // code inferred it by comparing the name to the literal 'Sector', which
    // dropped any sector a user genuinely called that.
    return {name: s.name || 'Sector', named: !!s.name, cells, _i: i, currentCell: s.currentCell};
  }).filter(s => s.named || s._i === (S.activeSector || 0));
  // keep at least one sector
  if (!allSectors.length) allSectors.push({name:'Sector Map', named:true, cells: Array(25).fill({}), _i:0, currentCell:-1});
  const intCells = (S.ship.interiorCells || []).slice(0,50);
  while (intCells.length < 50) intCells.push({});
  // Collect all sub-zones from all sector cells
  const allSubZones = [];
  allSectors.forEach((s, si) => {
    (s.cells || []).forEach((c, ci) => {
      if (c.subZone) {
        allSubZones.push({
          sectorName: s.name,
          cellName: c.name || ('Area ' + (ci+1)),
          subZone: c.subZone
        });
      }
    });
  });
  return { allSectors, intCells, allSubZones };
}

function exportLog(startMode) {
  const episodes = parseEpisodes(S.log);
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  // Escape every "<" (not just "</") — "<!--" followed by "<script" in user
  // text would otherwise put the HTML tokenizer into double-escaped state and
  // swallow the popup's real closing script tag.
  const J = x => JSON.stringify(x).replace(/</g,'\\u003c');

  const { allSectors, intCells, allSubZones } = collectExportMaps();

  const charName = esc(S.char.name || 'Unknown Officer');
  const shipName = esc(S.ship.name || '');
  // Same fallback chain as shipIconHtml(): the ship's own thumb, else a
  // name-matched SHIP_THUMBS entry — a ship without an explicit thumb still
  // shows its image everywhere else in the app, so the export must match.
  const thumbRel = S.ship.thumb || matchShipThumb(S.ship.className);
  const thumbAbs = thumbRel ? new URL(thumbRel, location.href).href : '';
  // Absolute URLs for the same reason as thumbAbs: the popup is a written
  // about:blank document. Zine covers are optional art dropped into zine/;
  // a missing file falls back to a drawn cover.
  const assetAbs = p => new URL(p, location.href).href;
  const galaxyMaps = [
    {name:'Milky Way Galaxy', src:assetAbs('zine/galaxy-map.png')},
    {name:'Alpha & Beta Quadrants', src:assetAbs('zine/neighborhood-map.png')}
  ];
  const zineArt = {front:assetAbs('zine/cover-front.png'), back:assetAbs('zine/cover-back.png')};

  // --- ATTITUDE COLORS ---
  const attColor = {Hostile:'#FF2200',Cautious:'#FFCC00',Neutral:'#7a7a7a',Allied:'#FF9933',Crew:'#66CC66'};

  // --- NPC CARDS HTML (left panel) ---
  const npcCardsHTML = (S.npcs || []).length
    ? (S.npcs || []).map((n,i) => `<div class="src-card" draggable="true" ondragstart="srcDragStart(event,'npc',${i})">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:13px;font-weight:700;letter-spacing:1px">${esc(n.name)}</span>
          <span style="font-size:9px;padding:2px 6px;border-radius:50vh;background:${attColor[n.attitude]||'#555'};color:#000;font-weight:700;flex-shrink:0">${esc(n.attitude||'')}</span>
        </div>
        <div style="font-size:10px;color:var(--muted)">${esc(n.faction)} · ${esc(n.role)}</div>
        ${n.trait?`<div style="font-size:10px;font-style:italic;margin-top:3px;color:var(--sub)">${esc(n.trait)}</div>`:''}
        ${n.goal?`<div style="font-size:10px;margin-top:3px"><span style="color:var(--muted)">GOAL:</span> ${esc(n.goal)}</div>`:''}
        ${n.notes?`<div style="font-size:10px;margin-top:3px;color:var(--sub)">${esc(n.notes)}</div>`:''}
      </div>`).join('')
    : '<div style="font-size:11px;color:var(--muted);padding:10px">No NPCs logged.</div>';

  // --- MAP GRIDS HTML (source panel) — one block per sector ---
  const secGridHTML = allSectors.map((s, si) => `<div class="map-block" draggable="true" ondragstart="srcDragStart(event,'map-sector',${si})" style="margin-bottom:10px">
    <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:700">${esc(s.name)}</div>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px">
      ${s.cells.map(c => `<div style="aspect-ratio:1;background:${c.isVoid?'transparent':c.name?'var(--card-bg)':'var(--empty-cell)'};border:1px solid ${c.isVoid?'transparent':'var(--cell-border)'};display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;border-radius:2px">
        <span style="font-size:18px;line-height:1">${esc(c.icon||'')}</span>
        ${c.name?`<span style="font-size:8px;text-align:center;line-height:1.2;overflow:hidden;color:var(--cell-text)">${esc(c.name)}</span>`:''}
      </div>`).join('')}
    </div>
  </div>`).join('');

  const galaxyMapHTML = galaxyMaps.map((g, gi) => `<div class="map-block" draggable="true" ondragstart="srcDragStart(event,'galaxy-map',${gi})" style="margin-bottom:10px">
    <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:700">${esc(g.name)}</div>
    <img src="${esc(g.src)}" onerror="this.closest('.map-block').remove()" style="width:100%;display:block;border-radius:3px;background:#fff" alt="">
  </div>`).join('');

  const hasInterior = intCells.some(c => c.name || c.icon);
  // Build interior map: ratio-wrapper (padding-top:50% = 10×5 aspect ratio) + absolute inner + CSS grid
  // This is mathematically guaranteed: container height = 50% of width, grid-template-rows:repeat(5,1fr) → 10×5 square cells
  const intCellsHTML = intCells.map(c => {
    const bg = c.isVoid ? 'transparent' : (c.name ? 'var(--card-bg)' : 'var(--empty-cell)');
    const bd = c.isVoid ? 'transparent' : 'var(--cell-border)';
    return `<div style="background:${bg};border:1px solid ${bd};overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center">`
      + `<span style="font-size:14px;line-height:1">${esc(c.icon||'')}</span>`
      + (c.name ? `<span style="font-size:7px;color:var(--cell-text);text-align:center;word-break:break-all;overflow:hidden">${esc(c.name)}</span>` : '')
      + '</div>';
  }).join('');
  const intGridHTML = hasInterior ? `<div class="map-block" draggable="true" ondragstart="srcDragStart(event,'map-interior',0)" style="margin-top:12px">
    <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--lcars-ltblue);margin-bottom:6px;font-weight:700">${esc(S.ship.name||'Ship Interior')}</div>

  // --- SUB-ZONE MAP BLOCKS (source panel) ---
  const subZoneHTML = allSubZones.map((sz, i) => {

  // --- FULL HTML ---
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>After Action Report — ${charName}</title>
<style>
  :root {

  #main{display:flex;flex:1;min-height:0}
  #src-panel{width:260px;flex-shrink:0;background:var(--left-bg);overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid var(--accent-dim)}
  #src-tabs{display:flex;border-bottom:2px solid var(--accent-dim);flex-shrink:0}
  .stab{flex:1;padding:7px 4px;background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:10px;letter-spacing:1px;cursor:pointer;text-transform:uppercase}

  .src-card{background:var(--src-card-bg);border:1px solid var(--src-card-border);border-radius:4px;padding:10px;margin-bottom:8px;cursor:grab;transition:border-color 0.15s}

  /* ── Blank logbook mode (handwriting pages in the log column) ── */
  .blank-ep{margin-bottom:34px}
  .ep-banner .be-hline{border-bottom:1.5px solid rgba(0,0,0,0.5);height:22px;min-width:90px}
  .be-field{display:flex;align-items:flex-end;gap:8px;margin:8px 0 2px}
  .be-lbl{font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;flex-shrink:0;padding-bottom:3px}
  .be-line{border-bottom:1.5px solid var(--accent-dim);height:18px;flex:1}
  .be-act{margin-top:12px}
  .be-act-hd{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--accent);padding-bottom:2px}
  .be-act-hd b{font-size:12px;letter-spacing:2px;color:var(--accent);white-space:nowrap}
  .be-act-hd span{font-size:9px;color:var(--muted);font-style:italic;letter-spacing:0.5px}

  /* ── Zine mode: saddle-stitched half-size booklet ──────────────────────────
     Pages are laid out at their real printed size (--pw × --ph) inside
     #zine-print, which stays offscreen on screen and is the only thing shown
     in print. The on-screen preview is a scaled copy of the same pages. */
  .zine-only{display:none !important}

  #zine-help{border:1px solid var(--accent-dim);border-radius:6px;padding:10px 14px;font-size:11px;line-height:1.7;margin:0 auto 18px;color:var(--text);max-width:900px}
  #zine-help b{color:var(--accent)}

  .zp.drag-over{box-shadow:inset 0 0 0 3px var(--accent)}
  .zp.zp-over::after{content:'TOO MUCH FOR ONE PAGE — REMOVE SOMETHING';position:absolute;left:0;right:0;top:0;background:#c00;color:#fff;font-size:9px;letter-spacing:2px;text-align:center;padding:3px;z-index:2}
  .zi{position:relative}
  .zi + .zi{margin-top:10px}

  /* Art pages (covers, maps) are drawn at 8.5×11 — a different shape from a
     zine page — so they're fitted whole inside a 0.2in safe inset rather than
     cropped. Cover overlays are positioned in the art's own coordinates. */
  .zc{position:absolute;top:0.2in;left:0.2in;right:0.2in;bottom:0.2in;display:flex;align-items:center;justify-content:center}
  .zc-frame{position:relative;width:100%;aspect-ratio:1275/1650;max-height:100%;container-type:inline-size}

  @media print {

    body.print-mode .col-hdr{background:#ccc !important;color:#222 !important}

    #main{display:block}
