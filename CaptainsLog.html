// ── game-icons picker ───────────────────────────────────────────────────────
// game-icons.net has no API; this is Iconify's search endpoint filtered to
// that set — the same source the sibling apps use. Targets:
//   <number>       — a ship talent index (saves, closes, re-renders)
//   'new'          — the custom-talent row (updates its preview button only,
//                    so in-flight typing in the name/desc inputs isn't wiped)
//   'cell:<i>'     — a sector map cell
//   'subzone:<i>'  — a sub-zone map cell
//   'input:<id>'   — inline mode: writes the slug into that input and stays
//                    open (used inside the interior-room modal, which can't
//                    stack a second modal on top of itself)

// Curated starter palettes shown before the user searches (slugs verified
// against the API).
const GI_QUICKSETS = {
  space:['ringed-planet','earth-america','sun','moon','asteroid','comet-spark','galaxy','black-hole-bolas','vortex','portal','defense-satellite','ufo'],
  area:['mountains','forest','desert','island','cave-entrance','modern-city','village','castle','ancient-columns','campfire','factory','radar-dish'],
  room:['laptop','bed','gears','test-tubes','medical-pack','chef-toque','cargo-crate','toolbox','teleport','holosphere','desk','space-shuttle'],
};
function giQuicksetFor(t) {
  if(typeof t!=='string') return null;
  if(t.indexOf('cell:')===0) return 'space';
  if(t.indexOf('subzone:')===0) return 'area';
  if(t.indexOf('input:')===0) return 'room';
  return null;
}
function giCurrentIcon() {
  const t=window._talIconTarget;
  if(typeof t==='number') return (S.ship.talents&&S.ship.talents[t]?S.ship.talents[t].icon:'')||'';
  if(t==='new') return window._talIconSel||'';
  if(typeof t==='string'&&t.indexOf('cell:')===0){ const c=(S.sectors[S.activeSector]||{cells:[]}).cells[+t.slice(5)]; return (c&&giIsSlug(c.icon))?c.icon.trim():''; }
  if(typeof t==='string'&&t.indexOf('subzone:')===0){ const sz=window._mapZoom&&window._mapZoom.subZone; const c=sz&&sz.cells[+t.slice(8)]; return (c&&giIsSlug(c.icon))?c.icon.trim():''; }
  if(typeof t==='string'&&t.indexOf('input:')===0){ const el=document.getElementById(t.slice(6)); return (el&&giIsSlug(el.value))?el.value.trim():''; }
  return '';
}
function giRenderIcons(icons) {
  const res=document.getElementById('tal-ico-results');
  if(!res) return;
  const cur=giCurrentIcon();
  res.innerHTML = icons.length
    ? icons.map(ic=>`<button type="button" class="tal-ico-opt${ic===cur?' sel':''}" data-icon="${escH(ic)}" title="${escH(ic)}" onclick="pickTalIcon('${escQ(ic)}')">${talIconHTML(ic,22)}</button>`).join('')
    : '<div style="grid-column:1/-1;font-size:11px;color:var(--muted)">No icons found — try another word (planet, station, shield, beam).</div>';
}
function openTalIconPicker(target) {
  window._talIconTarget = target;
  const isMap = giQuicksetFor(target)!==null;
  openModal(`<h2 style="margin-bottom:4px">${isMap?'MAP ICON':'TALENT ICON'}</h2>
  <p style="font-size:10px;color:var(--muted);margin-bottom:10px">Icons from game-icons.net (via Iconify). Click to choose; click the chosen icon again to clear it.</p>
  <input id="tal-ico-search" placeholder="${isMap?'Search — planet, star, station, nebula…':'Search — shield, laser, radar, warp…'}" oninput="talIconSearch()" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:3px;font-size:12px">
  <div id="tal-ico-results" class="tal-ico-results"><div style="grid-column:1/-1;font-size:11px;color:var(--muted)">Searching…</div></div>
  <div style="margin-top:12px;text-align:right"><button class="btn" onclick="dismissModal()">CLOSE</button></div>`);
  const seed = typeof target==='number'
    ? ((S.ship.talents[target]||{}).name||'')
    : (target==='new' ? (document.getElementById('ship-talent-name-in')?.value||'') : '');
  talIconSearch(seed||'');
}
function talIconSearch(q) {
  const inp=document.getElementById('tal-ico-search');
  const res=document.getElementById('tal-ico-results');
  const raw=(typeof q==='string'?q:(inp?inp.value:'')).trim();
  clearTimeout(window._talIconTimer);
  // Sequence token: invalidates any in-flight fetch from an earlier search
  // (or an earlier picker), so a slow stale response can't overwrite the
  // results of the search that superseded it.
  const myReq = window._talIconReq = (window._talIconReq||0)+1;
  const quick=giQuicksetFor(window._talIconTarget);
  // Empty query on a map/room target: show the curated starter palette, no fetch.
  if(!raw && quick){ giRenderIcons(GI_QUICKSETS[quick]); return; }
  const term=raw||'star';
  window._talIconTimer=setTimeout(()=>{
    fetch('https://api.iconify.design/search?query='+encodeURIComponent(term)+'&prefix=game-icons&limit=60')
      .then(r=>r.json())
      .then(d=>{ if(myReq!==window._talIconReq) return; giRenderIcons((d.icons||[]).map(i=>i.replace('game-icons:',''))); })
      .catch(()=>{ if(myReq===window._talIconReq && res) res.innerHTML='<div style="grid-column:1/-1;font-size:11px;color:var(--muted)">Couldn’t reach game-icons.net — check your connection. Everything works fine without an icon.</div>'; });
  }, 250);
}
function pickTalIcon(slug) {
  const t=window._talIconTarget;
  if(typeof t==='number' && S.ship.talents && S.ship.talents[t]) {
    S.ship.talents[t].icon = (S.ship.talents[t].icon===slug)?'':slug;
    saveSlot(); dismissModal(); renderCurrentTab(); return;
  }
  if(typeof t==='string' && t.indexOf('cell:')===0) {
    const i=+t.slice(5), c=(S.sectors[S.activeSector]||{cells:[]}).cells[i];
    setCellProp(i,'icon',(c&&c.icon===slug)?'':slug);
    dismissModal(); renderCurrentTab(); return;
  }
  if(typeof t==='string' && t.indexOf('subzone:')===0) {
    const i=+t.slice(8), sz=window._mapZoom&&window._mapZoom.subZone, c=sz&&sz.cells[i];
    setSubZoneCellProp(i,'icon',(c&&c.icon===slug)?'':slug);
    dismissModal(); renderCurrentTab(); return;
  }
  if(typeof t==='string' && t.indexOf('input:')===0) {
    // Inline mode (interior-room modal): write into the input, refresh the
    // preview and highlight, and stay open — the surrounding modal owns the
    // save button.
    const el=document.getElementById(t.slice(6));
    if(el) el.value=(el.value.trim()===slug)?'':slug;
    const pv=document.getElementById('ic-icon-preview');
    if(pv) pv.innerHTML=giIconHTML(el?el.value.trim():'',22)||'<span style="font-size:9px;color:var(--muted)">no icon</span>';
    const res=document.getElementById('tal-ico-results');
    if(res){ const now=el?el.value.trim():''; [].slice.call(res.querySelectorAll('.tal-ico-opt')).forEach(b=>b.classList.toggle('sel',b.getAttribute('data-icon')===now)); }
    return;
  }
  // 'new' — the custom-talent row on the ship sheet
  window._talIconSel = (window._talIconSel===slug)?'':slug;
  const btn=document.getElementById('ship-talent-icon-btn');
  if(btn) btn.innerHTML = talIconHTML(window._talIconSel||'',16);
  dismissModal();
}

    ${c.trait ? `<div style="font-size:11px;color:var(--text);line-height:1.6;margin-bottom:10px;clear:none">${escH(c.trait)}</div>` : ''}

function loadShipClass(name) {
  const c = SHIP_CLASSES.find(x => x.name === name);
  if (!c) return;
  const sh = S.ship;
  // Talents can include hand-written customs that exist nowhere else — never
  // discard them silently.
  if (sh.talents && sh.talents.length &&
      !confirm('Selecting a class resets the ship\'s talents (' + sh.talents.length +
        ' currently chosen) so you can pick for the new class. Continue?')) return;
  sh.className = c.name;
  sh.era = c.era;
  sh.scale = c.scale;
  sh.comms = c.comms; sh.computers = c.computers; sh.engines = c.engines;
  sh.sensors = c.sensors; sh.structure = c.structure; sh.weapons = c.weapons;
  sh.command = c.command; sh.conn = c.conn; sh.security = c.security;
  sh.engineering = c.engineering; sh.science = c.science; sh.medicine = c.medicine;
  sh.trait = c.trait;
  sh.thumb = c.thumb || '';
  // Talents are NOT auto-attached: the class's suggested talents are offered
  // as one-tap chips in the wizard and on the ship sheet, and the player
  // chooses up to Scale of them. Changing class clears the old class's picks.
  sh.talents = [];
  window._shipClassPreview = name;
  saveSlot(); renderCurrentTab();
}

function isAdjacentCell(a,b) {
  const ar=Math.floor(a/5),ac=a%5,br=Math.floor(b/5),bc=b%5;
  return Math.abs(ar-br)+Math.abs(ac-bc)===1;
}
function clickMapCell(i) {
  window._selectedMapCell=i;
  const sector=S.sectors[S.activeSector];
  if(sector) sector.cells[i].type='explored';
  saveSlot(); renderCurrentTab();
}
function warpTo(i) {
  const sector=S.sectors[S.activeSector]; if(!sector)return;
  if(!sector.cells[i])return;
  // currentCell can be out of range in an imported save; warpToSubZone
  // already guarded this, warpTo did not.
  if(sector.cells[sector.currentCell]) sector.cells[sector.currentCell].isCurrent=false;
  sector.currentCell=i;
  sector.cells[i].isCurrent=true;
  sector.cells[i].type='explored';
  window._selectedMapCell=i;
  saveSlot(); renderCurrentTab();
}
function setCellProp(i,prop,val) {
  const sector=S.sectors[S.activeSector]; if(!sector)return;
  sector.cells[i][prop]=val; saveSlot();
}
function toggleVoid(i) {
  const sector=S.sectors[S.activeSector]; if(!sector)return;
  sector.cells[i].isVoid=!sector.cells[i].isVoid; saveSlot(); renderCurrentTab();
}
function switchSector(i) { S.activeSector=i; window._selectedMapCell=null; window._mapZoom=null; saveSlot(); renderCurrentTab(); }
function newSector() {
  showPrompt('Name the new sector:', `Sector ${String(S.sectors.length+1).padStart(3,'0')}`, (name)=>{
    if(!name.trim()) return;
    S.sectors.push(defaultSector(name.trim())); S.activeSector=S.sectors.length-1;
    window._selectedMapCell=null; saveSlot(); renderCurrentTab();
  });
}
function renameSector() {
  const sector=S.sectors[S.activeSector]; if(!sector)return;
  showPrompt('Rename sector:', sector.name, (name)=>{ if(!name.trim()) return; sector.name=name.trim(); saveSlot(); renderCurrentTab(); });
}
function deleteSector() {
  if(S.sectors.length<=1){openModal('<p style="font-size:13px;margin-bottom:16px">Cannot delete the only sector.</p><button class="btn" onclick="closeModal()" style="width:100%">OK</button>');return;}
  showConfirm('Delete this sector? This cannot be undone.', ()=>{
    S.sectors.splice(S.activeSector,1);
    S.activeSector=Math.max(0,S.activeSector-1);
    window._mapZoom=null; window._selectedMapCell=null;
    saveSlot(); renderCurrentTab();
  });
}

// ── Sub-zone functions ──────────────────────────────────────────────────────
function enterSubZone(cellIdx) {
  const sector = S.sectors[S.activeSector]; if(!sector) return;
  const cell = sector.cells[cellIdx];
  if(!cell.subZone) {
    // Ask type before creating
    const defaultName = cell.name || ('Area ' + (cellIdx+1));
    openModal(`<h2>WHAT TYPE OF ZONE?</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Choose the type of location. This sets the scale and position marker.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      ${['ship','planet','station','space','other'].map(t=>`
      <button class="btn btn-accent" style="padding:12px 8px;font-size:13px" onclick="createSubZone(${cellIdx},'${t}')">
        ${t==='ship'?'🚀 Ship':t==='planet'?'🌍 Planet':t==='station'?'🛸 Station':t==='space'?'✨ Space':'⬜ Other'}
      </button>`).join('')}
    </div>
    <p style="font-size:10px;color:var(--muted)">Ship, Planet, and Station use a crew figure as the position marker. Space and Other use the ship icon.</p>`);

function createSubZone(cellIdx, type) {
  dismissModal();
  const sector = S.sectors[S.activeSector]; if(!sector) return;
  const cell = sector.cells[cellIdx];
  cell.subZone = {
    name: cell.name || ('Area ' + (cellIdx+1)),
    type,
    currentCell: 12,
    cells: Array.from({length:25}, () => ({name:'', icon:'', isVoid:false, notes:'', feature:'', type:'unknown'}))
  };
  saveSlot();
  window._mapZoom = {cellIdx, subZone: cell.subZone};
  window._selectedMapCell = null;
  renderCurrentTab();
}

function exitSubZone() {
  window._mapZoom = null;
  window._selectedMapCell = null;
  renderCurrentTab();
}

function setSubZoneName(val) {
  if(!window._mapZoom) return;
  window._mapZoom.subZone.name = val;
  const sector = S.sectors[S.activeSector];
  if(sector) sector.cells[window._mapZoom.cellIdx].subZone = window._mapZoom.subZone;
  saveSlot();
}

function setSubZoneCellProp(i, prop, val) {
  if(!window._mapZoom) return;
  window._mapZoom.subZone.cells[i][prop] = val;
  const sector = S.sectors[S.activeSector];
  if(sector) sector.cells[window._mapZoom.cellIdx].subZone = window._mapZoom.subZone;
  saveSlot();
}

function clickSubZoneCell(i) {
  if(!window._mapZoom) return;
  window._selectedMapCell = i;
  window._mapZoom.subZone.cells[i].type = 'explored';
  const sector = S.sectors[S.activeSector];
  if(sector) sector.cells[window._mapZoom.cellIdx].subZone = window._mapZoom.subZone;
  saveSlot(); renderCurrentTab();
}

function warpToSubZone(i) {
  if(!window._mapZoom) return;
  const sz = window._mapZoom.subZone;
  if(sz.cells[sz.currentCell]) sz.cells[sz.currentCell].isCurrent = false;
  sz.currentCell = i;
  sz.cells[i].isCurrent = true;
  sz.cells[i].type = 'explored';
  window._selectedMapCell = i;
  const sector = S.sectors[S.activeSector];
  if(sector) sector.cells[window._mapZoom.cellIdx].subZone = sz;
  saveSlot(); renderCurrentTab();
}

function toggleSubZoneVoid(i) {
  if(!window._mapZoom) return;
  window._mapZoom.subZone.cells[i].isVoid = !window._mapZoom.subZone.cells[i].isVoid;
  const sector = S.sectors[S.activeSector];
  if(sector) sector.cells[window._mapZoom.cellIdx].subZone = window._mapZoom.subZone;
  saveSlot(); renderCurrentTab();
}

function escH(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escQ(s) {
  if(!s) return '';
  // Values pass through here into an inline onclick="..." JS string, so the
  // backslash must go first, then the quote characters that would close
  // either the JS literal or the HTML attribute around it.
  return String(s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/"/g,'&quot;')
    .replace(/&(?!quot;)/g,'&amp;')
    .replace(/[\r\n]/g,' ');
}
function toggleCollapsible(id) {
  const el=document.getElementById(id); if(!el)return;
  el.classList.toggle('open');
  if(!window._openCollapsibles)window._openCollapsibles={};
  window._openCollapsibles[id]=el.classList.contains('open');
}

// Declared before BOOT: the init IIFE calls loadSlot(), which
// broadcasts to the HUD, and `let` bindings are not hoisted.

let _hudVis = {stats:true, vitals:true, dice:true, log:true, encounter:true, npcSpot:-1, shipStats:false, sectorMap:false, interiorMap:false};
let _hudCamResH = parseInt(localStorage.getItem('stcl-cam-res')||'720')||720;
let _hudWin = null;
let _hudChannel = null;
let _hudPanelOpen = false;
let _lastRollData = null;
let _hudRec = false, _hudRecTimer = null, _hudRecSecs = 0, _hudRecIdleTicks = 0;

// ============================================================
// BOOT
// ============================================================

(function init() {
  const saved = parseInt(localStorage.getItem('stcl_active_slot'), 10);
  ACTIVE_SLOT = (saved >= 0 && saved <= 2) ? saved : 0;
  loadSlot(ACTIVE_SLOT);
  if (S.ship.className && !window._shipClassPreview) {
    window._shipClassPreview = S.ship.className;
  }
  renderCurrentTab();
  if (localStorage.getItem('stcl-theme') === 'red-alert') {
    document.body.classList.add('red-alert');
    const btn = document.getElementById('red-alert-btn');
    if (btn) btn.style.opacity = '1';
  } else {
    const btn = document.getElementById('red-alert-btn');
    if (btn) btn.style.opacity = '0.5';
  }
})();


// ============================================================
// LIVE HUD
// ============================================================

// (HUD state is declared above BOOT - loadSlot touches it during init)

// The recorder itself lives in the HUD popup (it owns the screen-capture and
// the camera audio track). This button just drives it and mirrors its state.
function toggleHudRec() {
  if (!_hudWin || _hudWin.closed || typeof _hudWin.toggleRec !== 'function') {
    alert('Open the HUD first - recording captures the HUD window.');
    return;
  }
  _hudWin.toggleRec();
  startHudRecPoll();
}

function startHudRecPoll() {
  if (_hudRecTimer) return;
  _hudRecIdleTicks = 0;
  _hudRecTimer = setInterval(() => {
    const live = !!(_hudWin && !_hudWin.closed && _hudWin._rec);
    if (live !== _hudRec) { _hudRec = live; _hudRecIdleTicks = 0; refreshHudCtrl(); }
    if (live) {
      _hudRecSecs = _hudWin._secs || 0;
      const t = document.getElementById('hud-rec-timer');
      if (t) t.textContent = `${String(Math.floor(_hudRecSecs/60)).padStart(2,'0')}:`
        + `${String(_hudRecSecs%60).padStart(2,'0')}`;
    } else if (++_hudRecIdleTicks > 60) {
      // give up after ~30s of nothing - the user probably cancelled the picker
      clearInterval(_hudRecTimer); _hudRecTimer = null; _hudRecSecs = 0;
    }
  }, 500);
}

function toggleHudPanel() {
  _hudPanelOpen = !_hudPanelOpen;
  document.body.classList.toggle('hud-panel-open', _hudPanelOpen);
  const wrap = document.getElementById('hud-ctrl-wrap');
  if (wrap) wrap.innerHTML = _hudPanelOpen ? buildHudCtrlHTML() : '';
}

function buildHudCtrlHTML() {
  const npcs = S.npcs || [];
  const npcChips = [['None', -1], ...npcs.map((n,i)=>[n.name.slice(0,12), i])]
    .map(([label, idx]) => `<button class="hc-chip${_hudVis.npcSpot===idx?' on':''}" onclick="setHudNpc(${idx})">${escH(label)}</button>`).join('');
  // on = not explicitly false (default-on chips show as active unless turned off)
  // Determine active key per zone for chip highlighting
  // `log` is only the active right panel when it has not been switched off,
  // otherwise the chip claimed the journal was on stage over a blank panel.
  const rightActive = _hudVis.sectorMap===true ? 'sectorMap'
    : _hudVis.interiorMap===true ? 'interiorMap'
    : _hudVis.log!==false ? 'log' : null;
  const centerActive = _hudVis.encounter===true ? 'encounter' : _hudVis.oracle===true ? 'oracle' : _hudVis.extTasks===true ? 'extTasks' : 'mission';
  const visChip  = (key, label) =>
    `<button class="hc-chip${_hudVis[key]!==false?' on':''}" onclick="toggleHudVis('${key}')">${label}</button>`;
  const leftChip = (key, label) =>
    `<button class="hc-chip${_hudVis[key]===true?' on':''}" onclick="toggleHudVis('${key}')">${label}</button>`;
  const rightChip  = (key, label) =>
    `<button class="hc-chip${rightActive===key?' on':''}" onclick="toggleHudVis('${key}')">${label}</button>`;
  const centerChip = (key, label) =>
    `<button class="hc-chip${centerActive===key?' on':''}" onclick="toggleHudVis('${key}')">${label}</button>`;
  const recOn = !!_hudRec;
  const timerStr = `${String(Math.floor(_hudRecSecs/60)).padStart(2,'0')}:${String(_hudRecSecs%60).padStart(2,'0')}`;
  return `
  <div id="hud-ctrl-panel">
    <!-- LEFT PANEL — Officer or Ship Stats -->
    <div class="hc-zone">
      <div class="hc-zone-label">← Left Panel</div>
      <div class="hc-chips">
        ${leftChip('stats','Officer')}
        ${leftChip('shipStats','Ship Stats')}
      </div>
      <div class="hc-chips">${visChip('vitals','Vitals')}</div>
    </div>
    <!-- CENTER — Mission or Encounter -->
    <div class="hc-zone">
      <div class="hc-zone-label">Center</div>
      <div class="hc-chips">
        ${centerChip('mission','Mission')}
        ${centerChip('encounter','Encounter')}
        ${centerChip('oracle','Oracle')}
        ${centerChip('extTasks','Ext. Tasks')}
      </div>
      <div class="hc-chips" style="margin-top:3px">
        ${visChip('dice','Dice')}
        <button class="hc-chip" onclick="clearHudOracle()" style="color:#FF6644;font-size:9px;padding:2px 7px" title="Clear oracle ticker">Clear Oracle</button>
      </div>
    </div>
    <!-- RIGHT PANEL — Journal, Sector Map, or Ship Interior -->
    <div class="hc-zone">
      <div class="hc-zone-label">Right Panel →</div>
      <div class="hc-chips">
        ${rightChip('log','Journal')}
        ${rightChip('sectorMap','Sector Map')}
        ${rightChip('interiorMap','Ship Interior')}
      </div>
      <div class="hc-zone-label" style="margin-top:3px">NPC Spotlight</div>
      <div class="hc-chips">${npcChips||'<span style="font-size:10px;color:var(--muted)">No NPCs</span>'}</div>
    </div>
    <!-- Actions -->
    <div class="hc-zone-actions">
      <div style="display:flex;gap:6px;align-items:center">
        <button class="hud-open-btn" onclick="openHUD()">▶ Open HUD</button>
        <button class="hc-chip" onclick="toggleHudPanel()" style="font-size:9px;padding:3px 8px">✕</button>
      </div>
      <div class="hud-rec-row">
        <button class="hud-rec-btn${recOn?' on':''}" id="hud-rec-btn" onclick="toggleHudRec()">${recOn?'⏹ Stop':'⏺ Rec'}</button>
        <span id="hud-rec-timer">${recOn?timerStr:''}</span>
      </div>
      <select style="background:#000;border:1px solid var(--accent-dim);color:var(--text);padding:3px 8px;font-size:10px;border-radius:4px;font-family:var(--font)" onchange="setHudCamRes(+this.value)">
        <option value="480"${_hudCamResH===480?' selected':''}>480p</option>
        <option value="720"${_hudCamResH===720?' selected':''}>720p</option>
        <option value="1080"${_hudCamResH===1080?' selected':''}>1080p</option>
      </select>
    </div>
  </div>`;
}

const HUD_LEFT_KEYS   = ['stats','shipStats'];
const HUD_RIGHT_KEYS  = ['log','sectorMap','interiorMap'];
const HUD_CENTER_KEYS = ['mission','encounter','oracle','extTasks'];
function toggleHudVis(key) {
  _hudVis[key] = !_hudVis[key];
  if (_hudVis[key]) {
    [HUD_LEFT_KEYS, HUD_RIGHT_KEYS, HUD_CENTER_KEYS].forEach(grp => {
      if (grp.includes(key)) grp.forEach(k => { if (k !== key) _hudVis[k] = false; });
    });
  }
  hudBroadcast(); refreshHudCtrl();
}
function setHudNpc(idx) { _hudVis.npcSpot = idx; hudBroadcast(); refreshHudCtrl(); }
function setHudCamRes(resH) {
  _hudCamResH = resH;
  localStorage.setItem('stcl-cam-res', resH);
  refreshHudCtrl();
}
async function reacquireCamStream(resH) {
  if (resH) { _hudCamResH = resH; localStorage.setItem('stcl-cam-res', resH); }
  if (window._hudCamStream) { window._hudCamStream.getTracks().forEach(t=>t.stop()); window._hudCamStream=null; }
  const h = _hudCamResH||720, w = h===480?640:h===1080?1920:1280;
  const tries = [
    {video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:30}},audio:true},
    {video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:30}},audio:false},
    {video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false},
    {video:true,audio:false}
  ];
  for (const con of tries) {
    try { window._hudCamStream = await navigator.mediaDevices.getUserMedia(con); break; } catch(e) {}
  }
  refreshHudCtrl();
}
function refreshHudCtrl() {
  const wrap = document.getElementById('hud-ctrl-wrap');
  if (wrap && _hudPanelOpen) wrap.innerHTML = buildHudCtrlHTML();
}

async function openHUD() {
  if (_hudChannel) _hudChannel.close();
  _hudChannel = new BroadcastChannel('stcl-hud');

  // Acquire camera in main window first — popup context can't call getUserMedia.
  // HUD reads the stream via window.opener._hudCamStream.
  if (window._hudCamStream) { window._hudCamStream.getTracks().forEach(t => t.stop()); window._hudCamStream = null; }
  const resH = _hudCamResH || 720;
  const resW = resH===480?640:resH===1080?1920:1280;
  const camTries = [
    {video:{width:{ideal:resW},height:{ideal:resH},frameRate:{ideal:30}},audio:true},
    {video:{width:{ideal:resW},height:{ideal:resH},frameRate:{ideal:30}},audio:false},
    {video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false},
    {video:true,audio:false}
  ];
  for (const con of camTries) {
    try { window._hudCamStream = await navigator.mediaDevices.getUserMedia(con); break; } catch(e) {}
  }
  // Pre-enumerate devices in main window (where permissions are established).
  // HUD reads window.opener._hudDeviceList to avoid cross-window method call issues.
  _hudWin = window.open('', 'stcl-hud', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
  if (!_hudWin) { alert('Pop-up blocked — please allow pop-ups for this page.'); return; }
  const _hudHtml = buildHUDHtml();
  _hudWin.document.open();
  _hudWin.document.write(_hudHtml);
  _hudWin.document.close();
  setTimeout(() => hudBroadcast(), 400);
  setTimeout(() => hudBroadcast(), 1000);
}

function hudBroadcast(extra) {
  if (!_hudChannel) return;
  const c = S.char || {};
  const sh = S.ship || {};
  const isCreating = !c.creationComplete;
  _hudChannel.postMessage({
    type: 'state',
    char: isCreating ? null : {
      name: c.name, rank: c.rank, species: c.species, era: c.era, assignment: c.assignment,
      control: c.control, daring: c.daring, fitness: c.fitness,
      insight: c.insight, presence: c.presence, reason: c.reason,
      command: c.command, conn: c.conn, security: c.security,
      engineering: c.engineering, science: c.science, medicine: c.medicine,
      determination: c.determination, momentum: c.momentum, threat: c.threat,
      stress: c.stress, values: c.values, focuses: c.focuses
    },
    creation: isCreating ? {
      step: c.creationStep || 0,
      species: lpSpeciesDisplay(c) || '',   // mixed heritage / named new species
      era: c._selectedEra || '',
      env: c._selectedEnv || '',
      upbringing: c._selectedUpbringing || '',
      track: c._selectedTrack || '',
      careerLength: c.careerLength || '',
      careerEvent: c.careerEvent || '',
      careerEvent2: c.careerEvent2 || '',
      focuses: c.focuses || [],
      name: c.name || '',
      rank: c.rank || '',
    } : null,
    ship: {
      name: sh.name, className: sh.className, scale: sh.scale,
      // Same fallback chain as shipIconHtml(): own thumb, else the class art.
      thumb: (sh.thumb || matchShipThumb(sh.className)) ? new URL(sh.thumb || matchShipThumb(sh.className), location.href).href : '',
      comms: sh.comms, computers: sh.computers, engines: sh.engines,
      sensors: sh.sensors, structure: sh.structure, weapons: sh.weapons,
      command: sh.command, conn: sh.conn, security: sh.security,
      engineering: sh.engineering, science: sh.science, medicine: sh.medicine,
      talents: (sh.talents||[]).map(t=>({name:t.name, desc:t.desc||'', icon:t.icon||''}))
    },
    sectorMap: (() => { const sec = S.sectors[S.activeSector] || {}; const cur = sec.cells ? sec.cells[sec.currentCell] || {} : {}; return { name: sec.name, currentCell: sec.currentCell, cells: (sec.cells||[]).map(c=>({name:c.name, icon:c.icon, isVoid:c.isVoid})), curName: cur.name||'', curFeature: cur.feature||'', curNotes: cur.notes||'', curType: cur.type||'' }; })(),
    interiorMap: { cells: (sh.interiorCells||[]).map(c=>({name:c.name, icon:c.icon, isVoid:c.isVoid})), shipName: sh.name||'', shipClass: sh.className||'', shipScale: sh.scale||'' },
    npcs: S.npcs || [],
    encounter: S.combatEnemies || [],
    combatOpps: S.combatOpp || [],
    playerStress: S.playerStress || [false,false,false],
    oracle: window._lastOracleResult || null,
    oracleQueue: window._hudOracleQueue || [],
    extTasks: (S.extTasks || []).map(t=>({name:t.name, circles:t.circles, progress:(t.progress||[]).slice()})),
    dice: _lastRollData,
    log: (S.log || []).slice(-3).reverse(),
    vis: _hudVis,
    ...(extra || {})
  });
}

    <div class="res-mini">
      <div class="rmi"><div class="rv" id="h-momentum">0</div><div class="rl">Momentum</div></div>
      <div class="rmi"><div class="rv" id="h-threat">0</div><div class="rl">Threat</div></div>
    </div>
    <div class="res-mini" style="margin-top:4px">
      <div class="rmi" style="flex:1">
        <div class="rv" id="h-det" style="display:flex;gap:4px;justify-content:center;align-items:center;min-height:18px"></div>

  </div>
  <div id="h-right-smap" style="display:none">

    <div style="margin-top:8px;padding-top:8px;border-top:1px solid #2a1200">
      <div id="h-smap-cur-name" style="font-size:14px;font-weight:700;color:#FF9933;text-transform:uppercase;letter-spacing:1px;line-height:1.2"></div>

    </div>
  </div>
  <div id="h-right-imap" style="display:none">

    <div style="margin-top:8px;padding-top:8px;border-top:1px solid #2a1200">
      <div id="h-imap-ship-name" style="font-size:14px;font-weight:700;color:#FF9933;text-transform:uppercase;letter-spacing:1px;line-height:1.2"></div>
      <div id="h-imap-ship-sub" style="font-size:10px;color:#FFCC99;margin-top:3px"></div>
    </div>

<!-- NPC SPOTLIGHT — floating center popup -->
<div id="p-spotlight" class="panel" style="display:none">
  <div class="ph lav">NPC Spotlight</div>
  <div id="h-spot-name" style="font-size:22px;font-weight:700;color:#CC99FF;line-height:1;margin-bottom:4px"></div>
  <div id="h-spot-sub" class="sml"></div>
  <div id="h-spot-role" style="font-size:11px;color:#FFCC99;margin-top:5px"></div>
  <div id="h-spot-notes" style="font-size:10px;color:#9a6a3a;margin-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical"></div>
</div>

<!-- CENTER: Mission or Encounter -->
<div id="p-center" class="panel" style="display:none">
  <div class="ph ltb" id="p-center-header">Mission</div>
  <div id="h-mission-section">
    <div id="h-mission-text" style="font-size:13px;font-weight:700;color:#FFCC99;text-transform:uppercase;letter-spacing:1px"></div>
    <div id="h-ship-text" style="font-size:10px;color:#7a4a1a;margin-top:3px;text-transform:uppercase;letter-spacing:0.5px"></div>
  </div>
  <div id="h-enc-section" style="display:none">
    <div id="h-enc-content"><span class="sml">No active encounter</span></div>
  </div>
  <div id="h-oracle-section" style="display:none">
    <div id="h-oracle-ticker"><span class="sml">No results yet</span></div>
  </div>
  <div id="h-ext-tasks-section" style="display:none">
    <div id="h-ext-tasks-list"></div>
  </div>
</div>

<!-- BOTTOM CENTER: Dice -->
<div id="p-dice" class="panel" style="display:none">
  <div class="ph blue">Last Roll</div>
  <div id="h-dice-row"><span class="sml">No roll yet</span></div>
  <div id="h-dice-info"></div>
</div>

<!-- LEFT (creation mode): Officer creation progress -->
<div id="p-creation" class="panel" style="display:none">
  <div class="cr-title">Creating Officer</div>
  <div id="cr-dots" class="cr-dots"></div>
  <div id="cr-step" class="cr-step"></div>
  <div id="cr-body"></div>
</div>

<script>
var _rec=null,_chunks=[],_timer=null,_secs=0;
var _stream=null,_hdStream=null,_bgEffect=null,_bgDisplayStream=null;
var _previewStream=null,_previewEffect=null;
var _bgType='none',_bgSrc='';var BG_BASE='${bgBase}';
var _segThreshold=140,_segFeather=4,_segModelSel=1,_camResH=720;
var _ch=new BroadcastChannel('stcl-hud');
_ch.onmessage=function(e){if(e.data&&e.data.type==='state')applyState(e.data);};

// The popup is its own document - it cannot reach the main window's helpers.
function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// A game-icons slug renders as a themed mask; emoji / free text renders as text.
function giCell(v,px){
  v=String(v==null?'':v).trim();
  if(!v) return '';
  if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(v)) return escH(v);
  var u='https://api.iconify.design/game-icons/'+encodeURIComponent(v)+'.svg';
  return '<span style="display:inline-block;width:'+px+'px;height:'+px+'px;vertical-align:middle;background:currentColor;-webkit-mask:url('+u+') center/contain no-repeat;mask:url('+u+') center/contain no-repeat"></span>';
}

// Derived from CREATION_STEPS so the two can never drift apart again.
var CREATION_STEP_NAMES=${JSON.stringify(CREATION_STEPS.map(st=>st.title))};

function applyState(d){
  var vis=d.vis||{};

  // Creation mode
  if(d.creation){
    var cr=d.creation;
    var stepCount=CREATION_STEP_NAMES.length;
    var dots='';
    for(var si=0;si<stepCount;si++){
      var dc=si<cr.step?'cr-dot done':si===cr.step?'cr-dot active':'cr-dot';
      dots+='<div class="'+dc+'" title="'+CREATION_STEP_NAMES[si]+'"></div>';
    }
    setHTML('cr-dots',dots);
    setText('cr-step','Step '+(cr.step+1)+' of '+stepCount+' — '+(CREATION_STEP_NAMES[cr.step]||''));
    var cb='';
    if(cr.species){cb+='<div class="cr-field"><div class="cr-lbl">Species</div><div class="cr-val">'+escH(cr.species)+'</div>'+(cr.era?'<div class="cr-sub">'+escH(cr.era)+'</div>':'')+'</div>';}
    if(cr.env){cb+='<div class="cr-field"><div class="cr-lbl">Environment</div><div class="cr-val">'+escH(cr.env)+'</div></div>';}
    if(cr.upbringing){cb+='<div class="cr-field"><div class="cr-lbl">Early Outlook</div><div class="cr-val">'+escH(cr.upbringing)+'</div></div>';}
    if(cr.track){cb+='<div class="cr-field"><div class="cr-lbl">Education</div><div class="cr-val">'+escH(cr.track)+'</div></div>';}
    if(cr.careerLength){cb+='<div class="cr-field"><div class="cr-lbl">Career Length</div><div class="cr-val">'+escH(cr.careerLength)+'</div></div>';}
    if(cr.careerEvent){cb+='<div class="cr-field"><div class="cr-lbl">Career Event 1</div><div class="cr-val" style="font-size:11px">'+escH(cr.careerEvent)+'</div></div>';}
    if(cr.careerEvent2){cb+='<div class="cr-field"><div class="cr-lbl">Career Event 2</div><div class="cr-val" style="font-size:11px">'+escH(cr.careerEvent2)+'</div></div>';}
    if(cr.focuses&&cr.focuses.length){cb+='<div class="cr-field"><div class="cr-lbl">Focuses</div><div class="cr-feats">'+cr.focuses.map(function(f){return '<div class="cr-feat">'+escH(f)+'</div>';}).join('')+'</div></div>';}
    if(cr.name){cb+='<div class="cr-field"><div class="cr-lbl">Name</div><div class="cr-val">'+escH(cr.name)+'</div>'+(cr.rank?'<div class="cr-sub">'+escH(cr.rank)+'</div>':'')+'</div>';}
    setHTML('cr-body',cb||'<div class="sml">Waiting for input\u2026</div>');
    show('p-creation',true);
    show('p-left',false);
    // A new officer has no journal yet, and the right panel still held the
    // previous character's entries (or a stale sector map underneath).
    show('p-right',false);
    show('h-log-section',false);
    show('h-right-smap',false);
    show('h-right-imap',false);
    show('p-center',false);
    show('p-spotlight',false);
    show('p-dice',vis.dice!==false);
    return;
  }

  show('p-creation',false);
  var showShip=vis.shipStats===true;
  show('p-left',vis.stats!==false||vis.shipStats===true);
  show('h-officer-section',!showShip);
  show('h-shipstats-section',showShip);
  setText('p-left-header',showShip?'Ship':'Officer');
  // Right panel: Journal, Sector Map, or Ship Interior (exclusive)
  var showSmap=vis.sectorMap===true;
  var showImap=vis.interiorMap===true;
  var showLog=!showSmap&&!showImap&&vis.log!==false;
  show('p-right',showLog||showSmap||showImap);
  show('h-log-section',showLog);
  show('h-right-smap',showSmap);
  show('h-right-imap',showImap);
  setText('p-right-header',showSmap?'Sector Map':showImap?'Ship Interior':"Captain's Log");
  // Center panel: Mission, Encounter, Oracle, or Extended Tasks (exclusive)
  var showEnc=vis.encounter===true;
  var showOracle=vis.oracle===true;
  var showExtTasks=vis.extTasks===true;
  var showMission=!showEnc&&!showOracle&&!showExtTasks;
  show('p-center',true);
  show('h-mission-section',showMission);
  show('h-enc-section',showEnc);
  show('h-oracle-section',showOracle);
  show('h-ext-tasks-section',showExtTasks);
  setText('p-center-header',showEnc?'Encounter':showOracle?'Oracle':showExtTasks?'Extended Tasks':'Mission');
  if(showExtTasks){
    var tasks=d.extTasks||[];
    var listEl=document.getElementById('h-ext-tasks-list');
    if(listEl){
      if(!tasks.length){listEl.innerHTML='<div style="font-size:11px;color:#7a4a1a">No extended tasks</div>';}
      else{listEl.innerHTML=tasks.map(function(t){
        var prog=Array.isArray(t.progress)?t.progress:[];
        var filled=prog.filter(Boolean).length;
        var circles=prog.map(function(p,j){
          return '<div style="width:18px;height:18px;border-radius:50%;border:2px solid '+(p?'#66CC66':'#7a4a1a')+';background:'+(p?'#66CC66':'#000')+';display:inline-block;margin:1px"></div>';
        }).join('');
        return '<div style="margin-bottom:10px"><div style="font-size:11px;color:#FFCC99;font-weight:700;letter-spacing:1px;margin-bottom:4px">'+escH(t.name)+'</div><div style="font-size:9px;color:#7a4a1a;margin-bottom:4px">'+filled+'/'+t.circles+' complete</div><div style="display:flex;flex-wrap:wrap;gap:2px">'+circles+'</div></div>';
      }).join('');}
    }
  }
  if(showOracle){
    var queue=d.oracleQueue||[];
    var ticker=document.getElementById('h-oracle-ticker');
    if(ticker){
      var lastId=+(ticker.dataset.lastId||0);
      var newTop=queue.length>0?queue[0].id:0;
      ticker.innerHTML=queue.length?queue.map(function(orc,i){
        var isNew=(orc.id||0)>lastId;
        return '<div class="oracle-tick'+(i===0&&isNew?' tick-new':'')+'">'+
          '<div style="font-size:8px;color:#7a4a1a;letter-spacing:1px;text-transform:uppercase">'+escH(orc.type)+'</div>'+
          '<div style="font-size:15px;font-weight:700;color:#CC99FF;text-transform:uppercase;letter-spacing:1px;line-height:1.2">'+escH(orc.result)+'</div>'+
          (orc.sub?'<div style="font-size:9px;color:#7a4a1a;margin-top:1px">'+escH(orc.sub)+'</div>':'')+
          '</div>';
      }).join(''):'<span class="sml">No results yet</span>';
      if(newTop)ticker.dataset.lastId=newTop;
    }
  }
  show('p-dice',vis.dice!==false);
  show('h-vitals-wrap',vis.vitals!==false);
  // NPC Spotlight — separate floating panel
  var npcSpot=(vis.npcSpot!=null?vis.npcSpot:-1);
  var npcs=d.npcs||[];
  if(npcSpot>=0&&npcs[npcSpot]){
    var npc=npcs[npcSpot];
    show('p-spotlight',true);
    setText('h-spot-name',npc.name||'Unknown');
    setText('h-spot-sub',(npc.faction||'')+(npc.role?' \u00b7 '+npc.role:''));
    setText('h-spot-notes',npc.notes?(npc.notes.slice(0,200)):'');
  }else{show('p-spotlight',false);}

  var c=d.char||{};
  setText('h-name',c.name||'Unknown Officer');
  setText('h-rank',(c.rank||'')+(c.species?' \u00b7 '+c.species:''));
  setText('h-era',c.era||'');

  // Attributes — vertical rows with proportional bar (max 12)
  var ATTRS=[['Control',c.control],['Daring',c.daring],['Fitness',c.fitness],['Insight',c.insight],['Presence',c.presence],['Reason',c.reason]];
  setHTML('h-attrs',ATTRS.map(function(a){
    var v=a[1]||0,pct=Math.min(100,Math.round(v/12*100));
    return '<div class="attr-item"><span class="an">'+a[0]+'</span><div class="ab"><div class="ab-fill" style="width:'+pct+'%"></div></div><span class="av">'+(v||'\u2014')+'</span></div>';
  }).join(''));

  // Disciplines — pip dots (max 5)
  var DISCS=[['Command',c.command],['Conn',c.conn],['Security',c.security],['Engineering',c.engineering],['Science',c.science],['Medicine',c.medicine]];
  setHTML('h-discs',DISCS.map(function(a){
    var v=a[1]||0,dots='';
    for(var i=1;i<=5;i++)dots+='<div class="ddot'+(i<=v?' on':'')+'"></div>';
    return '<div class="disc-item-v"><span class="dn">'+a[0]+'</span><div class="dd">'+dots+'</div></div>';
  }).join(''));

  // Vitals
  var det=c.determination||0,detH='';
  for(var i=1;i<=3;i++)detH+='<div class="det-dot'+(i<=det?' on':'')+'"></div>';
  setHTML('h-det',detH);
  setText('h-momentum',c.momentum||0);
  setText('h-threat',c.threat||0);

  // Mission
  setText('h-mission-text',c.assignment||c.role||'No mission assigned');
  var sh=d.ship||{};
  setText('h-ship-text',sh.name?(sh.name+(sh.className?' \u00b7 '+sh.className:'')+(sh.scale?' \u00b7 Scale '+sh.scale:'')):'No ship configured');

  // Ship thumbnail
  setHTML('h-ship-thumb', sh.thumb ? '<img src="'+escH(sh.thumb)+'" style="max-width:100%;max-height:90px;object-fit:contain;filter:drop-shadow(0 0 8px #99CCFF)" onerror="this.style.display=\\'none\\'">' : '');

  // Ship Stats — systems use bars (max 12), departments use pip dots (max 5)
  var SYS=[['Comms',sh.comms],['Computers',sh.computers],['Engines',sh.engines],['Sensors',sh.sensors],['Structure',sh.structure],['Weapons',sh.weapons]];
  var DEPT=[['Command',sh.command],['Conn',sh.conn],['Security',sh.security],['Engineering',sh.engineering],['Science',sh.science],['Medicine',sh.medicine]];
  setHTML('h-ship-sys',SYS.map(function(a){
    var v=a[1]||0,pct=Math.min(100,Math.round(v/12*100));
    return '<div class="attr-item"><span class="an">'+a[0]+'</span><div class="ab"><div class="ab-fill" style="width:'+pct+'%;background:#99CCFF"></div></div><span class="av" style="color:#99CCFF">'+(v||'\u2014')+'</span></div>';
  }).join(''));
  setHTML('h-ship-dept',DEPT.map(function(a){
    var v=a[1]||0,dots='';
    for(var i=1;i<=5;i++)dots+='<div class="ddot'+(i<=v?' on':'')+'"></div>';
    return '<div class="disc-item-v"><span class="dn">'+a[0]+'</span><div class="dd">'+dots+'</div></div>';
  }).join(''));

  // Ship talents (icon + name; description in the tooltip)
  var shTals=sh.talents||[];
  show('h-ship-tal-wrap',shTals.length>0);
  setHTML('h-ship-tal',shTals.map(function(t){
    return '<div style="font-size:10px;margin-bottom:3px;color:#99CCFF;font-weight:700" title="'+escH(t.desc||'')+'">'+(t.icon?giCell(t.icon,13)+' ':'')+escH(t.name)+'</div>';
  }).join(''));

  // Sector map
  var sm=d.sectorMap||{};
  setText('h-sector-name',(sm.name||'Sector')+' \u2014 Map');
  var smCells=sm.cells||[];
  var smCur=sm.currentCell!=null?sm.currentCell:12;
  setHTML('h-smap',smCells.map(function(cell,idx){
    var cls='scell'+(cell.isVoid?' void':'')+(idx===smCur?' cur':'');
    var icon=cell.icon?giCell(cell.icon,16):(idx===smCur?'\uD83D\uDE80':'\u00b7');
    var nameEl=cell.name?'<div class="scell-name">'+escH(cell.name)+'</div>':'';
    return '<div class="'+cls+'">'+icon+nameEl+'</div>';
  }).join(''));
  setText('h-smap-cur-name',sm.curName||('Location '+(smCur+1)));
  setText('h-smap-cur-feature',sm.curFeature||'');
  setText('h-smap-cur-notes',sm.curNotes||'');

  // Interior map
  var im=d.interiorMap||{};
  var imCells=im.cells||[];
  setText('h-interior-name',(im.shipName||sh.name||'Ship')+' Interior');
  setHTML('h-imap',imCells.map(function(cell){
    var cls='icell'+(cell.isVoid?' void':'');
    var icon=cell.icon?giCell(cell.icon,13):'';
    var nameEl=cell.name?'<div class="icell-name">'+escH(cell.name)+'</div>':'';
    return '<div class="'+cls+'">'+(icon||(!cell.isVoid?'\u00b7':''))+nameEl+'</div>';
  }).join(''));
  setText('h-imap-ship-name',im.shipName||sh.name||'');
  setText('h-imap-ship-sub',(im.shipClass?im.shipClass+' Class':'')+((im.shipClass&&im.shipScale)?' \u00b7 ':'')+((im.shipScale?'Scale '+im.shipScale:'')));

  // Dice
  var dice=d.dice;
  if(dice&&dice.rolls){
    var dHTML=dice.rolls.map(function(r){
      var cls=r===1?'crit':r===20?'comp':(r<=dice.tn?'suc':'fail');
      return '<div class="die-box '+cls+'">'+r+'</div>';
    }).join('');
    var oc=dice.success?(dice.label==='Opposition'?'#FF4422':'#66CC66'):(dice.label==='Opposition'?'#66CC66':'#FF4422');
    var ot=dice.label==='Opposition'?(dice.success?'OPPOSITION SUCCEEDS':'OPPOSITION FAILS'):(dice.success?'SUCCESS':'FAILURE');
    dHTML+='<div style="font-size:11px;font-weight:700;color:'+oc+';width:100%;margin-top:4px;text-transform:uppercase;letter-spacing:1px">'+ot+'</div>';
    setHTML('h-dice-row',dHTML);
    setHTML('h-dice-info',(dice.label?dice.label+' \u00b7 ':'')+'TN: '+dice.tn+' | '+dice.successes+' success'+(dice.successes!==1?'es':'')+(dice.complications?' | '+dice.complications+' complication':''));
  }

  // Log
  var log=d.log||[];
  setHTML('h-log-content',log.length?log.map(function(e){
    if(e.type==='episode') return '<div style="display:flex;align-items:center;gap:6px;margin:10px 0 6px"><div style="flex:1;height:1px;background:#3a2000"></div><div style="font-size:9px;color:#FF9933;letter-spacing:2px;text-transform:uppercase;white-space:nowrap">'+escH(e.title||'Episode')+'</div><div style="flex:1;height:1px;background:#3a2000"></div></div>';
    var body = typeof e.body === 'string' ? e.body : (e.body == null ? '' : String(e.body));
    return '<div class="log-entry"><div class="log-title">'+escH(e.title||e.type||'Log')+'</div><div class="log-date">'+escH(e.date||'')+'</div>'+(body?'<div class="log-body">'+escH(body.slice(0,140))+'</div>':'')+'</div>';
  }).join(''):'<span class="sml">No entries</span>');

  // Encounter — player stress at top, then combat enemies (both NPC encounter + manual opponents)
  var enc=d.encounter||[];
  var opps=d.combatOpps||[];
  var allOpps=enc.concat(opps);
  var ps=d.playerStress||[false,false,false];
  var charName=(d.char&&d.char.name)||'Crew';
  var psDots=ps.map(function(s){return '<div class="sdot'+(s?' hit':'')+'"></div>';}).join('');
  var playerRow='<div class="enc-row"><div class="enc-name" style="color:#FF9933">'+escH(charName)+'</div><div class="stress-dots">'+psDots+'</div></div>';
  var oppRows=allOpps.map(function(e){
    var stress=e.stress||[];
    var count=e.circles||stress.length||3;
    var dots='';
    for(var i=0;i<count;i++) dots+='<div class="sdot'+(stress[i]?' hit':'')+'"></div>';
    return '<div class="enc-row"><div class="enc-name">'+escH(e.name||'Unknown')+'</div><div class="stress-dots">'+dots+'</div></div>';
  }).join('');
  setHTML('h-enc-content',playerRow+(allOpps.length?'<div class="sec-div" style="margin:4px 0"></div>'+oppRows:''));
}

function show(id,v){var el=document.getElementById(id);if(el)el.style.display=v?'':'none';if(id==='p-spotlight')document.body.classList.toggle('spot-on',!!v);}
function setText(id,v){var el=document.getElementById(id);if(el)el.textContent=v||'';}
function setHTML(id,v){var el=document.getElementById(id);if(el)el.innerHTML=v||'';}

// === Background selector ===
function selectBg(el){
  document.querySelectorAll('.bg-opt').forEach(function(x){x.classList.remove('selected');});
  el.classList.add('selected');
  _bgType=el.dataset.type||'none';
  _bgSrc=el.dataset.src?BG_BASE+el.dataset.src:'';
  var sc=document.getElementById('seg-controls');
  if(sc)sc.style.display=_bgType!=='none'?'':'none';
  applyPreviewEffect();
}

// === Camera helpers ===
async function startCamera(hd){
  if(!hd){var op=getOpenerStream();if(op)return op;}
  var cid=document.getElementById('cam-sel')?document.getElementById('cam-sel').value:'';
  var mid=document.getElementById('mic-sel')?document.getElementById('mic-sel').value:'';
  var vidCon=hd?{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
  if(cid)vidCon.deviceId={ideal:cid};
  var audCon=mid?{deviceId:{ideal:mid}}:true;
  // Progressive fallback: preferred audio → any audio → video-only → any video-only
  var tries=[{video:vidCon,audio:audCon},{video:vidCon,audio:true},{video:vidCon,audio:false},{video:true,audio:false}];
  for(var i=0;i<tries.length;i++){try{return await navigator.mediaDevices.getUserMedia(tries[i]);}catch(e){if(i===tries.length-1)throw e;}}
}

// Setup-screen preview only — simple CSS hint so the user can see their choice
function applyBgCss(vidEl,wrapEl){
  if(!vidEl||!wrapEl)return;
  vidEl.style.filter='';
  wrapEl.style.backgroundImage='';wrapEl.style.backgroundSize='';wrapEl.style.backgroundPosition='';
  if(_bgType==='blur'){
    vidEl.style.filter='blur(10px)';
  }else if(_bgType==='image'&&_bgSrc){
    wrapEl.style.backgroundImage='url('+_bgSrc+')';
    wrapEl.style.backgroundSize='cover';wrapEl.style.backgroundPosition='center';
  }
}

async function applyCameraStream(stream){
  if(_bgEffect){_bgEffect.stopEffect();_bgEffect=null;}
  _bgDisplayStream=stream;
  var vid=document.getElementById('webcam-video');
  var noSig=document.getElementById('no-signal');
  if(vid)vid.srcObject=stream;
  if(_bgType!=='none'){
    if(noSig)noSig.textContent='Loading segmentation\u2026';
    try{
      _bgEffect=new VirtualBgEffect(_bgType,_bgSrc||null,20);
      var out=await _bgEffect.startEffect(stream);
      stream.getAudioTracks().forEach(function(t){out.addTrack(t);});
      _bgDisplayStream=out;
      if(vid)vid.srcObject=out;
      if(noSig)noSig.textContent='';
    }catch(e){
      if(noSig){noSig.textContent='Segmentation failed — showing raw feed';setTimeout(function(){noSig.textContent='';},4000);}
    }
  }
}

// === Recording ===
function toggleRec(){if(!_rec)startRec();else stopRec();}

function startRec(){
  var prevStream=_stream;
  var upgradePromise=_stream
    ?startCamera(true).then(function(s){_hdStream=s;return applyCameraStream(s);}).catch(function(){})
    :Promise.resolve();
  upgradePromise.then(function(){
    return navigator.mediaDevices.getDisplayMedia({video:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});
  }).then(function(screenStream){
    _chunks=[];_secs=0;
    var tracks=screenStream.getVideoTracks().slice();
    var audioSrc=_bgDisplayStream||_hdStream||_stream;
    if(audioSrc){var at=audioSrc.getAudioTracks();if(at.length)tracks.push(at[0]);}
    var recStream=new MediaStream(tracks);
    tracks[0].onended=stopRec;
    var mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1,opus','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=h264','video/webm']
      .find(function(m){try{return MediaRecorder.isTypeSupported(m);}catch(e){return false;}})||'';
    try{_rec=new MediaRecorder(recStream,Object.assign(mime?{mimeType:mime}:{},{videoBitsPerSecond:8000000,audioBitsPerSecond:256000}));}
    catch(e){_rec=new MediaRecorder(recStream,mime?{mimeType:mime}:{});}
    _rec.ondataavailable=function(e){if(e.data&&e.data.size>0)_chunks.push(e.data);};
    _rec.onstop=function(){screenStream.getTracks().forEach(function(t){t.stop();});saveRec();};
    _rec.start(100);
    var btn=document.getElementById('rec-btn');if(btn){btn.textContent='\u23F9 STOP';btn.classList.add('rec-on');}
    document.body.classList.add('recording');
    _timer=setInterval(function(){_secs++;var mm=String(Math.floor(_secs/60)).padStart(2,'0'),ss=String(_secs%60).padStart(2,'0');var t=document.getElementById('rec-timer');if(t)t.textContent=mm+':'+ss;},1000);
  }).catch(function(){
    if(_hdStream){_hdStream.getTracks().forEach(function(t){t.stop();});_hdStream=null;}
    if(prevStream)applyCameraStream(prevStream);
  });
}

function stopRec(){
  if(_rec&&_rec.state!=='inactive')_rec.stop();
  clearInterval(_timer);_rec=null;
  document.body.classList.remove('recording');
  var btn=document.getElementById('rec-btn');if(btn){btn.textContent='\u25CF REC SCREEN';btn.classList.remove('rec-on');}
  var t=document.getElementById('rec-timer');if(t)t.textContent='';
  if(_hdStream){
    if(_bgEffect){_bgEffect.stopEffect();_bgEffect=null;}
    if(_hdStream!==getOpenerStream())_hdStream.getTracks().forEach(function(t){t.stop();});
    _hdStream=null;
    if(_stream)applyCameraStream(_stream);
  }
}

function saveRec(){
  var mime=(_chunks[0]&&_chunks[0].type)||'video/webm';
  var ext=mime.indexOf('mp4')>-1?'mp4':'webm';
  var blob=new Blob(_chunks,{type:mime});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='captainslog-'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.'+ext;
  a.click();setTimeout(function(){URL.revokeObjectURL(url);},4000);
}

// === Device enumeration, setup preview & HUD start ===
// Camera stream is pre-acquired by the main app window and shared here
// via window.opener._hudCamStream to avoid popup permission issues.

function getOpenerStream(){return window.opener&&window.opener._hudCamStream||null;}

async function startSetupPreview(){
  var noSig=document.getElementById('setup-no-cam');
  var vid=document.getElementById('setup-preview');
  var opStream=getOpenerStream();
  if(opStream){
    _previewStream=opStream;
  }else{
    var cid=document.getElementById('cam-sel')?document.getElementById('cam-sel').value:'';
    var resH=_camResH||720,resW=resH===480?640:resH===1080?1920:1280;
    var vidCon=cid?{deviceId:{ideal:cid},width:{ideal:resW},height:{ideal:resH}}:{width:{ideal:resW},height:{ideal:resH}};
    try{
      _previewStream=await navigator.mediaDevices.getUserMedia({video:vidCon,audio:false});
    }catch(e){
      // Resolution not supported — fall back to 720p
      if(resH!==720){
        _camResH=720;
        var resSel=document.getElementById('res-sel');if(resSel)resSel.value='720';
        if(noSig){noSig.style.display='';noSig.textContent=resH+'p not supported\u2014trying 720p\u2026';}
        try{
          var fbCon=cid?{deviceId:{ideal:cid},width:{ideal:1280},height:{ideal:720}}:{width:{ideal:1280},height:{ideal:720}};
          _previewStream=await navigator.mediaDevices.getUserMedia({video:fbCon,audio:false});
        }catch(e2){if(noSig)noSig.style.display='';return;}
      }else{
        // Last resort — no constraints, let browser pick any camera
        try{_previewStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}catch(e2){}
        if(!_previewStream){if(noSig)noSig.style.display='';return;}
      }
    }
  }
  if(vid&&_previewStream){vid.srcObject=_previewStream;if(noSig)noSig.style.display='none';}
  await applyPreviewEffect();
}

async function applyPreviewEffect(){
  if(_previewEffect){_previewEffect.stopEffect();_previewEffect=null;}
  var vid=document.getElementById('setup-preview');
  var noSig=document.getElementById('setup-no-cam');
  if(!_previewStream||!vid)return;
  vid.srcObject=_previewStream; // show raw while loading
  if(_bgType==='none')return;
  if(noSig){noSig.style.display='';noSig.textContent='Loading\u2026';}
  try{
    _previewEffect=new VirtualBgEffect(_bgType,_bgSrc||null,20);
    var out=await _previewEffect.startEffect(_previewStream);
    if(vid)vid.srcObject=out;
    if(noSig)noSig.style.display='none';
  }catch(e){
    if(noSig){noSig.style.display='';noSig.textContent='Effect unavailable';}
  }
}

function onThreshChange(v){
  _segThreshold=+v;
  var el=document.getElementById('thresh-val');if(el)el.textContent=v;
}
function onFeatherChange(v){
  _segFeather=+v;
  var el=document.getElementById('feather-val');if(el)el.textContent=v+'px';
}
function onModelChange(){
  var sel=document.getElementById('model-sel');
  _segModelSel=sel?+sel.value:1;
  VirtualBgEffect.resetSegmenter();
  applyPreviewEffect();
}
function onResChange(){
  var sel=document.getElementById('res-sel');
  _camResH=sel?+sel.value:720;
  if(_previewEffect){_previewEffect.stopEffect();_previewEffect=null;}
  // Never stop the opener's stream — it belongs to the main app
  if(_previewStream&&_previewStream!==getOpenerStream()){
    _previewStream.getTracks().forEach(function(t){t.stop()});
  }
  _previewStream=null;
  // Ask the main app to re-acquire the camera at the new resolution
  if(window.opener&&window.opener.reacquireCamStream){
    var noSig=document.getElementById('setup-no-cam');
    if(noSig){noSig.style.display='';noSig.textContent='Switching resolution\u2026';}
    window.opener.reacquireCamStream(_camResH).then(function(){
      startSetupPreview();
    });
  }else{
    startSetupPreview();
  }
}

async function enumDevs(){
  // Prefer enumerating from the opener window (already has permissions + labels)
  var devs=null;
  try{
    if(window.opener&&window.opener.navigator&&window.opener.navigator.mediaDevices){
      devs=await window.opener.navigator.mediaDevices.enumerateDevices();
    }
  }catch(e){}
  if(!devs){
    try{
      await navigator.mediaDevices.getUserMedia({video:true,audio:true})
        .then(function(s){s.getTracks().forEach(function(t){t.stop();});}).catch(function(){});
      devs=await navigator.mediaDevices.enumerateDevices();
    }catch(e){devs=[];}
  }
  var cs=document.getElementById('cam-sel'),ms=document.getElementById('mic-sel');
  (devs||[]).forEach(function(d){
    var o=document.createElement('option');o.value=d.deviceId;
    if(d.kind==='videoinput'){o.textContent=d.label||'Camera '+cs.options.length;cs.appendChild(o);}
    else if(d.kind==='audioinput'){o.textContent=d.label||'Mic '+ms.options.length;ms.appendChild(o);}
  });
  startSetupPreview();
}

async function startHUD(cam){
  document.getElementById('setup').style.display='none';
  if(cam){
    try{
      var opStream=getOpenerStream();
      _stream=opStream||await startCamera(false);
      if(_previewEffect){
        // Promote the already-running preview effect to the main HUD — no restart needed
        _bgEffect=_previewEffect;_previewEffect=null;
        _bgDisplayStream=_bgEffect._outStream||_stream;
        var vid=document.getElementById('webcam-video');
        if(vid)vid.srcObject=_bgDisplayStream;
      }else{
        await applyCameraStream(_stream);
      }
    }catch(e){document.getElementById('no-signal').textContent='Camera unavailable';}
  }
  document.getElementById('rec-btn').style.display='';
  // Request fresh state so panels populate immediately without waiting for next user action
  if(window.opener&&window.opener.hudBroadcast) window.opener.hudBroadcast();
}
enumDevs();

// === VirtualBgEffect (MediaPipe SelfieSegmentation) ===
var MEDIAPIPE_CDN='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/';
function loadScript(src){
  return new Promise(function(resolve,reject){
    var s=document.createElement('script');s.src=src;
    s.onload=resolve;s.onerror=function(){reject(new Error('Failed to load: '+src));};
    document.head.appendChild(s);
  });
}
var VirtualBgEffect=(function(){
  var _segPromise=null;
  function VirtualBgEffect(type,imageSrc,blurRadius){
    this.type=type;this.imageSrc=imageSrc;this.blurRadius=blurRadius||20;
    this._running=false;this._seg=null;this._video=null;this._canvas=null;
    this._ctx=null;this._bgImg=null;this._outStream=null;this._rafId=null;
    this._tmpCanvas=null;this._tmpCtx=null;
  }
  VirtualBgEffect._getSegmenter=function(){if(!_segPromise)_segPromise=VirtualBgEffect._load();return _segPromise;};
  VirtualBgEffect.resetSegmenter=function(){_segPromise=null;};
  VirtualBgEffect._load=function(){
    return loadScript(MEDIAPIPE_CDN+'selfie_segmentation.js').then(function(){
      if(!window.SelfieSegmentation)throw new Error('SelfieSegmentation not available');
      var modelSel=(window._segModelSel!==undefined?+window._segModelSel:1);
      var seg=new window.SelfieSegmentation({locateFile:function(f){return MEDIAPIPE_CDN+f;}});
      seg.setOptions({modelSelection:modelSel});
      seg.onResults(function(){});
      return seg.initialize().then(function(){return seg;});
    });
  };
  VirtualBgEffect.prototype.startEffect=function(stream){
    var self=this;
    return VirtualBgEffect._getSegmenter().then(function(seg){
      self._seg=seg;
      var imgLoad=Promise.resolve();
      if(self.type==='image'&&self.imageSrc){
        imgLoad=new Promise(function(resolve,reject){
          var img=new Image();
          img.crossOrigin='anonymous';
          img.onload=function(){self._bgImg=img;resolve();};
          img.onerror=reject;img.src=self.imageSrc;
        });
      }
      return imgLoad.then(function(){
        var video=document.createElement('video');
        video.srcObject=stream;video.muted=true;video.autoplay=true;video.playsInline=true;
        return new Promise(function(resolve){video.onloadedmetadata=resolve;setTimeout(resolve,2000);})
        .then(function(){return video.play().catch(function(){});})
        .then(function(){
          var W=video.videoWidth||1280,H=video.videoHeight||720;
          var canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
          self._video=video;self._canvas=canvas;self._ctx=canvas.getContext('2d');
          self._running=true;
          seg.onResults(function(r){self._onResults(r);});
          self._scheduleFrame();
          self._outStream=canvas.captureStream(30);
          return self._outStream;
        });
      });
    });
  };
  VirtualBgEffect.prototype._onResults=function(results){
    if(!this._running||!this._ctx)return;
    var ctx=this._ctx,W=this._canvas.width,H=this._canvas.height;
    ctx.clearRect(0,0,W,H);
    // Draw background layer
    if(this.type==='blur'){
      ctx.filter='blur('+this.blurRadius+'px)';
      ctx.drawImage(results.image,-this.blurRadius*2,-this.blurRadius*2,W+this.blurRadius*4,H+this.blurRadius*4);
      ctx.filter='none';
    }else if(this.type==='image'&&this._bgImg){
      var s=Math.max(W/this._bgImg.naturalWidth,H/this._bgImg.naturalHeight);
      var sw=this._bgImg.naturalWidth*s,sh=this._bgImg.naturalHeight*s;
      ctx.drawImage(this._bgImg,(W-sw)/2,(H-sh)/2,sw,sh);
    }else{
      ctx.drawImage(results.image,0,0,W,H);
    }
    // Build masked foreground:
    // The mask has opaque white (person) and opaque black (background) — both alpha=1.
    // source-in only tests alpha so it can't distinguish them. Instead, copy mask
    // brightness into the video frame's alpha channel via pixel manipulation.
    if(!this._tmpCanvas){
      this._tmpCanvas=document.createElement('canvas');
      this._tmpCanvas.width=W;this._tmpCanvas.height=H;
      this._tmpCtx=this._tmpCanvas.getContext('2d',{willReadFrequently:true});
    }
    // Blur the mask before reading to create soft feathered edges
    var featherPx=+(window._segFeather!==undefined?window._segFeather:4);
    if(featherPx>0)this._tmpCtx.filter='blur('+featherPx+'px)';
    this._tmpCtx.drawImage(results.segmentationMask,0,0,W,H);
    if(featherPx>0)this._tmpCtx.filter='none';
    var maskPx=this._tmpCtx.getImageData(0,0,W,H).data;
    this._tmpCtx.drawImage(results.image,0,0,W,H);
    var imgD=this._tmpCtx.getImageData(0,0,W,H);
    var d=imgD.data;
    // Apply threshold curve: ramp from (thr-half)→0 to (thr+half)→255
    var thr=+(window._segThreshold!==undefined?window._segThreshold:140);
    var half=Math.max(1,featherPx*8);
    var lo=thr-half,range=(half*2)||1;
    for(var i=0;i<d.length;i+=4){
      var v=maskPx[i];
      d[i+3]=v<=lo?0:v>=(lo+range)?255:Math.round((v-lo)/range*255);
    }
    this._tmpCtx.putImageData(imgD,0,0);
    ctx.drawImage(this._tmpCanvas,0,0);
  };
  VirtualBgEffect.prototype._scheduleFrame=function(){
    var self=this;if(!self._running||!self._seg||!self._video)return;
    // setTimeout instead of requestAnimationFrame: rAF throttles to ~1fps when the
    // HUD window loses focus (user is clicking in the main app). setTimeout continues
    // at the requested rate regardless of window focus.
    self._rafId=setTimeout(function(){
      if(!self._running)return;
      self._seg.send({image:self._video}).catch(function(){}).finally(function(){self._scheduleFrame();});
    },33);
  };
  VirtualBgEffect.prototype.stopEffect=function(){
    this._running=false;
    if(this._rafId)clearTimeout(this._rafId);
    if(this._video){this._video.srcObject=null;this._video=null;}
    if(this._outStream){this._outStream.getTracks().forEach(function(t){t.stop();});this._outStream=null;}
  };
  return VirtualBgEffect;
})();

<\/script></body></html>`;
