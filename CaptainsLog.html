    .blank-ep{margin-bottom:0}
    /* Reclaim vertical budget so one episode fits one sheet at FULL 48px
       ruling — trim inter-block gaps, never the writing space. Measured at
       US Letter / default margins: episode was ~35px over, page 1 carries
       ~22px more (strip + first-fragment padding). */
    .blank-ep .ep-banner{padding:6px 12px;margin:0 0 6px}
    .be-field{margin:6px 0 0}
    .be-scene{margin-top:2px}
    .be-act{margin-top:9px}
    .be-trk{margin-top:8px;padding-top:5px}
    .be-ruled{height:46px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 22px,var(--rule) 22px,var(--rule) 23px)}
    body.blank-mode .col-hdr-log{display:none}
    body.blank-mode #doc-right{padding-top:0}
    .pb-card{border:none !important;height:0;padding:0 !important;overflow:hidden;page-break-after:always;break-after:page}
    .pb-card .pb-line{display:none}
    .dc-handle{display:none}
    .dc-wrap .dropped-card{border-radius:6px}
    .rm-btn{display:none}
    .notes-ta{border:none;resize:none;padding:0;min-height:unset}
    .notes-label-input{border:none !important;padding-bottom:0 !important}
    /* Zine: print only the imposed sheets. The @page size/margin rule is
       injected by JS only while zine mode is on, so the regular export
       keeps printing exactly as before. */
    body.zine-mode #main{display:none !important}
    body.zine-mode #zine-print{position:static;left:auto;visibility:visible}
    body.zine-mode,body.zine-mode html{background:var(--bg) !important}
    .z-sheet{break-after:page;page-break-after:always}
    .z-sheet.z-last{break-after:auto;page-break-after:auto}
    .z-sheet.z-skip{display:none}
    .z-sheet .be-act,.z-sheet .be-trk{break-inside:auto}
  }
</style>
</head>
<body>

<div id="topbar">
  <div id="tb-title">AFTER ACTION REPORT // ${charName}</div>
  <div id="ep-selector" class="zine-hide">${epChecks}</div>
  <span id="blank-ctl" class="zine-hide" style="display:none;font-size:11px;letter-spacing:1px;align-items:center;gap:6px;flex:1">BLANK EPISODES
    <select id="blank-count" onchange="renderLogOutput()" style="background:var(--bg);border:1px solid var(--accent-dim);color:var(--text);font-family:inherit;font-size:11px;padding:3px 6px;border-radius:4px">
      ${[1,3,5,10,15,20,25].map(n=>`<option${n===10?' selected':''}>${n}</option>`).join('')}
    </select>
  </span>
  <span id="zine-ctl" class="zine-only">
    <label>PAGES <select id="zine-n" onchange="zineSetCount(this.value)"><option>12</option><option>16</option><option selected>20</option></select></label>
    <label>PAPER <select id="zine-paper" onchange="zineSet('paper',this.value)"><option value="letter">US Letter</option><option value="a4">A4</option></select></label>
    <label>VIEW <select id="zine-view" onchange="zineSet('view',this.value)"><option value="spread">Reading order</option><option value="sheet">Print sheets</option></select></label>
    <label>PRINT <select id="zine-side" onchange="zineSet('side',this.value)"><option value="both">Both sides</option><option value="front">Fronts only</option><option value="back">Backs only</option></select></label>
    <button class="tb-btn" onclick="zineReset()">↺ RESET LAYOUT</button>
    <button class="tb-btn" onclick="zineToggleHelp()">? HOW TO PRINT</button>
  </span>
  <button class="tb-btn zine-hide" id="mode-btn" onclick="toggleDocMode()">✎ BLANK LOGBOOK</button>
  <button class="tb-btn" id="zine-btn" onclick="toggleZine()">📖 ZINE</button>
  <button class="tb-btn" id="theme-btn" onclick="toggleTheme()">◑ PRINT MODE</button>
  <button class="tb-btn" onclick="window.print()">🖨 PRINT</button>
</div>

<div class="lcars-strip"></div>

<div id="main">
  <div id="src-panel">
    <div id="src-tabs">
      <button class="stab active" id="stab-stats" onclick="showSTab('stats')">STATS</button>
      <button class="stab" id="stab-crew" onclick="showSTab('crew')">NPCs</button>
      <button class="stab" id="stab-maps" onclick="showSTab('maps')">MAPS</button>
      <button class="stab zine-only" id="stab-zpages" onclick="showSTab('zpages')" style="justify-content:center">PAGES</button>
    </div>
    <div id="tab-zpages" style="display:none">
      <div style="font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:10px">Drag any card onto a zine page. Full-page cards replace what's there; smaller cards stack on the page.</div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-front',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)">FRONT COVER</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-back',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)">BACK COVER</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-char',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-lavender)">CHARACTER SHEET</div><div style="font-size:10px;color:var(--muted)">Filled in — ${charName}</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-char-blank',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-lavender)">CHARACTER SHEET — BLANK</div><div style="font-size:10px;color:var(--muted)">Write-in</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-ship',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-ltblue)">SHIP SHEET</div><div style="font-size:10px;color:var(--muted)">Filled in — ${shipName}</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-ship-blank',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-ltblue)">SHIP SHEET — BLANK</div><div style="font-size:10px;color:var(--muted)">Write-in</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-ep-a',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)">BLANK EPISODE — LEFT PAGE</div><div style="font-size:10px;color:var(--muted)">Title, stardate, directive, Acts I–II</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-ep-b',0)"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent)">BLANK EPISODE — RIGHT PAGE</div><div style="font-size:10px;color:var(--muted)">Act III, trackers, mission notes</div></div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'z-lines',0)" style="margin-bottom:14px"><div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-gold)">LINED NOTES</div><div style="font-size:10px;color:var(--muted)">Ruled lines that fill the rest of the page</div></div>
      <div style="font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Your logged episodes</div>
      ${episodes.length ? episodes.map((ep,i) => `<div class="src-card" draggable="true" ondragstart="srcDragStart(event,'log-ep',${i})"><div style="font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text)">${esc(ep.label)}</div><div style="font-size:10px;color:var(--muted)">${ep.entries.length} entr${ep.entries.length===1?'y':'ies'} — flows onto following pages if long</div></div>`).join('') : '<div style="font-size:11px;color:var(--muted);padding:6px 0">No log entries yet.</div>'}
    </div>
    <div id="tab-crew" style="display:none">
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'blank-npc',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-lavender);margin-bottom:4px">EMPTY NPC DOSSIER</div>
        <div style="font-size:10px;color:var(--muted)">Write-in contact sheet — name, faction, goal, notes</div>
      </div>
    ${npcCardsHTML}</div>
    <div id="tab-maps" style="display:none">
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'blank-chart',0)">
        <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:4px">BLANK SECTOR CHART</div>
        <div style="font-size:10px;color:var(--muted)">Empty 5×5 grid — map new space by hand</div>
      </div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'blank-zone',0)" style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lcars-ltblue);margin-bottom:4px">BLANK ZONE MAP</div>
        <div style="font-size:10px;color:var(--muted)">Empty 5×5 grid for a planet, station, or ship zone</div>
      </div>
    ${galaxyMapHTML}${secGridHTML}${intGridHTML}${subZoneHTML}</div>
    <div id="tab-stats">
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'cover',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:4px">COVER PAGE</div>
        <div style="font-size:10px;color:var(--muted)">Ship image · "The Mission Log of…" · stardate lines</div>
      </div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'char-stats',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-lavender);margin-bottom:4px">OFFICER PROFILE</div>
        <div style="font-size:10px;color:var(--muted)">${charName}</div>
      </div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'ship-stats',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-ltblue);margin-bottom:4px">SHIP PROFILE</div>
        <div style="font-size:10px;color:var(--muted)">${shipName}</div>
      </div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'ship-pic',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-ltblue);margin-bottom:4px">SHIP PICTURE</div>
        <div style="font-size:10px;color:var(--muted)">${shipName} — image &amp; blurb</div>
      </div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'notes',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--lcars-gold);margin-bottom:4px">NOTES BLOCK</div>
        <div style="font-size:10px;color:var(--muted)">Freeform editable text</div>
      </div>
      <div class="src-card" draggable="true" ondragstart="srcDragStart(event,'page-break',0)">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:4px">PAGE BREAK</div>
        <div style="font-size:10px;color:var(--muted)">Following annexes start a new printed page</div>
      </div>
    </div>
  </div>
  <div class="lcars-divider"></div>
  <div id="doc-area">
    <div id="doc-left"
         ondragover="dzOver(event)"
         ondragleave="dzLeave(event)"
         ondrop="dzDrop(event)">
      <div class="col-hdr col-hdr-annex">ANNEXES</div>
      <div id="drop-zone">DRAG ITEMS HERE</div>
      <div id="dropped-items"></div>
    </div>
    <div id="doc-right">
      <div class="col-hdr col-hdr-log">MISSION LOG</div>
      <div id="log-output"></div>
    </div>
  </div>
  <div id="zine-area">
    <div id="zine-help" style="display:none"></div>
    <div id="zine-preview" class="zs-row"></div>
  </div>
</div>
<div id="zine-print"></div>

<script>
var EPISODES = ${J(episodes)};
var DROPPED = [];
var SRC_NPCS = ${J(S.npcs || [])};
var SRC_CHAR = ${J({name:S.char.name,rank:S.char.rank,species:S.char.species,attributes:{control:S.char.control,fitness:S.char.fitness,presence:S.char.presence,daring:S.char.daring,insight:S.char.insight,reason:S.char.reason},disciplines:{command:S.char.command,conn:S.char.conn,security:S.char.security,engineering:S.char.engineering,science:S.char.science,medicine:S.char.medicine},focuses:S.char.focuses||[],traits:(S.char.traits||[]).join?.(', ')||'',talents:S.char.talents||[],values:(S.char.values||[]).filter(Boolean),directive:S.char.directive||'',homeworld:S.char.homeworld||'',upbringing:S.char.upbringing||'',careerLength:S.char.careerLength||'',careerEvent:S.char.careerEvent||'',careerEvent2:S.char.careerEvent2||'',determination:S.char.determination||0,era:S.char.era||'',role:S.char.role||''})};
var SRC_SHIP = ${J({name:S.ship.name,className:S.ship.className,scale:S.ship.scale,registry:S.ship.registry||'',thumb:thumbAbs,trait:S.ship.trait||'',systems:{comms:S.ship.comms,computers:S.ship.computers,engines:S.ship.engines,sensors:S.ship.sensors,structure:S.ship.structure,weapons:S.ship.weapons},departments:{command:S.ship.command,conn:S.ship.conn,security:S.ship.security,engineering:S.ship.engineering,science:S.ship.science,medicine:S.ship.medicine},traits:(S.ship.traits||[]).join?.(', ')||S.ship.traits||'',talents:S.ship.talents||[]})};
var SRC_SHIP_THUMB = ${J(thumbAbs)};
var ALL_SECTORS = ${J(allSectors)};
var ALL_SUBZONES = ${J(allSubZones)};
var INT_CELLS = ${J(intCells)};
var SHIP_NAME = ${J(S.ship.name||'Ship Interior')};
var DOC_MODE = ${J(startMode==='blank'?'blank':'log')};
var GALAXY_MAPS = ${J(galaxyMaps)};
var ZINE_ART = ${J(zineArt)};
var ZINE_SLOT = ${J(ACTIVE_SLOT)};

var _srcDragItem = null;
var _reorderIdx = null;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var ATT_COLOR={Hostile:'#FF2200',Cautious:'#FFCC00',Neutral:'#7a7a7a',Allied:'#FF9933',Crew:'#66CC66'};

function showSTab(t) {
  ['crew','maps','stats','zpages'].forEach(function(n) {
    document.getElementById('tab-'+n).style.display = n===t ? '' : 'none';
    document.getElementById('stab-'+n).className = 'stab' + (n===t ? ' active' : '');
  });
}

function toggleTheme() {
  var b = document.body;
  b.classList.toggle('print-mode');
  var pm = b.classList.contains('print-mode');
  document.documentElement.style.background = pm ? '#fff' : '#000';
  document.getElementById('theme-btn').textContent = pm ? '◐ DARK MODE' : '◑ PRINT MODE';
}

// ── Blank logbook mode ──────────────────────────────────────────────────────
// The log column swaps between the typed mission log and blank handwriting
// pages (three acts of five delta-marked scenes each, per the rules' mission
// format). Annexes work identically in both modes.
function toggleDocMode() {
  DOC_MODE = DOC_MODE === 'log' ? 'blank' : 'log';
  syncModeUI();
  renderLogOutput();
}
function syncModeUI() {
  var blank = DOC_MODE === 'blank';
  document.body.classList.toggle('blank-mode', blank);
  document.getElementById('mode-btn').textContent = blank ? '📓 MISSION LOG' : '✎ BLANK LOGBOOK';
  document.getElementById('blank-ctl').style.display = blank ? 'inline-flex' : 'none';
  document.getElementById('ep-selector').style.display = blank ? 'none' : 'flex';
  var hdr = document.querySelector('.col-hdr-log');
  if (hdr) hdr.textContent = blank ? 'BLANK LOGBOOK' : 'MISSION LOG';
}
var BE_ACTS = [
  ['ACT I — THE HOOK', 'You are set on a mission — arrival, briefing, and the first challenges.'],
  ['ACT II — ESCALATION', 'The challenges escalate; complications mount toward a crisis.'],
  ['ACT III — CLIMAX & RESOLUTION', 'The climax must be faced and resolved — log the outcome.']
];
function beTicks(n) { var h=''; for (var i=0;i<n;i++) h+='<span class="be-tick"></span>'; return h; }
function blankEpisodeHTML(num) {
  var h = '<div class="blank-ep">'
    + '<div class="ep-banner"><div style="flex:1"><div class="ep-banner-label">Episode '+num+' — Title</div><div class="be-hline"></div></div>'
    + '<div style="width:110px"><div class="ep-banner-label">Stardate</div><div class="be-hline" style="min-width:0"></div></div></div>'
    + '<div class="be-field"><span class="be-lbl">Directive</span><div class="be-line"></div></div>';
  for (var a=0;a<3;a++) {
    h += '<div class="be-act"><div class="be-act-hd"><b>'+BE_ACTS[a][0]+'</b><span>'+BE_ACTS[a][1]+'</span></div>';
    for (var s=1;s<=5;s++) {
      h += '<div class="be-scene"><div class="be-delta">&#9653;<span>'+(a*5+s)+'</span></div><div class="be-ruled"></div></div>';
    }
    h += '</div>';
  }
  h += '<div class="be-trk">'
    + '<div><label>Momentum</label>'+beTicks(6)+'</div>'
    + '<div><label>Threat</label>'+beTicks(8)+'</div>'
    + '<div><label>Determination</label>'+beTicks(3)+'</div>'
    + '<div class="be-note">Cross off a delta &#9653; as each scene resolves — 15 scenes completes the mission.</div>'
    + '</div></div>';
  return h;
}
function renderBlankLogbook() {
  var count = parseInt(document.getElementById('blank-count').value) || 10;
  var h = '';
  for (var i=1;i<=count;i++) h += blankEpisodeHTML(i);
  return h;
}

function epAllChanged(cb) {
  document.querySelectorAll('.ep-chk').forEach(function(c){ c.checked = cb.checked; });
  renderLogOutput();
}
function epChkChanged() {
  document.getElementById('ep-all').checked = !Array.from(document.querySelectorAll('.ep-chk')).some(function(c){ return !c.checked; });
  renderLogOutput();
}

function statRow(lbl, val) {
  return '<div class="stat-row"><span class="stat-lbl">'+esc(lbl)+'</span><span class="stat-val">'+esc(String(val||0))+'</span></div>';
}

// rmOverride: the zine renders these same cards with its own remove control.
function renderDroppedCard(item, idx, rmOverride) {
  var rm = rmOverride != null ? rmOverride : '<button class="rm-btn" onclick="removeDropped('+idx+')">✕</button>';
  if (item.kind === 'galaxy-map') {
    var gm = item.data || {};
    return '<div class="dropped-card">'+rm+'<div class="dropped-map-title">'+esc(gm.name||'Galaxy Map')+'</div>'
      +'<img src="'+esc(gm.src||'')+'" style="width:100%;display:block;background:#fff;border-radius:3px" alt=""></div>';
  }
  if (item.kind === 'npc') {
    var n = item.data;
    return '<div class="dropped-card">'+rm
      +'<div class="dropped-npc-name">'+esc(n.name)+'</div>'
      +'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+esc(n.faction)+' · '+esc(n.role)+'</div>'
      +(n.attitude?'<span style="font-size:9px;padding:2px 6px;border-radius:50vh;background:'+(ATT_COLOR[n.attitude]||'#555')+';color:#000;font-weight:700;display:inline-block;margin-top:4px">'+esc(n.attitude)+'</span>':'')
      +(n.trait?'<div style="font-size:10px;font-style:italic;margin-top:4px;color:var(--sub)">'+esc(n.trait)+'</div>':'')
      +(n.goal?'<div style="font-size:10px;margin-top:4px"><span style="color:var(--muted)">GOAL:</span> '+esc(n.goal)+'</div>':'')
      +(n.notes?'<div style="font-size:10px;margin-top:4px;color:var(--sub)">'+esc(n.notes)+'</div>':'')
      +'</div>';
  }
  if (item.kind === 'map-sector') {
    var sd = item.data || ALL_SECTORS[0] || {name:'Sector',cells:[]};
    var scells = sd.cells || [];
    var grid = '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-top:8px;overflow:hidden">'
      + scells.map(function(c){ return '<div style="aspect-ratio:1;background:'+(c.isVoid?'transparent':c.name?'var(--card-bg)':'var(--empty-cell)')+';border:1px solid '+(c.isVoid?'transparent':'var(--cell-border)')+';display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;border-radius:2px;min-width:0;min-height:0">'
        +'<span style="font-size:22px;line-height:1">'+esc(c.icon||'')+'</span>'
        +(c.name?'<span style="font-size:10px;text-align:center;line-height:1.2;color:var(--cell-text)">'+esc(c.name)+'</span>':'')
        +'</div>';}).join('')+'</div>';
    return '<div class="dropped-card">'+rm+'<div class="dropped-map-title">'+esc(sd.name)+'</div>'+grid+'</div>';
  }
  if (item.kind === 'map-subzone') {
    var szd = item.data || {};
    var szcells = (szd.subZone && szd.subZone.cells) ? szd.subZone.cells.slice(0,25) : [];
    while (szcells.length < 25) szcells.push({});
    var szgrid = '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-top:8px;overflow:hidden">'
      + szcells.map(function(c){ return '<div style="aspect-ratio:1;background:'+(c.isVoid?'transparent':c.name?'var(--card-bg)':'var(--empty-cell)')+';border:1px solid '+(c.isVoid?'transparent':'var(--cell-border)')+';display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;border-radius:2px;min-width:0">'
        +'<span style="font-size:22px;line-height:1">'+esc(c.icon||'')+'</span>'
        +(c.name?'<span style="font-size:10px;text-align:center;line-height:1.2;color:var(--cell-text)">'+esc(c.name)+'</span>':'')
        +'</div>';}).join('')+'</div>';
    var sztitle = esc((szd.subZone && szd.subZone.name) || szd.cellName || 'Sub-Zone');
    var szsubtitle = szd.sectorName ? '<div style="font-size:9px;color:var(--muted);margin-bottom:4px;letter-spacing:1px">'+esc(szd.sectorName)+'</div>' : '';
    return '<div class="dropped-card">'+rm+'<div class="dropped-map-title">'+sztitle+'</div>'+szsubtitle+szgrid+'</div>';
  }
  if (item.kind === 'map-interior') {
    var icells = INT_CELLS.map(function(c) {
      var bg = c.isVoid ? 'transparent' : (c.name ? 'var(--card-bg)' : 'var(--empty-cell)');
      var bd = c.isVoid ? 'transparent' : 'var(--cell-border)';
      return '<div style="background:'+bg+';border:1px solid '+bd+';overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center">'
        +'<span style="font-size:16px;line-height:1">'+esc(c.icon||'')+'</span>'

function renderDroppedItems() {
  document.getElementById('dropped-items').innerHTML = DROPPED.map(function(item, i) {
    return '<div class="dc-wrap" draggable="true" ondragstart="cdStart(event,'+i+')" ondragover="cdOver(event,'+i+')" ondrop="cdDrop(event,'+i+')" ondragend="cdEnd()">'
      +'<div class="dc-handle">⠿ &nbsp;DRAG TO REORDER</div>'
      +renderDroppedCard(item, i)
      +'</div>';
  }).join('');
}

function cdStart(e, idx) {
  _reorderIdx = idx;
  _srcDragItem = null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'reorder');
  e.stopPropagation();
}
function cdOver(e, idx) {
  if (_reorderIdx === null && _srcDragItem) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; return; }
  if (_reorderIdx === null || _reorderIdx === idx) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over-top');
}
function cdDrop(e, idx) {
  e.preventDefault(); e.stopPropagation();
  // A drop from the source panel lands here whenever it hits an existing
  // card rather than bare drop-zone; handle it as an insert at this
  // position instead of swallowing it.
  if (_reorderIdx === null && _srcDragItem) {
    DROPPED.splice(idx, 0, _srcDragItem);
    _srcDragItem = null;
    var dz = document.getElementById('drop-zone');
    if (dz) dz.classList.remove('drag-over');
    renderDroppedItems();
    return;
  }
  if (_reorderIdx === null || _reorderIdx === idx) { _reorderIdx = null; return; }
  var from = _reorderIdx;
  var item = DROPPED.splice(from, 1)[0];
  // removing the item first shifts everything above it down by one
  DROPPED.splice(from < idx ? idx - 1 : idx, 0, item);
  _reorderIdx = null;
  renderDroppedItems();
}
function cdEnd() { _reorderIdx = null; document.querySelectorAll('.dc-wrap').forEach(function(el){ el.classList.remove('drag-over-top'); }); }

function logCardHTML(e) {
  var isMajor = e.type==='log'; var isAlert = e.type==='alert'; var isSupp = e.type==='supplemental';
  var cls = isAlert?'log-card alert':isSupp?'log-card supplemental':isMajor?'log-card':'log-card base';
  return '<div class="'+cls+'">'
    +'<div class="log-card-header">'
    +'<span style="font-size:'+(isMajor?'20':'16')+'px">'+esc(e.emoji||'📋')+'</span>'
    +'<div><div class="log-card-title">'+esc(e.title||e.type||'Log')+'</div>'
    +'<div class="log-card-meta">'+esc(e.date||'')+'</div></div>'
    +'</div>'
    +(e.body?'<div class="log-card-body">'+esc(e.body)+'</div>':'')
    +'</div>';
}

function renderLogOutput() {
  if (DOC_MODE === 'blank') {
    document.getElementById('log-output').innerHTML = renderBlankLogbook();
    return;
  }
  var selectedIdxs = [];
  document.querySelectorAll('.ep-chk').forEach(function(c,i){ if(c.checked) selectedIdxs.push(i); });

    html += '<div class="ep-banner"><div><div class="ep-banner-label">Episode</div><div class="ep-banner-title">'+esc(ep.label)+'</div></div></div>';
    ep.entries.forEach(function(e) { html += logCardHTML(e); });
  });

function srcDragStart(e, kind, idx) {
  var data = kind==='npc' ? SRC_NPCS[idx] : kind==='map-sector' ? ALL_SECTORS[idx] : kind==='map-subzone' ? ALL_SUBZONES[idx] : kind==='galaxy-map' ? GALAXY_MAPS[idx] : null;
  _srcDragItem = {kind:kind, data:data, notes:''};
  if (kind === 'log-ep') _srcDragItem.ep = idx;
  _reorderIdx = null;
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', kind);
}

function dzOver(e) {
  if (_reorderIdx !== null) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
  document.getElementById('drop-zone').classList.add('drag-over');
}
function dzLeave(e) {
  if (!document.getElementById('doc-left').contains(e.relatedTarget)) {
    document.getElementById('drop-zone').classList.remove('drag-over');
  }
}
function dzDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  if (!_srcDragItem) return;
  DROPPED.push(_srcDragItem);
  _srcDragItem = null;
  renderDroppedItems();
}

function removeDropped(idx) {
  DROPPED.splice(idx, 1);
  renderDroppedItems();
}

// ── Zine mode ───────────────────────────────────────────────────────────────
// A saddle-stitched booklet: N half-size pages (N = 12/16/20 — a multiple of 4,
// because each folded sheet carries four pages), imposed onto N/4 landscape
// sheets printed double-sided (flip on short edge), folded and stapled.
// Sheet k (0-based) carries pages [N-2k, 2k+1] on its front and
// [2k+2, N-2k-1] on its back (1-based page numbers).
// The layout (ZINE.pages: one item list per page) is saved per mission slot.
var ZINE = null;
var ZINE_FIT = {};
var ZINE_PAPER = {
  letter: {pw:'5.5in', ph:'8.5in', sw:'11in', page:'11in 8.5in', px:[528,816], name:'US Letter'},
  a4:     {pw:'148.5mm', ph:'210mm', sw:'297mm', page:'297mm 210mm', px:[561,794], name:'A4'}
};
// Full-page items replace a page's contents; everything else stacks.
var ZFULL = {'galaxy-map':1,'z-front':1,'z-back':1,'z-char':1,'z-char-blank':1,'z-ship':1,'z-ship-blank':1,'z-ep-a':1,'z-ep-b':1};
// Items whose last child (a ruled block) stretches to fill the page.
var ZART = {'z-front':1,'z-back':1,'galaxy-map':1};   // full-bleed art pages
var ZGROW = {'z-lines':1,'z-ep-a':1,'z-ep-b':1,'z-char':1,'z-char-blank':1,'z-ship':1,'z-ship-blank':1};
var _zPrevPrintMode = null;
var ZRULE_LINES = new Array(41).join('<i></i>');   // 40 ruled lines, clipped to fit
var ZSCENE_LINES = new Array(7).join('<i></i>');
var _zPrintTimer = null, _zFitTimer = null, _zResizeTimer = null;

function zinePaper() { return ZINE_PAPER[ZINE && ZINE.paper] || ZINE_PAPER.letter; }
function zineKey() { return 'stcl_zine_' + ZINE_SLOT; }
function zineSave() { try { localStorage.setItem(zineKey(), JSON.stringify(ZINE)); } catch(e) {} }
function zineLoad() {
  try {
    var z = JSON.parse(localStorage.getItem(zineKey()) || 'null');
    if (z && z.pages && z.pages.length === z.n && [12,16,20].indexOf(z.n) >= 0) return z;
  } catch(e) {}
  return null;
}

function zineDefaultPages(n) {
  var p = [], i;
  for (i = 0; i < n; i++) p.push([]);
  p[0] = [{kind:'z-front'}];
  p[1] = [{kind: SRC_CHAR.name ? 'z-char' : 'z-char-blank'}];
  p[2] = [{kind: SRC_SHIP.name ? 'z-ship' : 'z-ship-blank'}];
  // The 20-page zine gives up one episode for the two maps as a spread.
  var maps = n >= 20 && GALAXY_MAPS.length >= 2 ? 2 : 0;
  var end = n - 3 - maps;
  // Episode spreads start on an even page so both halves face each other.
  for (i = 3; i < end; i += 2) { p[i] = [{kind:'z-ep-a'}]; p[i+1] = [{kind:'z-ep-b'}]; }
  p[end] = [{kind:'blank-npc'},{kind:'blank-npc'}];
  p[end+1] = [{kind:'blank-chart'},{kind:'z-lines', label:'Notes'}];
  if (maps) { p[n-3] = [{kind:'galaxy-map', data:GALAXY_MAPS[1]}]; p[n-2] = [{kind:'galaxy-map', data:GALAXY_MAPS[0]}]; }
  p[n-1] = [{kind:'z-back'}];
  return p;
}

function toggleZine() {
  var on = !document.body.classList.contains('zine-mode');
  document.body.classList.toggle('zine-mode', on);
  document.getElementById('zine-btn').textContent = on ? '✕ CLOSE ZINE' : '📖 ZINE';
  var pm = document.body.classList.contains('print-mode');
  if (on) {
    // Zines default to the white print theme — black pages eat home-printer ink.
    _zPrevPrintMode = pm;
    if (!pm) toggleTheme();
    var fresh = !ZINE;
    if (fresh) {
      ZINE = zineLoad();
      if (!ZINE) ZINE = {n:20, paper:'letter', view:'spread', side:'both', custom:false, pages:zineDefaultPages(20), _new:true};
      document.getElementById('zine-n').value = ZINE.n;
      document.getElementById('zine-paper').value = ZINE.paper;
      document.getElementById('zine-view').value = ZINE.view;
      document.getElementById('zine-side').value = ZINE.side;
    }
    showSTab('zpages');
    zineApplyPaper();
    if (ZINE._new) { delete ZINE._new; zineToggleHelp(true); }
    renderZine();
  } else {
    if (_zPrevPrintMode === false && pm) toggleTheme();
    showSTab('stats');
    zinePageStyle(false);
  }
}

// The @page rule exists only while zine mode is on, so the regular export
// prints exactly as it always has.
function zinePageStyle(on) {
  var el = document.getElementById('zine-page-css');
  if (!on) { if (el) el.parentNode.removeChild(el); return; }
  if (!el) { el = document.createElement('style'); el.id = 'zine-page-css'; document.head.appendChild(el); }
  el.textContent = '@page{size:' + zinePaper().page + ';margin:0}';
}
function zineApplyPaper() {
  var P = zinePaper(), st = document.body.style;
  st.setProperty('--pw', P.pw); st.setProperty('--ph', P.ph); st.setProperty('--sw', P.sw);
  zinePageStyle(true);
}

function zineSet(key, val) {
  ZINE[key] = val; zineSave();
  if (key === 'paper') { zineApplyPaper(); zineHelpHTML(); }
  renderZine();
}
function zineSetCount(v) {
  var n = parseInt(v, 10);
  if (ZINE.custom && !confirm('Changing the page count resets the zine to the default layout for ' + n + ' pages. Continue?')) {
    document.getElementById('zine-n').value = ZINE.n; return;
  }
  ZINE.n = n; ZINE.pages = zineDefaultPages(n); ZINE.custom = false;
  zineSave(); renderZine();
}
function zineReset() {
  if (ZINE.custom && !confirm('Reset every page to the default layout?')) return;
  ZINE.pages = zineDefaultPages(ZINE.n); ZINE.custom = false;
  zineSave(); renderZine();
}
function zineRestorePage(p) {
  ZINE.pages[p] = zineDefaultPages(ZINE.n)[p];
  zineSave(); renderZine();
}
function zineRemove(p, j) {
  ZINE.pages[p].splice(j, 1); ZINE.custom = true;
  zineSave(); renderZine();
}

function zineHelpHTML() {
  var P = zinePaper();
  document.getElementById('zine-help').innerHTML =
    '<b>PRINTER SETTINGS</b> — Paper: <b>' + P.name + '</b> · Two-sided: <b>Flip on short edge</b> · Scale: <b>100% / Default</b> (never “Fit to page”) · Margins: <b>None</b> · Background graphics: <b>on</b>. Landscape is set automatically.<br>'

  // Write into a plain popup (same pattern as the bridge HUD) instead of a
  // blob: URL — a blob document may not load file:// images, so the ship
  // thumbnail silently vanished when the app runs from disk.
  const w = window.open('', '_blank');
  if (!w) { alert('Pop-up blocked — please allow pop-ups for this page.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

function rollNPCName(species) {
  const rp = arr => arr[Math.floor(Math.random()*arr.length)];
  const keys = Object.keys(SPECIES_NAMES);
  const speciesKey = species ? (keys.find(k => species.toLowerCase().includes(k.toLowerCase())) || 'Human') : rp(keys);
  if (speciesKey === 'Human') {
    const nat = rp(HUMAN_NATIONALITIES);
    const fnData = HUMAN_FIRST_NAMES[nat] || HUMAN_FIRST_NAMES['United States'];
    const isFemale = Math.random() < 0.5;
    const first = rp(isFemale ? fnData.female : fnData.male);
    const last = rp(HUMAN_LAST_NAMES[nat] || HUMAN_LAST_NAMES['United States']);
    return first + ' ' + last;
  }
  const data = SPECIES_NAMES[speciesKey];
  if (speciesKey === 'Bajoran') {
    return rp(data.family) + ' ' + rp(data.given);
  }
  const isFem = Math.random() < 0.5;
  const pool = isFem ? data.female : data.male;
  const name = rp(pool);
  if (data.surname) return name + ' ' + rp(data.surname);
  return name;
}

function rollSkillTest() {
  const aEl=document.getElementById('roll-attr');
  const dEl=document.getElementById('roll-disc');
  const diff=1;
  const extra=parseInt(document.getElementById('extra-dice')?.value||0);
  const focusCheck=document.getElementById('focus-check')?.checked||false;
  const [aKey,av]=aEl.value.split('|');
  const [dKey,dv]=dEl.value.split('|');
  const tn=parseInt(av)+parseInt(dv);
  const discRank=parseInt(dv);

  // Spend momentum for extra dice
  if(extra>0) {
    const spent=Math.min(extra,S.char.momentum);
    S.char.momentum=Math.max(0,S.char.momentum-spent);
    S.char.threat+=extra-spent; // any extra above available momentum add to threat
  }

  const numDice=2+extra;
  const rolls=[];
  for(let i=0;i<numDice;i++) rolls.push(Math.floor(Math.random()*20)+1);

  let totalSucc=0, complications=0;
  const diceHTML = rolls.map(r=>{
    let succ=0, cls='fail';
    if(r===20){ complications++; cls='complication'; if(r<=tn) succ=1; } // 20 always complicates; scores only if 20 ≤ TN
    else if(r===1){ succ=2; cls='critical'; }
    else if(focusCheck && r<=discRank){ succ=2; cls='success'; }
    else if(r<=tn){ succ=1; cls='success'; }
    totalSucc+=succ;
    return `<div class="die-result ${cls}" title="${succ>0?succ+' success':''}">${r}</div>`;
  }).join('');

  const netSucc=totalSucc-diff;
  const success=netSucc>=0;
  const momentum=success?netSucc:0;
  if(momentum>0){ S.char.momentum=Math.min(6,S.char.momentum+momentum); }

  let resultColor=success?'var(--success)':'var(--danger)';
  let resultText=success?`SUCCESS (${totalSucc} success${totalSucc!==1?'es':''}, +${momentum} Momentum)`:`FAILURE (${totalSucc} success${totalSucc!==1?'es':''})`;
  if(complications>0) resultText+=` — ${complications} COMPLICATION${complications>1?'S':''}!`;

  const html=`<div class="dice-result-row">${diceHTML}</div>
    <div style="font-size:14px;font-weight:bold;color:${resultColor};margin:8px 0">${resultText}</div>
    <div style="font-size:10px;color:var(--muted)">TN: ${tn} | ${numDice} dice | ${focusCheck?'Focus active':'No focus'}</div>`;

  window._lastRollResult = html;
  const resultEl = document.getElementById('skill-roll-result');
  if (resultEl) resultEl.innerHTML = html;
  const mEl = document.getElementById('dice-momentum-val');
  if (mEl) mEl.textContent = S.char.momentum;
  const tEl = document.getElementById('dice-threat-val');
  if (tEl) tEl.textContent = S.char.threat;
  _lastRollData = { rolls, tn, successes: totalSucc, complications, diff, label: 'Officer Task', success };
  saveSlot();
}

function oracleRoll(likelihood) {
  const matrix=YES_NO_MATRIX[likelihood];
  const roll=Math.floor(Math.random()*20)+1;
  let result, cls, sub;

  if(roll<=matrix.yes){ result='YES'; cls='yes'; sub='Straightforward yes.'; }
  else if(roll<=matrix.yestwist){ result='YES — but…'; cls='yes-twist'; sub='Yes, but with an unexpected complication.'; }
  else if(roll<=matrix.notwist){ result='NO — however…'; cls='no-twist'; sub='No, but something useful or interesting happens.'; }
  else{ result='NO'; cls='no'; sub='Straight refusal or negative outcome.'; }

  const dieHTML=`<div class="die-result ${roll<=matrix.yestwist?'success':roll>matrix.notwist?'complication':'fail'}">${roll}</div>`;

  document.getElementById('oracle-result-card').style.display='block';
  document.getElementById('oracle-detail-text').textContent=`${likelihood} — rolled ${roll}`;
  document.getElementById('oracle-dice-row').innerHTML=dieHTML;
  document.getElementById('oracle-result-text').className=`oracle-result ${cls}`;
  document.getElementById('oracle-result-text').textContent=result;
  document.getElementById('oracle-sub-text').textContent=sub;
  window._lastOracleResult = { type: `Yes/No · ${likelihood}`, result, sub };
  pushHudOracle(window._lastOracleResult);
  hudBroadcast();
}

function genOracle(type) {
  if(!window._storyResults) window._storyResults={};
  const d20=()=>Math.floor(Math.random()*20);
  const pick=arr=>arr[d20()%arr.length];
  const r=d20();

  switch(type){
    case 'mission': window._storyResults['mission']={desc:`${r+1}: ${MISSION_TYPES[r]||MISSION_TYPES[0]}`}; break;
    case 'incident': window._storyResults['incident']={desc:`${pick(INCIDENT_VERBS)} the ${pick(INCIDENT_NOUNS)}`}; break;
    case 'enc_space': { const e=ENCOUNTER_SPACE[r]; window._storyResults['enc_space']={name:e.name,desc:e.desc}; break; }
    case 'enc_planet': { const e=ENCOUNTER_PLANET[r]; window._storyResults['enc_planet']={name:e.name,desc:e.desc}; break; }
    case 'npc': {
      const fact=pick(['Federation','Klingon','Romulan','Cardassian','Civilian','Unknown']);
      const factionSpeciesMap={Federation:'Human',Klingon:'Klingon',Romulan:'Romulan',Cardassian:'Cardassian'};
      const name=rollNPCName(factionSpeciesMap[fact]||null);
      const arch=pick(NPC_ARCHETYPES), trait=pick(NPC_TRAITS);
      window._storyResults['npc']={desc:`${name} — ${arch} (${fact}). "${trait}"`};
      break;
    }
    case 'npc_goal': window._storyResults['npc_goal']={desc:pick(NPC_GOALS)}; break;
    case 'complication': window._storyResults['complication']={desc:`${r+1}: ${COMPLICATIONS_TABLE[r]}`}; break;
    case 'advantage': window._storyResults['advantage']={desc:`${r+1}: ${ADVANTAGES_TABLE[r]}`}; break;
    case 'sector_trait': window._storyResults['sector_trait']={desc:pick(SECTOR_TRAITS)}; break;
    case 'sys_feature': window._storyResults['sys_feature']={desc:pick(SYSTEM_FEATURES)}; break;
    case 'planet_feature': window._storyResults['planet_feature']={desc:pick(PLANET_FEATURES)}; break;
    case 'momentum_spend': window._storyResults['momentum_spend']={name:MOMENTUM_SPENDS[r%MOMENTUM_SPENDS.length].name,desc:MOMENTUM_SPENDS[r%MOMENTUM_SPENDS.length].desc}; break;
    case 'threat_spend': window._storyResults['threat_spend']={name:THREAT_SPENDS[r%THREAT_SPENDS.length].name,desc:THREAT_SPENDS[r%THREAT_SPENDS.length].desc}; break;
    case 'action_word': {
      const ra = Math.floor(Math.random()*100);
      const entry = ACTION_WORDS[ra] || ACTION_WORDS[0];
      window._storyResults.actionWord = entry;
      break;
    }
    case 'meaning_word': {
      const rm = Math.floor(Math.random()*100);
      const entry = MEANING_WORDS[rm] || MEANING_WORDS[0];
      window._storyResults.meaningWord = entry;
      break;
    }
    case 'mission_gen': {
      const ra = Math.floor(Math.random()*100);
      const rm = Math.floor(Math.random()*100);
      window._storyResults.actionWord = ACTION_WORDS[ra] || ACTION_WORDS[0];
      window._storyResults.meaningWord = MEANING_WORDS[rm] || MEANING_WORDS[0];
      break;
    }
    case 'time_interval': window._storyResults['time_interval']={desc:`${r+1}: ${TIME_INTERVALS[r]}`}; break;
    case 'npc_archetype': window._storyResults['npc_archetype']={desc:`${r+1}: ${NPC_ARCHETYPE_TABLE[r]}`}; break;
    case 'npc_upbringing': window._storyResults['npc_upbringing']={desc:`${r+1}: ${NPC_UPBRINGING_ENVS[r]}`}; break;
    case 'npc_cultural': window._storyResults['npc_cultural']={desc:`${r+1}: ${NPC_CULTURAL_TRAITS[r]}`}; break;
    case 'npc_goals_tbl': window._storyResults['npc_goals_tbl']={desc:`${r+1}: ${NPC_GOALS_TABLE[r]}`}; break;
    case 'npc_tactics': window._storyResults['npc_tactics']={desc:`${r+1}: ${NPC_TACTICS[r]}`}; break;
    case 'npc_fed_outlook': window._storyResults['npc_fed_outlook']={desc:`${r+1}: ${NPC_FED_OUTLOOK[r]}`}; break;
    case 'alien_name': {
      const sylCount = window._alienNameSyls || 0;
      const names = [genAlienName(sylCount||null), genAlienName(sylCount||null), genAlienName(sylCount||null)];
      window._storyResults['alien_name']={desc:names.join('  ·  ')};
      break;
    }
    case 'planet_name': {
      const letter = PLANET_NAME_LETTERS[r];
      const desig = PLANET_NAME_DESIGNATORS[Math.floor(Math.random()*20)];
      const sys = `${PLANET_NAME_LETTERS[Math.floor(Math.random()*20)]} System`;
      window._storyResults['planet_name']={name:`${letter} ${desig}`,desc:`System: ${sys}`};
      break;
    }
    case 'civ_systems': window._storyResults['civ_systems']={name:`${CIV_NOTABLE_SYSTEMS[r]} Notable Systems`}; break;
    case 'civ_phenomena': window._storyResults['civ_phenomena']={desc:`${r+1}: ${CIV_SPATIAL_PHENOMENA[r]}`}; break;
    case 'civ_government': window._storyResults['civ_government']={desc:`${r+1}: ${CIV_GOVERNMENT[r]}`}; break;
    case 'civ_religion': window._storyResults['civ_religion']={desc:`${r+1}: ${CIV_RELIGION[r]}`}; break;
    case 'civ_polity': window._storyResults['civ_polity']={desc:`${r+1}: ${CIV_POLITY[r]}`}; break;
    case 'civ_society': window._storyResults['civ_society']={desc:`${r+1}: ${CIV_SOCIETY[r]}`}; break;
    case 'civ_resources': window._storyResults['civ_resources']={desc:`${r+1}: ${CIV_RESOURCES[r]}`}; break;
    case 'loc_theme': {
      const ti = Math.floor(Math.random()*10);
      window._storyResults['loc_theme']={desc:`${ti+1}: ${LOCATION_THEME_NAMES[ti]}`};
      break;
    }
    case 'loc_location': {
      const theme = window._locTheme || LOCATION_THEME_NAMES[Math.floor(Math.random()*10)];
      const tbl = LOCATION_THEMES[theme];
      window._storyResults['loc_location']={name:tbl[r],desc:`Theme: ${theme} (${r+1})`};
      break;
    }
  }
  // action_word / meaning_word / mission_gen store under camelCase keys,
  // so looking up by `type` missed exactly the tables a solo GM uses most.
  const ORACLE_RESULT_KEYS = {action_word:['actionWord'], meaning_word:['meaningWord'],
                              mission_gen:['actionWord','meaningWord']};
  const _keys = ORACLE_RESULT_KEYS[type] || [type];
  const _res = _keys.length === 1
    ? window._storyResults[_keys[0]]
    : _keys.map(k => window._storyResults[k]).filter(Boolean).reduce((acc, r) =>
        ({desc: [acc && acc.desc, [r.word, r.prompt].filter(Boolean).join(' \u2014 ')]
          .filter(Boolean).join('  \u00b7  ')}), null);
  if (_res) {
    const _label = type.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    // word tables carry {word, prompt} rather than {name, desc}
    const _text = [_res.name, _res.word, _res.desc, _res.prompt].filter(Boolean).join(' — ');
    window._lastOracleResult = { type: _label, result: _text };
    pushHudOracle(window._lastOracleResult);
    hudBroadcast();
  }
  const _sy = window.scrollY;
  const _openIds = [...document.querySelectorAll('.collapsible-body.open')].map(el=>el.id).filter(Boolean);
  renderCurrentTab();
  window.scrollTo(0, _sy);
  _openIds.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.add('open'); });
}

function clearOracleResults() { window._storyResults={}; renderCurrentTab(); }

function pushHudOracle(entry) {
  if(!window._hudOracleQueue) window._hudOracleQueue = [];
  window._hudOracleQueue.unshift(Object.assign({}, entry, {id: Date.now()}));
  if(window._hudOracleQueue.length > 10) window._hudOracleQueue.length = 10;
}
function clearHudOracle() {
  window._hudOracleQueue = [];
  window._lastOracleResult = null;
  hudBroadcast();
  refreshHudCtrl();
}

function genAlienName(sylCount) {
  const d20=()=>Math.floor(Math.random()*20);
  const n=sylCount||(Math.floor(Math.random()*3)+2);
  const prog=ALIEN_NAME_GEN.progressions[d20()];
  const parts={A:ALIEN_NAME_GEN.A[d20()],B:ALIEN_NAME_GEN.B[d20()],C:ALIEN_NAME_GEN.C[d20()],D:ALIEN_NAME_GEN.D[d20()]};
  const raw=prog.slice(0,n).split('').map(c=>parts[c]).join('');
  return raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
}

function rollRandomName() {
  const species = (S.char && (S.char._selectedSpecies || S.char.species)) || 'Human';
  let key = Object.keys(SPECIES_NAMES).find(k => species.toLowerCase().includes(k.toLowerCase())) || 'Human';
  let name;
  if (key === 'Human') {
    const nat = HUMAN_NATIONALITIES[Math.floor(Math.random() * HUMAN_NATIONALITIES.length)];
    const fnData = HUMAN_FIRST_NAMES[nat] || HUMAN_FIRST_NAMES['United States'];
    const isFemale = Math.random() < 0.5;
    const firstPool = isFemale ? fnData.female : fnData.male;
    const firstName = firstPool[Math.floor(Math.random() * firstPool.length)];
    const lastPool = HUMAN_LAST_NAMES[nat] || HUMAN_LAST_NAMES['United States'];
    const lastName = lastPool[Math.floor(Math.random() * lastPool.length)];
    name = firstName + ' ' + lastName;
  } else {
    const data = SPECIES_NAMES[key];
    if (key === 'Bajoran') {
      const fam = data.family[Math.floor(Math.random() * data.family.length)];
      const given = data.given[Math.floor(Math.random() * data.given.length)];
      name = fam + ' ' + given;
    } else {
      const pool = Math.random() < 0.5 ? data.male : data.female;
      name = pool[Math.floor(Math.random() * pool.length)];
      if (data.surname) {
        name += ' ' + data.surname[Math.floor(Math.random() * data.surname.length)];
      }
    }
  }
  saveCharField('name', name);
  renderCurrentTab();
}

}

function suggestValue(idx, listIdx) {
  const list = VALUE_SUGGESTIONS[listIdx === undefined ? idx : listIdx];
  if (!list) return;
  const v = list[Math.floor(Math.random() * list.length)];
  setValueText(idx, v);

function setValueText(i,v) {
  while(S.char.values.length<=i) S.char.values.push('');
  S.char.values[i]=v; saveSlot();
}
function addValue() {
  S.char.values.push(''); S.char.valuesUsed.push(false); S.char.valuesChallenged.push(false);
  if(Array.isArray(S.char.valuesDetGranted)) S.char.valuesDetGranted.push(false);
  saveSlot(); renderCurrentTab();
}
function toggleValueUsed(i) { S.char.valuesUsed[i]=!S.char.valuesUsed[i]; saveSlot(); renderCurrentTab(); }
function toggleValueChallenged(i) {
  if(!Array.isArray(S.char.valuesDetGranted)) S.char.valuesDetGranted=[];
  S.char.valuesChallenged[i]=!S.char.valuesChallenged[i];
  // Un-toggling is an undo, so hand the Determination back - but only if
  // the challenge actually granted one (at 3/3 it is capped and grants none).
  if(S.char.valuesChallenged[i]) {
    const granted = S.char.determination < 3;
    if(granted) S.char.determination++;
    S.char.valuesDetGranted[i]=granted;
  } else {
    if(S.char.valuesDetGranted[i]) S.char.determination=Math.max(0,S.char.determination-1);
    S.char.valuesDetGranted[i]=false;
  }
  saveSlot(); renderCurrentTab();
}

// ============================================================
// LIFEPATH WIZARD — book Chapter 03.20, Steps One–Seven
// Every attribute starts at 7 and every discipline at 1; the lifepath alone
// takes them to the book's totals (56 / 16). Choices live in S.char._lp and
// the chosen names in the _selected*/career* fields the HUD and sheet read.
// Scores are only written to the character on Finish.
// ============================================================
const LP_CUSTOM = {name:'New Species / Unique', attrs:[], any:3, eras:[], page:'92, 102',
  desc:'A unique individual or a species not in the matrixes: +1 to any three different attributes (sidebars, pp. 92 and 102). Name the species below — it becomes your species trait.'};
const LP_ERA_LABEL = {ENT:'Enterprise Era', TOS:'Original Series Era', TNG:'Next Generation Era'};
// The book has matrixes for three eras; the app's other eras use the nearest one.
function lpEraTable(era) {
  if (!era) return '';
  if (/Enterprise/.test(era)) return 'ENT';
  if (/Discovery|Original|Golden/.test(era)) return 'TOS';
  return 'TNG';
}
const LP_ATTR_KEYS = ATTRIBUTES.map(a => a.key);
const LP_DISC_KEYS = DISCIPLINES.map(d => d.key);
const LP_OUTLOOK_GROUPS = {
  upbringing: {label:'Upbringing', yes:'Accepted', no:'Rebelled', who:'Any character (the default)'},
  caste:      {label:'Klingon Caste', yes:'Accepted', no:'Rejected', who:'Klingons, or anyone raised in a Klingon household'},
  aspiration: {label:'Aspiration', yes:'Pursued', no:'Abandoned', who:'Any character'},
};

const lpMixedOn = l => !!(l.mixedOn || l.mixed);
function lpDefault() {
  return {v:2, mixed:'', mixedOn:false, speciesPick:[], customName:'',
    envTable:'', envAttr:'', envDisc:'', envOther:'',
    outlookGroup:'upbringing', outlookYes:null, outlookDisc:'',
    eduCat:'', eduAttr:{}, eduMajor:'', eduMinor:['',''], eduSwapFrom:'', eduSwapTo:'',
    ev1Attr:'', ev1Disc:'', ev2Attr:'', ev2Disc:'',
    finAttr:[], finDisc:[], adjAttr:{}, adjDisc:{},
    focus:{outlook:'', edu:['','',''], ev1:'', ev2:''}};
}
function lp() {
  const c = S.char;
  if (!c._lp || c._lp.v !== 2) c._lp = lpDefault();
  return c._lp;
}
const lpAbbr = k => (ATTRIBUTES.find(a => a.key === k) || DISCIPLINES.find(d => d.key === k) || {abbr:k}).abbr;
const lpFull = k => (ATTRIBUTES.find(a => a.key === k) || DISCIPLINES.find(d => d.key === k) || {full:k}).full;
function lpRoll(n) { return Math.floor(Math.random() * (n || 20)) + 1; }
function lpInRange(roll, range) {
  const [lo, hi] = String(range).split('-').map(Number);
  return roll >= lo && roll <= (hi || lo);
}
function lpSpecies(name) {
  if (!name) return null;
  return name === LP_CUSTOM.name ? LP_CUSTOM : (LP_SPECIES.find(s => s.name === name) || null);
}
function lpSpeciesDisplay(c) {
  const l = lp(); const sp = lpSpecies(c._selectedSpecies);
  if (!sp) return '';
  const base = sp === LP_CUSTOM ? (l.customName.trim() || 'New Species') : sp.name;
  return l.mixed ? `${base} / ${l.mixed}` : base;
}
function lpNeedsSpeciesPick(c) {
  const sp = lpSpecies(c._selectedSpecies);
  return !!sp && (sp.any > 0 || !!lp().mixed);
}
// Attributes a species pick may come from: mixed heritage pools both species.
function lpSpeciesPickPool(c) {
  const l = lp(); const sp = lpSpecies(c._selectedSpecies);
  if (!sp) return [];
  const sp2 = l.mixed ? lpSpecies(l.mixed) : null;
  if (sp.any || (sp2 && sp2.any)) return LP_ATTR_KEYS.slice();
  return [...new Set([...(sp.attrs || []), ...((sp2 && sp2.attrs) || [])])];
}
function lpSpeciesAttrs(c) {
  const sp = lpSpecies(c._selectedSpecies);
  if (!sp) return [];
  if (!lpNeedsSpeciesPick(c)) return sp.attrs.slice();
  const pool = lpSpeciesPickPool(c);
  return [...new Set(lp().speciesPick)].filter(k => pool.includes(k)).slice(0, 3);
}
function lpEnv(c) {
  const l = lp();
  return ((LP_ENVIRONMENTS[l.envTable] || []).find(e => e.name === c._selectedEnv)) || null;
}
function lpEnvAttrPool(c) {
  const env = lpEnv(c); if (!env) return [];
  if (env.attrs === 'SPECIES_ATTRIBUTES') return lpSpeciesAttrs(c);
  if (env.attrs === 'OTHER_SPECIES_ATTRIBUTES') {
    const o = lpSpecies(lp().envOther);
    return !o ? [] : (o.any ? LP_ATTR_KEYS.slice() : o.attrs.slice());
  }
  return env.attrs;
}
const lpPool = (list, all) => (list && list[0] === 'any') ? all.slice() : (list || []);
function lpOutlook(c) {
  return ((LP_OUTLOOKS[lp().outlookGroup] || []).find(o => o.name === c._selectedUpbringing)) || null;
}
function lpEdu(c) {
  for (const cat of LP_EDUCATION) {
    const t = cat.tracks.find(t => t.name === c._selectedTrack);
    if (t) return {cat, track:t};
  }
  return null;
}
// The disciplines an education choice raises, as {key: amount}.
function lpEduDiscs(c) {
  const l = lp(); const e = lpEdu(c); const out = {};
  if (!e) return out;
  const t = e.track;
  if (l.eduMajor) out[l.eduMajor] = 2;
  if (t.mode === 'officer') {
    const other = l.eduMajor === 'command' ? 'security' : l.eduMajor === 'security' ? 'command' : '';
    if (other) out[other] = 1;
    if (l.eduMinor[1]) out[l.eduMinor[1]] = (out[l.eduMinor[1]] || 0) + 1;
  } else {
    l.eduMinor.filter(Boolean).forEach(k => { out[k] = (out[k] || 0) + 1; });
  }
  return out;
}
const lpEvent = name => LP_CAREER_EVENTS.find(e => e.name === name) || null;

// One pass over the whole lifepath: final scores plus what is still missing,
// grouped by wizard step (0–5) so each step can show its own gaps.
function lpCompute() {
  const c = S.char; const l = lp();
  const attr = {}; LP_ATTR_KEYS.forEach(k => attr[k] = 7);
  const disc = {}; LP_DISC_KEYS.forEach(k => disc[k] = 1);
  const issues = [[], [], [], [], [], []];
  // secs: which page section (LP_SECTIONS key) fixes each missing item.
  const secs = {};
  const miss = (i, sec, msg) => { issues[i].push(msg); secs[sec] = true; };
  const val = i => ((c.values || [])[i] || '').trim();

  // Step One — Species
  const sp = lpSpecies(c._selectedSpecies);
  if (!sp) miss(0, 'species', 'Choose a species');
  else {
    if (lpMixedOn(l) && !lpSpecies(l.mixed)) miss(0, 'speciesDetail', 'Choose the second species for mixed heritage');
    if (sp === LP_CUSTOM && !l.customName.trim()) miss(0, 'speciesDetail', 'Name your species');
    const sa = lpSpeciesAttrs(c);
    if (sa.length < 3) miss(0, 'speciesDetail', `Choose ${3 - sa.length} more species attribute${3 - sa.length === 1 ? '' : 's'}`);
    sa.forEach(k => attr[k]++);
  }
  // Step Two — Environment
  const env = lpEnv(c);
  if (!env) miss(1, 'env', 'Choose an environment');
  else {
    if (env.attrs === 'OTHER_SPECIES_ATTRIBUTES' && !lpSpecies(l.envOther)) miss(1, 'envPicks', 'Choose the species whose world you grew up on');
    if (lpEnvAttrPool(c).includes(l.envAttr)) attr[l.envAttr]++; else miss(1, 'envPicks', 'Choose the environment attribute');
    if (lpPool(env.discs, LP_DISC_KEYS).includes(l.envDisc)) disc[l.envDisc]++; else miss(1, 'envPicks', 'Choose the environment discipline');
  }
  if (!val(0)) miss(1, 'envValue', 'Write your environment value');
  // Step Three — Early Outlook
  const ol = lpOutlook(c);
  if (!ol) miss(2, 'outlook', 'Choose an early outlook');
  else {
    if (l.outlookYes === true || l.outlookYes === false) {
      Object.entries(l.outlookYes ? ol.yes : ol.no).forEach(([k, v]) => attr[k] += v);
    } else miss(2, 'outlookDetail', `Choose whether you ${LP_OUTLOOK_GROUPS[l.outlookGroup].yes.toLowerCase()} or ${LP_OUTLOOK_GROUPS[l.outlookGroup].no.toLowerCase()} it`);
    if (lpPool(ol.discs, LP_DISC_KEYS).includes(l.outlookDisc)) disc[l.outlookDisc]++; else miss(2, 'outlookDetail', 'Choose the outlook discipline');
  }
  if (!l.focus.outlook.trim()) miss(2, 'outlookDetail', 'Add your early outlook focus');
  // Step Four — Education
  const ed = lpEdu(c);
  if (!ed) miss(3, 'edu', 'Choose your education');
  else {
    const t = ed.track;
    const pts = Object.entries(l.eduAttr).filter(([k, v]) => LP_ATTR_KEYS.includes(k) && v > 0);
    const sum = pts.reduce((s, [, v]) => s + v, 0);
    if (sum !== 3) miss(3, 'eduDetail', `Assign ${3 - sum} more education attribute point${3 - sum === 1 ? '' : 's'}`);
    else if (t.attrReq.length && !pts.some(([k]) => t.attrReq.includes(k))) miss(3, 'eduDetail', `One education attribute must be ${t.attrReq.map(lpFull).join(' or ')}`);
    pts.forEach(([k, v]) => attr[k] += v);
    const majorPool = t.mode === 'officer' ? ['command', 'security'] : lpPool(t.major, LP_DISC_KEYS);
    if (!majorPool.includes(l.eduMajor)) miss(3, 'eduDetail', 'Choose the discipline that gets +2');
    if (t.mode === 'officer') {
      if (!['conn', 'engineering', 'science', 'medicine'].includes(l.eduMinor[1])) miss(3, 'eduDetail', 'Choose Conn, Engineering, Science or Medicine for +1');
    } else {
      const mins = l.eduMinor.filter(k => k && k !== l.eduMajor);
      if (new Set(mins).size < 2) miss(3, 'eduDetail', `Choose ${2 - new Set(mins).size} more discipline${2 - new Set(mins).size === 1 ? '' : 's'} for +1`);
      if (t.mode === 'intel' && l.eduMajor && ![l.eduMajor, ...mins].includes('security')) miss(3, 'eduDetail', 'Intelligence Training: Security must be one of the three');
    }
    const eduD = lpEduDiscs(c);
    Object.entries(eduD).forEach(([k, v]) => disc[k] += v);
    if (t.swap && (l.eduSwapFrom || l.eduSwapTo)) {
      if (!l.eduSwapFrom || !l.eduSwapTo) miss(3, 'eduDetail', 'Finish or clear the optional discipline swap');
      else if (eduD[l.eduSwapFrom] || eduD[l.eduSwapTo] || l.eduSwapFrom === l.eduSwapTo) miss(3, 'eduDetail', 'The swap must move a point between disciplines this education did not raise');
      else if (disc[l.eduSwapFrom] <= 1) miss(3, 'eduDetail', `${lpFull(l.eduSwapFrom)} is too low to give up a point`);
      else { disc[l.eduSwapFrom]--; disc[l.eduSwapTo]++; }
    }
    if (t.cap4) {
      const over = LP_DISC_KEYS.filter(k => disc[k] > 4);
      if (over.length) miss(3, 'eduDetail', `Starfleet Academy: no discipline above 4 at this stage (${over.map(lpFull).join(', ')})`);
    }
  }
  if (!val(1)) miss(3, 'eduValue', 'Write your education value');
  l.focus.edu.forEach((f, i) => { if (!f.trim()) miss(3, 'eduDetail', `Add education focus ${i + 1}`); });
  // Step Five & Six — Career
  if (!c.careerLength) miss(4, 'careerLength', 'Choose your career length');
  if (!val(2)) miss(4, 'careerValue', 'Write your career length value');
  [1, 2].forEach(n => {
    const e = lpEvent(n === 1 ? c.careerEvent : c.careerEvent2);
    if (!e) { miss(4, 'event' + n, `Choose career event ${n}`); return; }
    const a = e.attr === 'any' ? l['ev' + n + 'Attr'] : e.attr;
    const d = e.disc === 'any' ? l['ev' + n + 'Disc'] : e.disc;
    if (LP_ATTR_KEYS.includes(a)) attr[a]++; else miss(4, 'event' + n, `Choose the attribute for career event ${n}`);
    if (LP_DISC_KEYS.includes(d)) disc[d]++; else miss(4, 'event' + n, `Choose the discipline for career event ${n}`);
    if (!l.focus['ev' + n].trim()) miss(4, 'event' + n, `Add the focus for career event ${n}`);
  });
  if (c.careerEvent && c.careerEvent === c.careerEvent2) miss(4, 'event2', 'Choose two different career events');
  // Step Seven — Finishing Touches
  const fa = [...new Set(l.finAttr)].filter(k => LP_ATTR_KEYS.includes(k));
  const fd = [...new Set(l.finDisc)].filter(k => LP_DISC_KEYS.includes(k));
  if (fa.length < 2) miss(5, 'fin', `Choose ${2 - fa.length} more attribute${fa.length === 1 ? '' : 's'} to raise`);
  if (fd.length < 2) miss(5, 'fin', `Choose ${2 - fd.length} more discipline${fd.length === 1 ? '' : 's'} to raise`);
  fa.forEach(k => attr[k]++); fd.forEach(k => disc[k]++);
  if (!val(3)) miss(5, 'finValue', 'Write your final value');
  const before = {attr:{...attr}, disc:{...disc}};
  // Point moves only make sense against the scores they were made for; if an
  // earlier step changed those scores since, the moves are dropped.
  if ((Object.keys(l.adjAttr).length || Object.keys(l.adjDisc).length) && l.adjBase !== JSON.stringify(before)) {
    l.adjAttr = {}; l.adjDisc = {}; l.adjBase = '';
  }
  const capIssues = [];
  [['attr', attr, l.adjAttr, 12, 'attribute'], ['disc', disc, l.adjDisc, 5, 'discipline']].forEach(([kind, tot, adj, cap, word]) => {
    Object.entries(adj).forEach(([k, v]) => { if (tot[k] !== undefined) tot[k] += v; });
    const net = Object.values(adj).reduce((s, v) => s + v, 0);
    if (net < 0) capIssues.push(`Place ${-net} reduced ${word} point${net === -1 ? '' : 's'} elsewhere`);
    const keys = Object.keys(tot);
    keys.filter(k => tot[k] > cap).forEach(k => capIssues.push(`${lpFull(k)} is above ${cap} — reduce it`));
    if (keys.filter(k => tot[k] === cap).length > 1) capIssues.push(`Only one ${word} may be ${cap} — reduce one`);
  });
  issues[5].push(...capIssues);
  if (capIssues.length) secs.caps = true;
  return {attr, disc, before, issues, secs, all: issues.flat(), capIssues};
}

// Shared UI pieces
const lpBox = (title, inner, accent) => `<div style="background:var(--surface2);border:1px solid ${accent ? 'var(--accent)' : 'var(--border)'};border-radius:4px;padding:10px;margin-bottom:10px">

const lpHint = t => `<div style="font-size:10px;color:var(--muted);margin-bottom:6px">${t}</div>`;
function lpKeyBtns(keys, chosen, fn, disabledKeys) {

  return keys.map(k => {
    const dis = disabledKeys && disabledKeys.includes(k);

  }).join('');
}
const lpRow = (label, inner) => `<div style="font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span style="color:var(--muted);min-width:118px">${label}</span>${inner}</div>`;
function lpStepIssues(i) {

  if (!list.length) return `<div style="font-size:11px;color:var(--success);margin-top:4px">✓ Step complete</div>`;
  return `<div style="font-size:10px;color:var(--danger);margin-top:4px;line-height:1.6">Still to do: ${list.map(escH).join(' · ')}</div>`;
}
function lpValueInput(slot, label, hint, list) {
  const v = (S.char.values || [])[slot] || '';
  return lpBox(label, `${hint ? lpHint(hint) : ''}<div style="display:flex;gap:6px">

    <button class="btn btn-xs" onclick="suggestValue(${slot},${list})">🎲 Suggest</button></div>`);
}
function lpFocusInput(path, idx, label, examples) {

    <input value="${escH(cur)}" placeholder="Type a focus, or pick an example…" style="width:100%;background:var(--surface3);border:1px solid ${cur ? 'var(--border)' : 'var(--danger)'};color:var(--text);padding:4px 8px;border-radius:3px;font-size:12px" onchange="lpSetFocus('${path}',${idx},this.value)">
    ${chips ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">${chips}</div>` : ''}</div>`;
}
function lpBonusText(obj) { return Object.entries(obj).map(([k, v]) => `${lpFull(k)} +${v}`).join(', '); }
function lpListText(list, all) { return (list && list[0] === 'any') ? 'any' : (list || []).map(lpFull).join(' / '); }

// ── Step sections ──────────────────────────────────────────────────────────
// Each lifepath step is built from sections, and lpCompute() tags every
// missing item with the section that fixes it. A step shows all its sections;
// Finishing Touches shows just the unfinished ones from every step, inline,
// so nothing sends the player back through the wizard. Nothing is collapsed:
// every table is open and choices are buttons, not dropdowns.
const LP_TABLE_HEAD = (t, extra) => `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px"><div style="font-size:11px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;font-weight:700">${t}</div>${extra || ''}</div>`;
const lpVal = i => ((S.char.values || [])[i] || '').trim();

// Step 1 — Species & Era
function lpSecEra(c) {
  const selEra = c._selectedEra || '';
  const table = lpEraTable(selEra);
  const eraBadge = ERA_BADGES.find(e => e.keys.some(k => selEra.includes(k)));
  const badge = eraBadge ? `<img src="${eraBadge.src}" style="height:48px;width:auto;object-fit:contain;filter:drop-shadow(0 0 6px var(--accent));flex-shrink:0" onerror="this.style.display='none'">` : `<div style="width:48px;height:48px;border:2px dashed var(--accent-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:var(--accent-dim)">?</div>`;
  const btns = ERAS.map(e => `<button class="btn btn-sm${selEra === e ? ' btn-accent' : ''}" onclick="lpSetEra('${escQ(e)}')">${escH(e)}</button>`).join('');
  return `<div style="background:var(--accent-glow);border:2px solid ${selEra ? 'var(--accent)' : 'var(--danger)'};border-radius:8px;padding:12px;margin-bottom:12px">

// Step 7 — Finishing Touches. Anything still missing from earlier steps is
// rendered right here, as the same controls, so it can be finished in place.
function renderLP5() {
  const c = S.char; const l = lp(); const r = lpCompute();
  let missing = '';
  for (let step = 0; step < 5; step++) {
    const secs = LP_SECTIONS.filter(s => s[0] === step && r.secs[s[1]]);
    if (!secs.length) continue;
    missing += `<div style="font-size:10px;color:var(--danger);letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px;border-bottom:1px solid var(--danger);padding-bottom:3px">${CREATION_STEPS[step].title} — ${r.issues[step].map(escH).join(' · ')}</div>`
      + secs.map(s => s[3](c, l, true)).join('');
  }
  const table = (kind, keys, cap, label) => {
    const adj = kind === 'attr' ? l.adjAttr : l.adjDisc;
    const tot = r[kind];
    const net = Object.values(adj).reduce((s, v) => s + v, 0);
    const atCap = keys.filter(k => tot[k] === cap).length;
    const total = keys.reduce((s, k) => s + tot[k], 0);
    const cells = keys.map(k => {
      const v = tot[k]; const a = adj[k] || 0;
      const canDown = v > cap || (v === cap && atCap > 1);
      const canUp = net < 0 && (v + 1 < cap || (v + 1 === cap && atCap === 0));
      const bad = v > cap || (v === cap && atCap > 1);
      const needAdj = r.capIssues.length || a;
      return `<div class="attr-box"><div class="attr-abbr">${lpAbbr(k)}</div>
        <div class="attr-val" style="${bad ? 'color:var(--danger)' : ''}">${v}</div>
        ${a ? `<div style="font-size:9px;color:var(--accent)">${a > 0 ? '+' : ''}${a} moved</div>` : ''}
        ${needAdj ? `<div style="display:flex;gap:4px;justify-content:center;margin-top:2px">
          <button class="btn btn-xs" ${canDown ? '' : 'disabled style="opacity:.3"'} onclick="lpAdj('${kind}','${k}',-1)">−</button>
          <button class="btn btn-xs" ${canUp ? '' : 'disabled style="opacity:.3"'} onclick="lpAdj('${kind}','${k}',1)">+</button></div>` : ''}
        <div class="attr-full">${lpFull(k)}</div></div>`;
    }).join('');
    return `<div style="font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:6px 0 4px">${label} — total ${total} (max ${cap}, only one at ${cap})${Object.keys(adj).length ? ` <button class="btn btn-xs" onclick="lpClearAdj('${kind}')">reset moves</button>` : ''}</div><div class="attr-grid">${cells}</div>`;
  };
  return `<p style="font-size:11px;color:var(--muted);margin-bottom:8px">Step Seven: raise two different attributes and two different disciplines by 1, and add a final value. Then check the limits — no attribute above 12 and only one at 12; no discipline above 5 and only one at 5. Move any extra points to other scores.</p>
  ${missing ? `<div id="lp-missing" style="border:2px solid var(--danger);border-radius:6px;padding:10px 12px;margin-bottom:12px">
      <div style="font-size:12px;color:var(--danger);font-weight:700;letter-spacing:1px;text-transform:uppercase">Still needed — finish these right here</div>${missing}</div>` : ''}
  <div id="lp-fin">${lpBox('Final Additions', lpRow('Attributes +1 (two):', lpKeyBtns(LP_ATTR_KEYS, l.finAttr, 'lpToggleFinAttr')) + lpRow('Disciplines +1 (two):', lpKeyBtns(LP_DISC_KEYS, l.finDisc, 'lpToggleFinDisc')), true)}</div>
  ${lpValueInput(3, 'Final Value', 'Perhaps reflecting your career events, or anything else about your character.', 5)}
  ${lpBox('Your Officer', table('attr', LP_ATTR_KEYS, 12, 'Attributes') + table('disc', LP_DISC_KEYS, 5, 'Disciplines')
    + `<div style="font-size:11px;color:var(--muted);margin-top:8px">Focuses: ${(c.focuses || []).length ? c.focuses.map(f => `<strong style="color:var(--text)">${escH(f)}</strong>`).join(', ') : '—'}</div>`)}
  ${r.all.length
    ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">${[missing ? 'Finish the items in the red box above' : '', ...r.issues[5].map(escH)].filter(Boolean).join(' · ')} — then press Next.</div>`
    : `<div style="font-size:11px;color:var(--success);margin-top:4px">✓ Your lifepath is complete — press Next for officer details.</div>`}`;
}

// Setters — each saves and re-renders
function lpSet(key, val) { lp()[key] = val; saveSlot(); renderCurrentTab(); }
function lpSetMixed(name) { const l = lp(); l.mixed = name; l.mixedOn = !!name || l.mixedOn; l.speciesPick = []; saveSlot(); renderCurrentTab(); }
function lpSetHeritage(on) {
  const l = lp(); l.mixedOn = on;
  if (!on) { l.mixed = ''; l.speciesPick = []; }
  saveSlot(); renderCurrentTab();
}
function lpSetEra(e) { S.char._selectedEra = e; window._lpSpeciesFilter = null; saveSlot(); renderCurrentTab(); }
function lpSetEnvOther(name) { const l = lp(); l.envOther = name; l.envAttr = ''; saveSlot(); renderCurrentTab(); }
function lpToggleSpeciesPick(k) {
  const l = lp(); const i = l.speciesPick.indexOf(k);
  if (i >= 0) l.speciesPick.splice(i, 1); else if (l.speciesPick.length < 3) l.speciesPick.push(k);
  saveSlot(); renderCurrentTab();
}
function lpSetEnvTable(k) {
  const l = lp(); if (l.envTable !== k) { S.char._selectedEnv = ''; l.envAttr = ''; l.envDisc = ''; l.envOther = ''; }
  l.envTable = k; saveSlot(); renderCurrentTab();
}
function lpSetEnvAttr(k) { lpSet('envAttr', k); }
function lpSetEnvDisc(k) { lpSet('envDisc', k); }
function lpSetOutlookGroup(k) {
  const l = lp(); if (l.outlookGroup !== k) { S.char._selectedUpbringing = ''; l.outlookYes = null; l.outlookDisc = ''; }
  l.outlookGroup = k; saveSlot(); renderCurrentTab();
}
function lpSetOutlookDisc(k) { lpSet('outlookDisc', k); }
function lpSetEduCat(name) {
  const l = lp(); if (l.eduCat !== name) setCreationTrack('');
  l.eduCat = name; saveSlot(); renderCurrentTab();
}
function lpEduAttr(k, d) {
  const l = lp(); const v = (l.eduAttr[k] || 0) + d;
  const sum = Object.values(l.eduAttr).reduce((s, x) => s + x, 0) + d;
  if (v < 0 || v > 2 || sum > 3) return;
  if (v) l.eduAttr[k] = v; else delete l.eduAttr[k];
  saveSlot(); renderCurrentTab();
}
function lpSetEduMajor(k) {
  const l = lp(); l.eduMajor = k;
  l.eduMinor = l.eduMinor.map(m => m === k ? '' : m);
  saveSlot(); renderCurrentTab();
}
function lpSetOfficerMinor(k) { const l = lp(); l.eduMinor = ['', k]; saveSlot(); renderCurrentTab(); }
function lpToggleEduMinor(k) {
  const l = lp(); const cur = l.eduMinor.filter(Boolean);
  const i = cur.indexOf(k);
  if (i >= 0) cur.splice(i, 1); else if (cur.length < 2 && k !== l.eduMajor) cur.push(k);
  l.eduMinor = [cur[0] || '', cur[1] || ''];
  saveSlot(); renderCurrentTab();
}
function lpSetSwapFrom(k) { const l = lp(); l.eduSwapFrom = l.eduSwapFrom === k ? '' : k; if (l.eduSwapTo === k) l.eduSwapTo = ''; saveSlot(); renderCurrentTab(); }
function lpSetSwapTo(k) { const l = lp(); l.eduSwapTo = l.eduSwapTo === k ? '' : k; saveSlot(); renderCurrentTab(); }
function lpSetEvent(n, name) {
  const l = lp();
  if (n === 1) S.char.careerEvent = name; else S.char.careerEvent2 = name;
  l['ev' + n + 'Attr'] = ''; l['ev' + n + 'Disc'] = '';
  saveSlot(); renderCurrentTab();
}
function lpSetEvAttr1(k) { lpSet('ev1Attr', k); }
function lpSetEvAttr2(k) { lpSet('ev2Attr', k); }
function lpSetEvDisc1(k) { lpSet('ev1Disc', k); }
function lpSetEvDisc2(k) { lpSet('ev2Disc', k); }
function lpToggleTwo(key, k) {
  const l = lp(); const cur = l[key]; const i = cur.indexOf(k);
  if (i >= 0) cur.splice(i, 1); else if (cur.length < 2) cur.push(k);
  // Raising a score can change which points need moving, so moves start over.
  l.adjAttr = {}; l.adjDisc = {};
  saveSlot(); renderCurrentTab();
}
function lpToggleFinAttr(k) { lpToggleTwo('finAttr', k); }
function lpToggleFinDisc(k) { lpToggleTwo('finDisc', k); }
function lpAdj(kind, k, d) {
  const l = lp(); l.adjBase = JSON.stringify(lpCompute().before);
  const adj = kind === 'attr' ? l.adjAttr : l.adjDisc;
  adj[k] = (adj[k] || 0) + d;
  if (!adj[k]) delete adj[k];
  saveSlot(); renderCurrentTab();
}
function lpClearAdj(kind) { const l = lp(); if (kind === 'attr') l.adjAttr = {}; else l.adjDisc = {}; saveSlot(); renderCurrentTab(); }
function lpSyncFocuses() {
  const f = lp().focus;
  const list = [f.outlook, ...f.edu, f.ev1, f.ev2].map(x => (x || '').trim()).filter(Boolean);
  S.char.focuses = [...new Set(list)];
}
function lpFillEduFocus(v) {
  const edu = lp().focus.edu;
  if (edu.some(f => f.trim().toLowerCase() === v.toLowerCase())) return;
  const i = edu.findIndex(f => !f.trim());
  if (i >= 0) lpSetFocus('edu', i, v);
}
function lpSetFocus(path, idx, v) {
  const f = lp().focus;
  if (idx === null) f[path] = v; else f[path][idx] = v;
  lpSyncFocuses(); saveSlot(); renderCurrentTab();
}

// Choosing a different option clears the picks that belonged to the old one,
// so a stale choice can never be applied invisibly on Finish.
function setCreationSpecies(name) {
  const l = lp();
  if (S.char._selectedSpecies !== name) { l.speciesPick = []; l.mixed = ''; if (lpEnv(S.char) && lpEnv(S.char).attrs === 'SPECIES_ATTRIBUTES') l.envAttr = ''; }
  S.char._selectedSpecies = name; saveSlot(); renderCurrentTab();
}
function setCreationEnv(name) {
  const l = lp();
  if (S.char._selectedEnv !== name) { l.envAttr = ''; l.envDisc = ''; l.envOther = ''; }
  // Both matrixes are on screen; the environment picked decides which one.
  const tbl = Object.keys(LP_ENVIRONMENTS).find(k => LP_ENVIRONMENTS[k].some(e => e.name === name));
  if (tbl) l.envTable = tbl;
  S.char._selectedEnv = name; saveSlot(); renderCurrentTab();
}
function setCreationUpbringing(name, group) {
  const l = lp();
  if (group && group !== l.outlookGroup) { l.outlookGroup = group; S.char._selectedUpbringing = ''; }
  if (S.char._selectedUpbringing !== name) { l.outlookYes = null; l.outlookDisc = ''; }
  S.char._selectedUpbringing = name; saveSlot(); renderCurrentTab();
}
function setCreationTrack(name) {
  const l = lp();
  if (S.char._selectedTrack !== name) { l.eduAttr = {}; l.eduMajor = ''; l.eduMinor = ['', '']; l.eduSwapFrom = ''; l.eduSwapTo = ''; }
  const cat = LP_EDUCATION.find(x => x.tracks.some(t => t.name === name));
  if (cat) l.eduCat = cat.cat;
  S.char._selectedTrack = name; saveSlot(); renderCurrentTab();
}

// Rolls follow the book's matrixes
function lpRollSpecies() {
  let t = lpEraTable(S.char._selectedEra);
  while (!t) { const r = lpRoll(); t = r <= 6 ? 'ENT' : r <= 12 ? 'TOS' : r <= 18 ? 'TNG' : ''; }
  window._lpSpeciesFilter = t;
  setCreationSpecies(LP_SPECIES_TABLES[t][lpRoll() - 1]);
}
function lpRollEnv(table) {
  const tbl = table || lp().envTable; if (!LP_ENVIRONMENTS[tbl]) return;
  const r = lpRoll(); const e = LP_ENVIRONMENTS[tbl].find(e => lpInRange(r, e.roll));
  if (e) setCreationEnv(e.name);
}
function lpRollOutlook(group) {
  const g = group || lp().outlookGroup;
  const list = LP_OUTLOOKS[g]; let o = null;
  while (!o) { const r = lpRoll(); o = list.find(x => lpInRange(r, x.roll)); }   // 19–20: reroll
  setCreationUpbringing(o.name, g);
}
function lpRollEducation() {
  const cat = LP_EDUCATION.find(c => lpInRange(lpRoll(), c.roll));
  let t = null;
  while (!t) { const r = lpRoll(); t = cat.tracks.find(x => lpInRange(r, x.roll)); }   // Civilian 19–20: reroll
  setCreationTrack(t.name);
}
function lpRollEduCat() {
  const r = lpRoll(); const cat = LP_EDUCATION.find(c => lpInRange(r, c.roll));
  lpSetEduCat(cat.cat);
}
function lpRollEduTrack() {
  const cat = LP_EDUCATION.find(c => c.cat === lp().eduCat); if (!cat) return;
  let t = null;
  while (!t) { const r = lpRoll(); t = cat.tracks.find(x => lpInRange(r, x.roll)); }   // Civilian 19–20: reroll
  setCreationTrack(t.name);
}
function rollCareerLength() {
  const r = lpRoll(); const cl = LP_CAREER_LENGTH.find(x => lpInRange(r, x.roll));
  S.char.careerLength = cl.name; saveSlot(); renderCurrentTab();
}
function lpRollEvent(n) {
  const other = n === 1 ? S.char.careerEvent2 : S.char.careerEvent;
  let e;
  do { e = LP_CAREER_EVENTS[lpRoll() - 1]; } while (e.name === other);   // two different events
  lpSetEvent(n, e.name);
}

// Wizard navigation. Steps 0–5 are the lifepath; leaving Finishing Touches
// needs a complete, in-limits character, and Finish writes it to the sheet.
function creationNext() {
  const step = S.char.creationStep || 0;
  const LAST_LP = 5;
  if (step >= LAST_LP) {
    const r = lpCompute();
    if (r.all.length) {
      // Everything still missing is shown on Finishing Touches itself; bring
      // the player there (if they've moved past it) and scroll to it.
      S.char.creationStep = LAST_LP; saveSlot(); renderCurrentTab();
      const el = document.getElementById(document.getElementById('lp-missing') ? 'lp-missing' : 'lp-fin');
      if (el) {
        el.scrollIntoView({behavior: 'smooth', block: 'start'});
        if (el.animate) el.animate([{boxShadow: '0 0 0 4px var(--danger)'}, {boxShadow: '0 0 0 0 transparent'}], {duration: 1200});
      }
      return;
    }
  }
  if (step === CREATION_STEPS.length - 1) {
    // Tapping a class only previews it; players took the open preview for a
    // choice and finished without pressing Select. If no ship is chosen yet,
    // the previewed class is the one they meant.
    if (window._shipClassPreview && !S.ship.className) loadShipClass(window._shipClassPreview);
    const c = S.char; const l = lp(); const r = lpCompute();
    LP_ATTR_KEYS.forEach(k => { c[k] = r.attr[k]; });
    LP_DISC_KEYS.forEach(k => { c[k] = r.disc[k]; });
    c.species = lpSpeciesDisplay(c);
    c.era = c._selectedEra || c.era;
    const ol = lpOutlook(c); const g = LP_OUTLOOK_GROUPS[l.outlookGroup];
    c.upbringing = ol ? `${ol.name} (${l.outlookYes ? g.yes : g.no})` : c.upbringing;
    if (!Array.isArray(c.traits)) c.traits = [];
    if (!c.traits.length) c.traits = c.species.split(' / ');
    lpSyncFocuses();
    c.creationComplete = true;
    saveSlot(); renderCurrentTab();
    return;
  }
  S.char.creationStep = step + 1; saveSlot(); renderCurrentTab();
}
function creationBack() {
  S.char.creationStep = Math.max(0, (S.char.creationStep || 0) - 1); saveSlot(); renderCurrentTab();
}

function setCreationDirective(desc) { S.char.directive=desc; saveSlot(); renderCurrentTab(); }
function rollDirective() {
  const d=DIRECTIVE_TABLE[Math.floor(Math.random()*DIRECTIVE_TABLE.length)];
  S.char.directive=d.desc; saveSlot(); renderCurrentTab();
}

function saveShipField(key,val) { S.ship[key]=val; if(key==='name'||key==='registry') { S.char.assignment=(S.ship.name||'')+(S.ship.registry?' '+S.ship.registry:''); } saveSlot(); }
function adjShipSys(key,d) { S.ship[key]=Math.max(5,Math.min(15,(S.ship[key]||7)+d)); saveSlot(); renderCurrentTab(); }
function setShipDept(key,v) { S.ship[key]=v; saveSlot(); renderCurrentTab(); }
function addShipTalent() {
